<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomtens kassaskåp</title>
<meta name="theme-color" content="#14233F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="../../css/gemensam.css?v=7">
<style>
  h1 { margin: 4px 0 14px; font-size: 30px; line-height: 1.1; }
  .ovning { display: inline-block; margin-left: 6px; padding: 2px 10px; border-radius: 999px; background: var(--glod); color: var(--text); font-size: 14px; vertical-align: middle; }

  @keyframes skaka {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  .skakar { animation: skaka .45s ease-in-out; }
  @keyframes gunga { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }

  /* ===== Kuvertet ===== */
  .kuvert-yta { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0 20px; }
  .kuvert {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 3 / 2;
    border: 0;
    padding: 0;
    border-radius: 10px;
    background: linear-gradient(#F3E7CF, #E2D1B0);
    box-shadow: 0 8px 0 rgba(0,0,0,.3);
    cursor: pointer;
    animation: gunga 3s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  /* Fliken: en triangel ovanpå kuvertet. */
  .kuvert::before {
    content: "";
    position: absolute;
    inset: 0 0 35% 0;
    background: linear-gradient(#E9DBBE, #D8C49E);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
  }
  .sigill {
    position: absolute;
    left: 50%; top: 65%;
    width: 52px; height: 52px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #D9504F, #9A1F27 70%);
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    display: grid; place-items: center;
    font-size: 24px;
  }
  /* Trassels förseglade brev, för dem som inte har brevet eller nyckelboken. */
  .forseglat { position: relative; width: min(70vw, 260px); aspect-ratio: 3 / 2; border-radius: 10px; background: linear-gradient(#F3E7CF, #E2D1B0); box-shadow: 0 6px 0 rgba(0,0,0,.3); transform: rotate(-2deg); }
  .forseglat::before { content: ""; position: absolute; inset: 0 0 35% 0; background: linear-gradient(#E9DBBE, #D8C49E); clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 10px 10px 0 0; }
  .forseglat .adress { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #3B2E25; font-weight: 700; font-size: 15px; }
  .forseglat .sigill { top: 58%; width: 44px; height: 44px; font-size: 20px; font-weight: 800; color: #DDF5E6; }
  .sigill.gront { background: radial-gradient(circle at 40% 35%, #4FBF7E, #1D6B40 70%); }
  .vantar { min-height: 1.4em; margin: 0; color: var(--himmel-dampad); font-size: 14px; }

  .brev {
    margin: 24px auto;
    max-width: 380px;
    padding: 24px 22px;
    border-radius: 14px;
    background: #FBF4EA;
    color: #3B2E25;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
    font: 500 25px/1.3 Caveat, "Segoe Print", cursive;   /* tomtens handstil, bara här */
  }
  .brev p { margin: 0 0 16px; }
  .brev .knapp { font-family: var(--text-typsnitt); }
  .brev .underskrift { text-align: right; font-style: italic; }
  .brev .knapp.ljus { color: #6B5A4E; border-color: rgba(59,46,37,.3); }
  .brev .knapp.ljus:hover { color: #3B2E25; border-color: rgba(59,46,37,.55); }

  /* ===== Skåpet ===== */
  .skap {
    position: relative;
    margin: 0 auto 16px;
    max-width: 420px;
    aspect-ratio: 4 / 5;
    border-radius: 22px;
    background: linear-gradient(160deg, #3A4A63, #222E42 70%);
    border: 3px solid #56657E;
    box-shadow: 0 6px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.12);
    perspective: 900px;
  }
  /* Det inre som syns när dörren är öppen. */
  .inne {
    position: absolute;
    inset: 14px;
    border-radius: 14px;
    background: radial-gradient(ellipse at 50% 30%, #1E2B44, #0D1525 80%);
    box-shadow: inset 0 6px 18px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .dorr {
    position: absolute;
    inset: 10px;
    border-radius: 16px;
    background: linear-gradient(160deg, #46587A, #2A3852 75%);
    border: 2px solid #6A7A96;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    transform-origin: left center;
    transition: transform 1.1s cubic-bezier(.5,.1,.3,1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .dorr.oppen { transform: rotateY(-108deg); pointer-events: none; }
  .dorr.ryck { animation: skaka .3s ease-in-out; }
  /* Nitar i hörnen. */
  .nit { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #9AA7BD; box-shadow: inset 0 -1px 0 rgba(0,0,0,.3); }
  .nit.a { left: 10px; top: 10px; } .nit.b { right: 10px; top: 10px; } .nit.c { left: 10px; bottom: 10px; } .nit.d { right: 10px; bottom: 10px; }

  .lampknapp {
    width: 46px; height: 46px;
    border: 3px solid #6A7A96;
    border-radius: 50%;
    padding: 0;
    background: radial-gradient(circle at 40% 35%, #4A3A30, #241A15 75%);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lampknapp:active { transform: scale(.94); }
  .lampknapp { position: relative; }
  /* Ljuset ligger i ett eget lager så att det kan slockna långsamt. */
  .lampknapp::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #FFF6C8, #FFCF45 55%, #D3921A);
    box-shadow: 0 0 20px 6px rgba(255,205,70,.55);
    opacity: 0; transition: opacity 10s linear;
  }
  .lampknapp.lyser::after { opacity: 1; transition: opacity .6s; }
  .lampknapp.lyser { animation: puls 1.6s ease-in-out infinite; }
  @keyframes puls { 50% { transform: scale(1.1); } }
  .lampraden { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* Springan under lampan. När det är ens tur glider Mästarprovets kuvert ut. */
  .springa { position: relative; width: 132px; height: 7px; border-radius: 4px; background: #0E1524; box-shadow: inset 0 2px 3px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.12); }
  /* Mästarprovets kuvert: samma kuvert i springan och under skåpet. */
  /* Kuvertet glider ut i ett stycke ur springan; utkastet klipper bort det som ännu är inne. */
  @keyframes gliUt { from { transform: translateY(-100%); } to { transform: none; } }
  .utkast { position: absolute; left: 4px; top: 4px; width: 124px; height: 79px; overflow: hidden; }
  .litet-kuvert {
    position: relative; width: 124px; height: 76px;
    overflow: hidden; padding: 0; border: 0; border-radius: 0 0 8px 8px;
    background: linear-gradient(#F3E8D2, #E2D2B2);
    color: #3B2E25; font: 700 19px/1 Caveat, "Segoe Print", cursive;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    cursor: pointer;
  }
  .litet-kuvert::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%; background: linear-gradient(#E9DBBE, #D8C49E); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .litet-kuvert .lack {
    position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%);
    border-radius: 50%; display: grid; place-items: center; font-size: 13px;
    background: radial-gradient(circle at 40% 35%, #D9504F, #9A1F27 70%);
    box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(0,0,0,.12);
  }
  .litet-kuvert .lack.guld { background: radial-gradient(circle at 40% 35%, #FBE08A, #C9951E 70%); }
  .litet-kuvert .etikett { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
  .provkuvert { display: block; animation: gliUt .9s ease-out .3s both; }
  .provkuvert.knuff { animation: gunga .5s ease-in-out; }
  .lampraden.tur { margin-bottom: 70px; }
  .svarskuvert { display: block; margin: 0 auto 8px; border-radius: 8px; animation: upp .5s ease-out; }

  /* Mästarprovet läggs ovanpå skåpet. */
  .prov {
    position: absolute; inset: 10px; z-index: 6;
    border-radius: 16px; background: #FBF6EC; color: #3A3127;
    padding: 22px 20px; overflow: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; animation: upp .3s ease-out;
  }
  .prov .mal { margin: 0; font: 700 24px/1.25 var(--rubrik-typsnitt); }
  .prov p { margin: 0; line-height: 1.45; }
  .prov .stor-siffra { font: 700 84px/1 var(--rubrik-typsnitt); color: #8A3B2E; animation: oppna .6s ease-out; }
  .prov .knapp { width: auto; }
  .prov .platshallare { color: #7A6A55; }
  .prov .inledning { font-size: 16px; }
  .prov .skill { font-style: italic; color: #6B5A4E; font-size: 15px; }
  /* Spelet i Mästarprovet fyller hela skärmen. */
  .provspel { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--himmel); animation: upp .3s ease-out; }
  .provspel .topp { display: flex; align-items: center; gap: 8px; padding: 10px 12px calc(10px) 16px; padding-top: max(10px, env(safe-area-inset-top)); background: #0E1830; color: var(--himmel-text); }
  .provspel .topp .mal { flex: 1; margin: 0; font: 700 18px/1.2 var(--rubrik-typsnitt); }
  .provspel .stang { flex: none; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; background: transparent; color: var(--himmel-text); font-size: 18px; cursor: pointer; }
  .provspel .hjalp { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; background: #FBF6EC; color: #3A3127; text-align: center; }
  .provspel .hjalp p { margin: 0; font-size: 15px; line-height: 1.4; animation: upp .3s ease-out; }
  .provspel .hjalp .rad { display: flex; gap: 8px; justify-content: center; }
  .provspel .hjalp .knapp { width: auto; margin: 0; padding: 8px 14px; font-size: 15px; }
  .provspel .hjalp .knapp.ljus { color: #6B5A4E; border-color: rgba(59,46,37,.35); }
  .provspel iframe { flex: 1; width: 100%; border: 0; background: var(--himmel); }

  .hjulen { display: flex; justify-content: center; gap: 8px; }
  .hjulen.skakar { animation: skaka .45s ease-in-out; }
  .hjul { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hjul b {
    display: block;
    width: 52px;
    padding: 8px 0;
    border-radius: 10px;
    background: linear-gradient(#EDE6D8, #C8BEA9);
    color: #2B2B2B;
    font: 600 32px var(--text-typsnitt);
    font-variant-numeric: tabular-nums;
    text-align: center;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.25);
  }
  .pil {
    width: 52px;
    padding: 5px 0;
    border: 0;
    border-radius: 9px;
    background: rgba(255,255,255,.1);
    color: var(--himmel-text);
    font-size: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pil:active { background: rgba(255,255,255,.2); }
  .hjulen.last .pil { opacity: .3; pointer-events: none; }

  /* Vredet: man vrider (trycker) för att pröva koden. */
  /* Ratten: en gammal kassaskåpsratt med ekrar. Man vrider (trycker) för att pröva koden. */
  .vred {
    width: 92px; height: 92px;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    transition: transform .6s cubic-bezier(.4,.1,.3,1);
    -webkit-tap-highlight-color: transparent;
  }
  .vred svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .vred.vrids { transform: rotate(180deg); }
  .vred:disabled { cursor: default; opacity: .7; }
  .hanglas { min-height: 22px; margin: -10px 0 0; color: #FFB4A6; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ===== Inuti: platshållare för akt 2 och 3 ===== */
  .scen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; text-align: center; }
  .smadorrar { display: flex; gap: 14px; }
  .plats { width: 58px; height: 58px; border: 2px dashed rgba(255,255,255,.3); border-radius: 8px; }

  /* ===== Akt 3: tomtens paket ===== */
  .paketscen { justify-content: flex-start; gap: 12px; padding-top: 14px; }
  .pakethylla { display: flex; gap: 6px; padding: 0 4px 8px; border-bottom: 6px solid #6B4E3A; width: 100%; max-width: 330px; justify-content: space-between; box-sizing: border-box; }
  .paketplats { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 25%; }
  .paketplats .ask { width: 100%; max-width: 72px; padding: 0; border: 0; background: none; cursor: pointer; }
  .paketplats .ask svg { display: block; width: 100%; height: auto; }
  .paketplats .ask:focus-visible { outline: 2px solid #FFD66B; outline-offset: 2px; border-radius: 6px; }
  .namnlapp { min-width: 64px; max-width: 100%; padding: 5px 4px; border-radius: 6px; border: 1px solid #D8C8A8; background: #FBF6EC; color: #3A3127; font: 600 13px/1.1 var(--text-typsnitt); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .namnlapp.tom { color: #A89A84; }
  .listbit {
    width: 100%; max-width: 300px; box-sizing: border-box; padding: 16px 16px 20px; text-align: left;
    background: #FBF6EC; color: #3A2F25; transform: rotate(-1.5deg);
    font: 500 21px/1.25 Caveat, "Segoe Print", cursive;
    clip-path: polygon(0 4%, 9% 0, 21% 3%, 34% 0, 47% 4%, 60% 1%, 73% 4%, 86% 0, 100% 3%, 100% 96%, 90% 100%, 77% 97%, 63% 100%, 50% 96%, 37% 100%, 24% 97%, 11% 100%, 0 97%);
  }
  .listbit p { margin: 0 0 6px; }
  .listbit p:last-child { margin: 0; }
  /* Anteckningsboken under skåpet: en matris som i logikpussel, man fyller i själv. */
  /* I akt 3 växer skåpet med innehållet, så att inget tomrum blir kvar och journalen ligger längst ner. */
  .skap.akt3 { aspect-ratio: auto; height: auto; }
  .skap.akt3 .inne { position: relative; inset: auto; margin: 14px; min-height: 380px; }
  .skap.akt3 .scen { position: relative; inset: auto; padding-bottom: 18px; }
  .anteckningar { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
  .liten-journal { width: 132px; height: 84px; padding: 0 0 0 16px; border: 0; border-radius: 5px 12px 12px 5px; cursor: pointer; position: relative;
    background: linear-gradient(90deg, #4E3828, #6B4E3A 14%, #6B4E3A); box-shadow: 0 4px 0 rgba(0,0,0,.35), inset -3px 0 0 rgba(0,0,0,.18); transform: rotate(-3deg); }
  .liten-journal::before { content: ''; position: absolute; left: 7px; top: 9px; bottom: 9px; width: 3px; background: repeating-linear-gradient(to bottom, #E8D9BF 0 6px, transparent 6px 12px); }
  .liten-journal .etikett { display: inline-block; padding: 4px 10px; border-radius: 3px; background: #FBF6EC; color: #3A2F25; font: 700 18px/1 Caveat, "Segoe Print", cursive; }
  .anteckningar.oppen { padding: 9px 9px 9px 22px; border-radius: 6px 14px 14px 6px; box-sizing: border-box; background: linear-gradient(90deg, #4E3828, #6B4E3A 14%, #6B4E3A); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .anteckningar .stang { position: absolute; top: 2px; right: 4px; z-index: 1; width: 30px; height: 30px; border: 0; border-radius: 50%; background: #6B4E3A; color: #FBF6EC; font-size: 22px; line-height: 1; cursor: pointer; }
  .matrisblad { width: 100%; box-sizing: border-box; padding: 26px 6px 12px; border-radius: 3px 8px 8px 3px; background: #FBF6EC; color: #3A2F25; }
  .matris { display: grid; grid-template-columns: 58px repeat(8, minmax(0, 1fr)); max-width: 360px; margin: 0 auto; }
  .matris .rubrik { font: 700 13px/1 var(--text-typsnitt); text-align: center; color: #7A6A55; padding: 0 0 4px; }
  .matris .huvud { display: flex; align-items: center; justify-content: center; height: 26px; font-weight: 700; font-size: 14px; }
  .matris .rad-namn { display: flex; align-items: center; font-size: 13px; font-weight: 600; padding-right: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .matris .prick { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.25); }
  .matris .cell { aspect-ratio: 1; border: 0; border-right: 1px solid #CDBFA6; border-bottom: 1px solid #CDBFA6; background: #fff; padding: 0; font-size: 17px; font-weight: 800; line-height: 1; cursor: pointer; color: #3A2F25; }
  .matris .cell.forst { border-left: 2px solid #3A2F25; }
  .matris .cell.grans { border-right: 2px solid #3A2F25; }
  .matris .cell.topp { border-top: 2px solid #3A2F25; }
  .matris .cell.botten { border-bottom: 2px solid #3A2F25; }
  .matris .cell.ja { color: #237A45; }
  .matris .cell.nej { color: #A92D33; }
  .matris .cell.kanske { color: #B98A1E; }
  .matris .tomrum { grid-column: span 4; }
  .matrisblad .sudda { display: block; margin: 12px auto 0; padding: 6px 14px; border-radius: 999px; border: 1px solid #CDBFA6; background: none; color: #7A6A55; font: 600 13px/1 var(--text-typsnitt); cursor: pointer; }
  .platshallare { margin: 0; font-size: 14px; color: var(--himmel-dampad); }

  /* ===== Akt 2: Pyssels dörr och granen ===== */
  .dorrplats { position: relative; width: 130px; height: 184px; perspective: 420px; }
  .dorrplats .bakom {
    position: absolute; inset: 0; border-radius: 10px; border: 0; padding: 0;
    background: radial-gradient(ellipse at 50% 45%, #3B3020, #120E08 85%); box-shadow: inset 0 4px 14px rgba(0,0,0,.7);
    font-size: 40px; display: grid; place-items: center; color: inherit;
  }
  .dorrplats .bakom:disabled { cursor: default; }
  .dorrplats .bakom:not(:disabled) { cursor: pointer; animation: lysBakom 2.4s ease-in-out infinite; }
  @keyframes lysBakom { 50% { box-shadow: inset 0 4px 14px rgba(0,0,0,.7), 0 0 18px rgba(255,214,107,.45); } }
  .smadorr {
    position: absolute; inset: 0; border-radius: 10px; border: 3px solid;
    transform-origin: left center; transition: transform .9s cubic-bezier(.3,.7,.3,1);
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
  }
  .smadorr.lila { border-color: #B58CFF; background: linear-gradient(160deg, #5A4185, #3A2A5C); }
  .smadorr.gron { border-color: #6FD49A; background: linear-gradient(160deg, #2F6E4D, #1D4A33); }
  .smadorr .skylt {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.3); font-size: 13px; font-weight: 600; color: #F4F1EA;
  }
  .smadorr .fylling {
    position: absolute; inset: 38px 13px 14px; border-radius: 6px;
    border: 2px solid rgba(255,255,255,.16); box-shadow: inset 0 0 0 4px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; padding-top: 12px;
  }
  .smadorr .handtag {
    position: absolute; right: 8px; top: 54%; width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFE9A8, #C9952E 60%, #7C5A17); box-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .smadorr[role="button"] { cursor: pointer; }
  .smadorr.glant {
    transform: rotateY(-24deg);
    box-shadow: 10px 0 18px -4px rgba(255,214,107,.55), 0 4px 0 rgba(0,0,0,.35);
    animation: glant 2.6s ease-in-out infinite;
  }
  @keyframes glant { 50% { transform: rotateY(-32deg); box-shadow: 14px 0 22px -2px rgba(255,214,107,.7), 0 4px 0 rgba(0,0,0,.35); } }
  .smadorr.oppen { transform: rotateY(-105deg); pointer-events: none; }
  /* Trassels dörr sitter på höger gångjärn, så att den öppnas utåt och inte över Pyssels. */
  .smadorr.gron { transform-origin: right center; }
  .smadorr.gron .handtag { right: auto; left: 6px; }
  .smadorr.gron .fylling { left: 24px; right: 10px; }
  .smadorr.gron.oppen { transform: rotateY(100deg); }
  /* Trassels dörr har gångjärnet till höger, så den glider upp åt andra hållet. */
  .smadorr.gron.glant { transform: rotateY(24deg); box-shadow: -10px 0 18px -4px rgba(255,214,107,.55), 0 4px 0 rgba(0,0,0,.35); animation-name: glant-h; }
  .smadorr.gron.glant.oppen { transform: rotateY(100deg); animation: none; }
  @keyframes glant-h { 50% { transform: rotateY(32deg); box-shadow: -14px 0 22px -2px rgba(255,214,107,.7), 0 4px 0 rgba(0,0,0,.35); } }

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dag = Advent.hamtaDag() || 24;
  Advent.markeraOppnad(dag);

  var LAS_TID = 10;

  // Kassaskåpsratt: ring, sex ekrar med knoppar och ett nav i mitten.
  var RATT_SVG = (function () {
    var ekrar = '';
    for (var i = 0; i < 6; i++) {
      var v = i * 60 * Math.PI / 180, x = 50 + 44 * Math.sin(v), y = 50 - 44 * Math.cos(v);
      ekrar += '<line x1="50" y1="50" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#B9C2D0" stroke-width="6" stroke-linecap="round"/>' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6.5" fill="#E3E8EF" stroke="#7D899C" stroke-width="1.5"/>';
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="31" fill="none" stroke="#9AA6B8" stroke-width="6"/>' + ekrar +
      '<circle cx="50" cy="50" r="13" fill="#D3D9E2" stroke="#7D899C" stroke-width="2"/>' +
      '<circle cx="50" cy="50" r="4" fill="#7D899C"/></svg>';
  })();   // sekunder som hjulen är låsta efter fel kod

  // Svaren jämförs som hashar, så att de riktiga svaren inte står i klartext här.
  // Exempelsvaren i testläget får synas. De riktiga fylls i när pusslen är byggda (null = inte klart än).
  var SALT = 'kassaskap-2026:';
  function hash(svar) { return String(Advent.hashStrang(SALT + svar)); }
  var SVAR = {
    test: {
      kod: '3816', ord: 'GRAN',
      brev: 'JAG HAR NÅLAR MEN SYR ALDRIG',
      // Pyssels gran: femton platser, rad för rad uppifrån (1, 2, 3, 4, 5), 'form:färg'. blink = ordningen kulorna lyser i när granen stämmer.
      gran: {
        pynt: ['stjarna:guld', 'kula:rod', 'klocka:bla', 'kapp:silver', '', 'kula:guld',
          'klocka:rod', 'stjarna:silver', '', 'kula:bla', '', 'kapp:rod', 'klocka:guld', 'stjarna:bla', ''],
        blink: ['guld', 'rod', 'silver', 'bla']
      },
      // Tomtens paket: plats 1 till 4 från vänster, 'namn:bandfärg'. bitar = listbiten på telefon {A}, {B}, {C}, {D} (tre ledtrådar var).
      // Kontrollerat med kodlaset/sok.py: exakt en lösning, och varje bit behövs.
      // Gåtans knuffar: ledtråd, tydligare ledtråd, antal bokstäver och första bokstaven.
      gataKnuffar: ['Det är en gåta. Vad har nålar men syr aldrig?', 'Den står i stugan i december.', 'Svaret har fyra bokstäver och börjar på G.'],
      paket: {
        svar: 'Daniel:rod Josefin:guld Behnosh:bla Joel:gron',
        pekar: [[1, 'Josefin', 'guld'], [3, 'Joel', 'gron']],   // knuff 2 och 3: [plats, namn, band]
        bitar: [
          ['Det röda bandet sitter i en kant.', 'Behnoshs paket har inte rött band.', 'Det blå bandet sitter inte på Joels paket.'],
          ['Paketet med guldband står bredvid Daniels paket.', 'Josefins paket har inte blått band.', 'Joels paket har inte rött band.'],
          ['Guldbandet sitter inte på ett paket i kanten.', 'Joels paket står i en kant.', 'Daniels paket har inte grönt band.'],
          ['Daniels paket står inte längst till höger.', 'Behnoshs och Daniels paket står inte bredvid varandra.', 'Paketet med blått band står bredvid paketet med guldband.']
        ]
      }
    },

  };

  // ===== Tillstånd =====
  // steg: kuvert → las (ytterdörren) → akt2 → akt3 → oppet
  var STEG = ['kuvert', 'las', 'akt2', 'akt3', 'oppet'];
  var STEG_NAMN = { kuvert: 'Kuvertet', las: 'Sifferlåset', akt2: 'Akt 2', akt3: 'Akt 3', oppet: 'Öppet' };
  var test = Advent.lasa('kassaskap-testlage', false);
  function nyckel() { return 'kassaskap:' + (test ? 'test' : dag); }
  function nyttTillstand() { return { steg: 'kuvert', hjul: [0, 0, 0, 0], lastTill: 0, sett: {}, testPlats: 0, testAntal: 0 }; }
  var s;
  function spara() { Advent.spara(nyckel(), s); ritaTest(); }
  function svar() { return SVAR[test ? 'test' : 'riktig']; }

  // Versaler, mellanslag och skiljetecken spelar ingen roll.
  function stada(t) { return String(t).toUpperCase().replace(/[^A-ZÅÄÖÉÜ0-9]/g, ''); }
  function stammer(gissning, facit) {
    if (facit == null) return false;
    return test ? stada(gissning) === stada(facit) : hash(stada(gissning)) === facit;
  }

  function el(tagg, klass, text) {
    var e = document.createElement(tagg);
    if (klass) e.className = klass;
    if (text != null) e.textContent = text;
    return e;
  }
  function skaka(e) {
    e.classList.remove('skakar');
    void e.offsetWidth;
    e.classList.add('skakar');
  }

  // ===== Pratbubblor =====
  var FIGURER = {
    tomten: { emoji: '🎅', namn: 'Tomten' },
    pyssel: { emoji: '👩‍🎤', namn: 'Pyssel' },

  };
  var pratRuta = null;

  // Bygger en pratruta: Pyssel och Trassel i var sitt hörn, tomten ovanför Pyssel när han pratar.
  // Den som inte pratar är nedtonad.
  function pratYta(vem, text, mer) {
    var f = FIGURER[vem];
    var ruta = el('div', 'prat');
    function figur(namn) {
      var e = el('div', 'figur ' + namn + (namn === vem ? '' : ' tyst'), FIGURER[namn].emoji);
      e.setAttribute('aria-hidden', 'true');
      return e;
    }
    var rad = el('div', 'rad');
    var bubbla = el('div', 'bubbla ' + vem);
    bubbla.appendChild(el('span', 'vem', f.namn));

  // Visar repliker en i taget i skåpet. Tryck var som helst för nästa. repliker: [[vem, text], ...]
  function prata(yta, repliker, klar) {
    var i = 0;
    function visa() {
      if (pratRuta) pratRuta.remove();
      if (i >= repliker.length) { pratRuta = null; if (klar) klar(); return; }
      var r = repliker[i], mer = i < repliker.length - 1;
      var ruta = pratYta(r[0], r[1], mer);
      ruta.setAttribute('role', 'button');
      ruta.setAttribute('aria-label', FIGURER[r[0]].namn + ': ' + r[1] + (mer ? '. Tryck för nästa.' : ''));
      ruta.tabIndex = 0;
      ruta.addEventListener('click', function (e) { e.stopPropagation(); i++; visa(); });
      ruta.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); i++; visa(); } });
      yta.appendChild(ruta);
      pratRuta = ruta;
      ruta.focus({ preventScroll: true });
    }
    visa();
  }

  // ===== Knuffar (om man fastnar) =====
  // Efter en stund utan att steget är klart, eller efter 5 fel, tittar ett barnbarn fram i skåpets nederkant.
  // Tryck = nästa knuff. Tiden räknas från när steget började eller från förra knuffen, och sparas.
  // k: { vem: 'pyssel' | 'trassel' | 'bada', forsta: minuter, mellan: minuter, nivaer: [replik eller funktion], klar: funktion }
  var KNUFF_MIN = 60000, KNUFF_FEL = 5;
  var knuffKoll = null, aktivKnuff = null;
  function stoppaKnuff() {
    clearInterval(knuffKoll);
    knuffKoll = null;
    if (aktivKnuff && aktivKnuff.fig) aktivKnuff.fig.remove();
    aktivKnuff = null;
  }
  function knuff(inne, id, k) {
    stoppaKnuff();
    k.nivaer = k.nivaer.filter(Boolean);
    if (!k.nivaer.length) return;
    if (!s.knuff) s.knuff = {};
    if (!s.knuff[id]) { s.knuff[id] = { niva: 0, sedan: Date.now(), fel: 0 }; spara(); }
    var a = aktivKnuff = { id: id, fig: null };
    function koll() {
      var st = s.knuff && s.knuff[id];
      if (aktivKnuff !== a || !inne.isConnected || !st) { if (aktivKnuff === a) stoppaKnuff(); return; }
      if (st.niva >= k.nivaer.length || (k.klar && k.klar())) { if (a.fig) { a.fig.remove(); a.fig = null; } return; }
      if (a.fig) return;
      if (Date.now() - st.sedan < (st.niva === 0 ? k.forsta : k.mellan) * KNUFF_MIN && st.fel < KNUFF_FEL) return;
      var fig = a.fig = el('div', 'tittar');
      (k.vem === 'bada' ? ['pyssel', 'trassel'] : [k.vem]).forEach(function (vem) {
        var b = el('button', 'titta ' + vem, FIGURER[vem].emoji);
        b.type = 'button';
        b.setAttribute('aria-label', FIGURER[vem].namn + ' tittar fram. Tryck för en knuff.');
        b.addEventListener('click', function () {
          var n = st.niva;
          fig.remove();
          a.fig = null;
          st.niva++;
          st.sedan = Date.now();
          st.fel = 0;
          spara();
          var steg = k.nivaer[n];
          var rep = typeof steg === 'function' ? steg() : steg;
          if (rep) prata(inne, Array.isArray(rep[0]) ? rep : [rep]);
        });
        fig.appendChild(b);
      });
      inne.appendChild(fig);
    }
    koll();
    knuffKoll = setInterval(koll, 1000);
  }
  function knuffFel() {
    var st = aktivKnuff && s.knuff && s.knuff[aktivKnuff.id];
    if (st) { st.fel++; spara(); }
  }

  // Fel-repliker byts för varje fel och börjar om när de är slut.
  function roterande(lista) {
    var n = 0;
    return function () { var r = lista[n % lista.length]; n++; return r; };
  }

  // ===== Lampknapparna och turordningen =====
  // Ordningen lottas likadant på alla telefoner (samma frö). Lamporna tänds i den ordningen,
  // och ordningen på lamporna är ordningen på siffrorna i koden.
  var ORDNING_FRO = 'kassaskap-ordning-2026';
  var tur = { spelare: null, antal: 0 };   // från arket: vilka som finns och hur många som är klara med dag 24

  function ordning(spelare) { return blandaFast(spelare, ORDNING_FRO); }
  // Blandar namnen likadant på alla telefoner: sorterar först, sedan en blandning med fast frö.
  function blandaFast(spelare, fro) {
    var lista = spelare.slice().sort(function (a, b) { return a.localeCompare(b, 'sv'); });
    var slump = Advent.skapaSlump(fro);
    for (var i = lista.length - 1; i > 0; i--) {
      var j = Math.floor(slump() * (i + 1)), t = lista[i];
      lista[i] = lista[j];
      lista[j] = t;
    }
    return lista;
  }
  function minPlats() {
    if (test) return s.testPlats || 0;
    var namn = Advent.Resultat.namn();
    return tur.spelare && namn ? ordning(tur.spelare).indexOf(namn) : -1;
  }
  function klaraNu() { return test ? (s.testAntal || 0) : tur.antal; }
  function minTur() { var p = minPlats(); return p >= 0 && !s.provKlar && klaraNu() === p; }
  function siffraFor(plats) {
    var k = test ? SVAR.test.kod : SVAR.riktig.siffror;
    return k ? k.charAt(plats) : '?';
  }

      kuv = litetKuvert('provkuvert', '🎄', '');

      });
      utkast.appendChild(kuv);
      springa.appendChild(utkast);
    } else if (!lyser && kuv) {

  }

  // Sänkt och överhoppat har fyra varianter, en per plats i turordningen, så att ingen får samma.
  function siffertext(namn) {
    var p = s.prov || {}, nr = Math.max(0, minPlats()) % 4;
    if (p.hur === 'sankt') return PROV_TEXT.sankt[nr].replace(/\{namn\}/g, namn);

  // Frågar arket hur många som är klara. Bara när sidan syns, bara medan man väntar på sin egen lampa,
  // aldrig i testläget eller före julafton. Var 5:e sekund i 10 minuter, sedan var 20:e, stopp efter en timme.
  // En fråga i taget, 30 sekunders paus efter fel.
  var vakt = { timer: null, start: 0, upptagen: false, stoppad: false, lampa: null, rad: null };
  function arJulafton() { var d = new Date(); return d.getMonth() === 11 && d.getDate() >= 24; }
  function stoppaFraga() { clearTimeout(vakt.timer); vakt.timer = null; vakt.lampa = null; }
  function borjaFraga(lampa, lampraden) {
    stoppaFraga();
    if (test || !arJulafton() || s.provKlar || !Advent.Resultat.kod()) return;
    vakt.lampa = lampa;
    vakt.rad = lampraden;
    vakt.start = Date.now();
    vakt.stoppad = false;
    fragaArket();
  }
  function fragaArket() {
    vakt.timer = null;
    if (!vakt.lampa || !document.body.contains(vakt.lampa)) return;
    if (document.hidden) return;   // fortsätter när sidan syns igen
    var gatt = Date.now() - vakt.start;
    if (gatt > 3600000) { vakt.stoppad = true; return; }
    if (vakt.upptagen) return;
    vakt.upptagen = true;
    Advent.Resultat.hamta(24).then(function (svar) {
      vakt.upptagen = false;
      tur.spelare = svar.spelare;
      tur.antal = svar.dag.antal;
      if (svar.dag.harSpelat && !s.provKlar) { s.provKlar = true; spara(); if (vakt.lampa) laggSvarskuvert(vakt.lampa.closest('.skap')); }
      if (!vakt.lampa) return;
      ritaLampa(vakt.lampa, vakt.rad);
      if (minTur() || s.provKlar) return;
      vakt.timer = setTimeout(fragaArket, gatt < 600000 ? 5000 : 20000);
    }, function () {
      vakt.upptagen = false;
      if (vakt.lampa) vakt.timer = setTimeout(fragaArket, 30000);
    });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && vakt.lampa && !vakt.timer && !vakt.upptagen && !vakt.stoppad) fragaArket();

      namn: 'Femtonspel', sokvag: '../femton/',
      sek: function (v) { return Math.round(Math.floor(v / 10000) / 10); },
      malText: function (v) { return 'Femtonspel. Högst ' + Advent.formateraTid(this.sek(v)) + '.'; },
      sank: function (v) { return Math.round(this.sek(v) * 1.4) * 10 * 10000 + 9999; },
      nar: function (v, mal) { return this.sek(v) <= this.sek(mal); },
      skill: 'Snabba fingrar, och en plan för varenda bricka.',
      siffertext: 'Brickorna gled på plats som av trolldom. Tomten har sett många pusselläggare, {namn}, men ingen med sådana fingrar. Här är din belöning, en siffra ur skåpets hemlighet.',
      reserv: 300 * 10 * 10000 + 9999
    },
    12: {
      // värdet är den sammanlagda tiden för de tre banorna i tiondelar
      namn: 'Labyrinten', sokvag: '../labyrint/',
      malText: function (v) { return 'Labyrinten. Högst ' + Math.floor(v / 600) + ':' + ('0' + Math.floor(v / 10) % 60).slice(-2) + ',' + (v % 10) + '.'; },
      sank: function (v) { return Math.round(v * 1.4); },
      nar: function (v, mal) { return v <= mal; },
      skill: 'Ett säkert lokalsinne, även när mörkret ligger tätt.',
      siffertext: 'Gångarna slingrade och väggarna lurade, men du hittade rätt väg, {namn}. Inte ens tomtens egna renar hittar ut så snabbt. Ta emot din siffra, labyrintens erövrare.',
      reserv: 900
    },
    10: {
      // värdet är tiden i sekunder med en decimal, samma bana som den 10 december; en mina är en missad runda
      namn: 'Minesweeper', sokvag: '../minesweeper/',
      malText: function (v) { return 'Minesweeper. Högst ' + v.toFixed(1).replace('.', ',') + ' s.'; },
      sank: function (v) { return Math.round(v * 14) / 10; },
      nar: function (v, mal) { return Math.round(v * 10) <= Math.round(mal * 10); },
      skill: 'Kall logik, och ett finger som aldrig gissar.',
      siffertext: 'Inte en mina fick sista ordet! Du läste banan som en öppen bok, {namn}, och minorna fick ge sig. Tomten överlämnar högtidligt din siffra till den modigaste i familjen.',
      reserv: 120
    }
  };
  var PROV_TEXT = {
    // Inledningen: fyra öppningar per sort, en per plats i turordningen.
    vann: [
      'Hör, hör! Den {dag} december besegrade {namn} hela familjen i {spel}, med {resultat}. Nu kallar tomten på mästaren igen.',
      'Nordpolens krönikor minns den {dag} december, dagen då {namn} vann {spel} med {resultat}. Kan bedriften göras om?',
      'Ingen i familjen slog {namn} i {spel} den {dag} december. {resultat}. Tomten undrar: var det tur, eller storhet?',
      'Alverna viskar fortfarande om {resultat} i {spel}, den {dag} december. {namn}, visa dem att ryktet stämmer.'
    ],
    bast: [
      'Den {dag} december kom {namn} närmare toppen än någonsin, i {spel} med {resultat}. Nu är det dags att nå hela vägen.',
      '{spel}, den {dag} december. {resultat}. Ditt bästa ögonblick i hela december, {namn}, och tomten har inte glömt det.',
      'Tomten har studerat sitt kalkylark, {namn}. Ditt starkaste kort är {spel} från den {dag} december, med {resultat}.',
      'Det var den {dag} december och {spel}. {resultat}. {namn}, nu får du visa att det inte var en slump.'
    ],
    reserv: 'Tomten har valt ett prov åt dig, {namn}: {spel}. Visa vad du går för.',
    sankMal: 'Även mästare har dåliga dagar. Vill du att tomten blundar lite?',
    hoppa: 'Du har kämpat tappert. Vill du gå vidare? Tomten ger dig din siffra ändå.',
    sankt: [
      'Klarat, {namn}! Även de största mästarna har stormiga kvällar, men du tog dig i mål ändå. Siffran är din.',
      'Där satt det, {namn}! Vägen var längre än väntat, men du gick den hela. Tomten bugar för din envishet. Här är din siffra.',
      'Seger, {namn}! Stjärnorna stod inte på din sida i kväll, men du vann ändå. Nordpolen hedrar dig. Ta emot din siffra.',
      'Du klarade det, {namn}! Ett mästarprov är inget för de svaga, och du stod kvar till slutet. Tomten räcker dig din siffra med stolthet.'
    ],
    hoppat: [
      'Du kämpade tappert, {namn}, och mod mäts inte bara i poäng. Tomten ger dig din siffra med varm hand.',
      'Även de största hjältarna vet när det är dags att gå vidare, {namn}. Tomten ger dig din siffra ändå, för familjen behöver den.',
      'Provet besegrade dig i kväll, {namn}, men skåpet väntar inte. Tomten litar på dig. Ta emot din siffra.',
      'Ingen kan vinna alla strider, {namn}. Men utan dig öppnas inget skåp, så här är din siffra.'
    ]
  };
  // Sänk målet: efter 4 missade rundor eller 2 minuters spel. Hoppa över: efter 10 rundor eller 5 minuter.
  // Det som kommer först gäller, så att långsamma spel som Memory inte drar ut på tiden.
  // Knapparna visas först när rundan man håller på med är slut.
  var SANK_EFTER = 4, HOPPA_EFTER = 10, SANK_TID = 120000, HOPPA_TID = 300000;

  // Vilket spel var och en får: först ett spel man vann (bäst medalj först), i turordning.
  // Den som inte vann något får det där man placerade sig bäst bland de spel som är kvar. Ingen får samma.
  function tilldelaProv(svar) {
    var spelare = ordning(svar.spelare), dagar = Object.keys(PROV_SPEL).map(Number);
    var kand = {};
    spelare.forEach(function (n) { kand[n] = []; });
    dagar.forEach(function (d) {
      var dd = svar.dagar[d];
      if (!dd || !dd.harSpelat) return;
      Advent.Resultat.ordna(d, dd, svar.spelare).forEach(function (r) {
        if (r.status !== 'klar' || !kand[r.spelare]) return;
        kand[r.spelare].push({ dag: d, plats: r.plats, medalj: MEDALJ_VARDE[r.medalj] || 0, varde: r.varde, text: r.text });
      });
    });
    var tagna = {}, ut = {};
    function ta(n, k, vann) { tagna[k.dag] = true; ut[n] = { dag: k.dag, varde: k.varde, text: k.text, vann: vann }; }
    spelare.forEach(function (n) {
      var vunna = kand[n].filter(function (k) { return k.plats === 1 && !tagna[k.dag]; })
        .sort(function (a, b) { return b.medalj - a.medalj; });
      if (vunna.length) ta(n, vunna[0], true);
    });
    spelare.forEach(function (n) {
      if (ut[n]) return;
      var rest = kand[n].filter(function (k) { return !tagna[k.dag]; })
        .sort(function (a, b) { return (a.plats - b.plats) || (b.medalj - a.medalj); });
      if (rest.length) { ta(n, rest[0], false); return; }
      var ledig = dagar.filter(function (d) { return !tagna[d]; })[0] || dagar[0];
      ta(n, { dag: ledig, varde: PROV_SPEL[ledig].reserv, text: '' }, null);
    });
    return ut;
  }

  // Testläget: exempel på ett decemberresultat, spelet väljs i testrutan.
  var TEST_PROV = {
    1: { dag: 1, varde: 12 * 10000 + 9000, text: 'längd 12 · 0:41', vann: true },
    17: { dag: 17, varde: 28 * 100000 + 700, text: '28 drag · 1:10', vann: false },
    8: { dag: 8, varde: 724, text: '72,4 %', vann: true },
    15: { dag: 15, varde: 1040, text: '40 poäng', vann: false },
    22: { dag: 22, varde: 6 * 10000 + 9000, text: 'längd 6 · 0:21', vann: true },
    23: { dag: 23, varde: 5 * 1000 + 300, text: '5 skorstenar', vann: false },
    14: { dag: 14, varde: 1534 * 10000 + 142, text: '2:33 · 142 drag', vann: true },
    12: { dag: 12, varde: 1124, text: '1:52,4', vann: false },
    10: { dag: 10, varde: 45.3, text: '45,3 s', vann: true }
  };

  function hamtaMittProv() {
    if (s.prov && s.prov.dag) return Promise.resolve(s.prov);
    var val = test ? Promise.resolve(TEST_PROV[s.testSpel || 1]) : Advent.Resultat.alla().then(function (svar) {
      return tilldelaProv(svar)[Advent.Resultat.namn()];
    });
    return val.then(function (t) {
      s.prov = { dag: t.dag, varde: t.varde, text: t.text, vann: t.vann, mal: t.varde, forsok: 0, missar: 0, sankt: false };
      spara();
      return s.prov;
    });
  }

  function fyll(mall, p) {
    var spel = PROV_SPEL[p.dag];
    return mall.replace(/\{namn\}/g, provNamn()).replace(/\{spel\}/g, spel.namn)
      .replace(/\{dag\}/g, String(p.dag)).replace(/\{resultat\}/g, p.text);
  }

  function oppnaProv(skap, lampa, lampraden) {
    if (skap.querySelector('.prov')) return;
    var prov = el('div', 'prov');
    prov.appendChild(el('p', 'platshallare', 'Tomten letar i sitt kalkylark…'));
    skap.appendChild(prov);
    hamtaMittProv().then(function (p) {
      var spel = PROV_SPEL[p.dag], nr = Math.max(0, minPlats()) % 4;
      prov.textContent = '';
      if (!p.forsok) {
        var mall = p.vann === true ? PROV_TEXT.vann[nr] : p.vann === false ? PROV_TEXT.bast[nr] : PROV_TEXT.reserv;
        prov.appendChild(el('p', 'inledning', fyll(mall, p)));
        prov.appendChild(el('p', 'skill', spel.skill));
      }
      prov.appendChild(el('p', 'mal', spel.malText(p.mal)));
      var start = el('button', 'knapp', p.forsok ? 'Fortsätt' : 'Anta utmaningen');
      start.type = 'button';
      prov.appendChild(start);
      start.addEventListener('click', function () {
        prov.remove();
        spelaProv(skap, lampa, lampraden);
      });
    }, function (fel) {
      prov.textContent = '';
      prov.appendChild(el('p', null, fel.message));
      var igen = el('button', 'knapp', 'Försök igen');
      igen.type = 'button';
      igen.addEventListener('click', function () { prov.remove(); oppnaProv(skap, lampa, lampraden); });
      prov.appendChild(igen);
    });
  }

  // Spelet öppnas i en ram över hela skärmen. Varje färdig runda räknas som ett försök.
  function spelaProv(skap, lampa, lampraden) {
    var p = s.prov, spel = PROV_SPEL[p.dag];
    var yta = el('div', 'provspel');
    var topp = el('div', 'topp');
    var mal = el('p', 'mal', spel.malText(p.mal));
    var stang = el('button', 'stang', '✕');
    stang.type = 'button';
    stang.setAttribute('aria-label', 'Tillbaka till skåpet');
    topp.appendChild(mal);
    topp.appendChild(stang);
    var hjalp = el('div', 'hjalp');
    hjalp.hidden = true;
    var ram = el('iframe');
    ram.title = spel.namn;
    ram.src = spel.sokvag + '?dag=' + p.dag + '&prov=1';
    yta.appendChild(topp);
    yta.appendChild(hjalp);
    yta.appendChild(ram);
    document.body.appendChild(yta);
    document.body.style.overflow = 'hidden';

    function stangSpel() {
      clearInterval(klocka);
      spara();
      window.removeEventListener('message', tagEmot);
      yta.remove();
      document.body.style.overflow = '';
    }
    // Efter fyra missar dyker Sänk målet upp, efter tio försök Hoppa över. Första gången med en
    // fråga, sedan ligger knapparna kvar under målet tillsammans med Spela igen.
    var ritat = null;
    function ritaHjalp() {
      var tid = p.tid || 0;
      var sankLas = p.missar >= SANK_EFTER || tid >= SANK_TID;
      var kanSanka = !p.sankt && sankLas, kanHoppa = p.forsok >= HOPPA_EFTER || tid >= HOPPA_TID;
      var nu = (kanSanka ? 's' : '') + (kanHoppa ? 'h' : '') + (p.sankt ? 'x' : '');
      if (nu === ritat && !hjalp.dataset.ny) return;
      ritat = nu;
      delete hjalp.dataset.ny;
      hjalp.textContent = '';
      hjalp.hidden = !sankLas && !kanHoppa;
      if (hjalp.hidden) return;
      var fraga = kanHoppa && !p.sagtHoppa ? 'hoppa' : kanSanka && !p.sagtSank ? 'sank' : null;
      if (fraga) hjalp.appendChild(el('p', null, fraga === 'hoppa' ? PROV_TEXT.hoppa : PROV_TEXT.sankMal));
      function sagt() {
        if (fraga === 'hoppa') p.sagtHoppa = true;
        if (fraga === 'sank') p.sagtSank = true;
        hjalp.dataset.ny = '1';
      }
      var rad = el('div', 'rad');
      var igen = el('button', 'knapp ljus', 'Spela igen');
      igen.type = 'button';
      igen.addEventListener('click', function () { sagt(); spara(); ram.src = ram.src; ritaHjalp(); });
      rad.appendChild(igen);
      if (kanSanka) {
        var sank = el('button', 'knapp', 'Sänk målet');
        sank.type = 'button';
        sank.addEventListener('click', function () {
          sagt();
          p.sagtSank = true;
          p.sankt = true;
          p.mal = spel.sank(p.varde);
          spara();
          mal.textContent = spel.malText(p.mal);
          ram.src = ram.src;
          ritaHjalp();
        });
        rad.appendChild(sank);
      }
      if (kanHoppa) {
        var hoppa = el('button', 'knapp gul', 'Hoppa över');
        hoppa.type = 'button';
        hoppa.addEventListener('click', function () { stangSpel(); provKlart('hoppat', skap, lampa, lampraden); });
        rad.appendChild(hoppa);
      }
      hjalp.appendChild(rad);
    }
    function tagEmot(e) {
      if (e.origin !== location.origin || e.source !== ram.contentWindow) return;
      var d = e.data;
      if (!d || d.typ !== 'provRunda' || typeof d.varde !== 'number') return;
      p.forsok++;
      if (spel.nar(d.varde, p.mal)) {
        spara();
        setTimeout(function () { stangSpel(); provKlart(p.sankt ? 'sankt' : 'fullt', skap, lampa, lampraden); }, 900);
        return;
      }
      p.missar++;
      spara();
      ritaHjalp();
    }
    window.addEventListener('message', tagEmot);
    stang.addEventListener('click', stangSpel);
    // Speltiden räknas bara medan provet är öppet och sidan syns.
    var forra = Date.now();
    var klocka = setInterval(function () {
      var nu = Date.now();
      if (!document.hidden) p.tid = (p.tid || 0) + Math.min(nu - forra, 5000);
      forra = nu;
      if (Math.floor(p.tid / 1000) % 5 === 0) spara();
    }, 1000);   // knapparna visas först när en runda är slut (tagEmot), aldrig mitt i en runda
    ritaHjalp();
  }

  function provKlart(hur, skap, lampa, lampraden) {
    var plats = minPlats();
    s.prov.hur = hur;
    s.provKlar = true;
    if (test) s.testAntal = Math.max(s.testAntal || 0, plats + 1);
    spara();
    if (!test) {
      Advent.Resultat.skicka({ dag: 24, spel: 'mästarprov ' + PROV_SPEL[s.prov.dag].namn, status: 'klar', varde: 0, medalj: '',
        text: { fullt: 'fullt mål', sankt: 'sänkt mål', hoppat: 'hoppade över' }[hur] }).catch(function () {});
    }
    var v = visaSiffran(skap);
    v.stang.addEventListener('click', function () {
      v.prov.remove();
      // Kuvertet glider in i springan, ett förseglat kuvert med siffran hamnar under skåpet
      // och lampan slocknar långsamt, ungefär tio sekunder.
      ritaLampa(lampa, lampraden);
      laggSvarskuvert(skap);
    });
  }

  // ===== Akt 2 =====
  // Lagen lottas med ett fast frö, så att alla telefoner får samma lag. A och B tar Pyssels dörr
  // (A ser den hemliga granen, B pyntar), C och D tar Trassels.
  var LAG_FRO = 'kassaskap-lag-2026';
  var TEST_NAMN = ['Behnosh', 'Daniel', 'Josefin', 'Joel'];
  function hamtaLag() {
    if (test) {
      var lag = TEST_NAMN.slice(1);
      lag.splice(s.testRoll || 0, 0, TEST_NAMN[0]);
      return Promise.resolve(lag);
    }
    if (s.lag) return Promise.resolve(s.lag);
    return Advent.Resultat.hamta(24).then(function (svar) {
      s.lag = blandaFast(svar.spelare, LAG_FRO);
      spara();
      return s.lag;
    });
  }
  function minRoll(lag) { return test ? (s.testRoll || 0) : lag.indexOf(Advent.Resultat.namn()); }
  function lagText(t, lag) { return t.replace(/\{([ABCD])\}/g, function (m, b) { return lag['ABCD'.indexOf(b)] || ''; }); }

  function ritaAkt2(inne, scen) {
    inne.parentNode.classList.remove('hog');
    stoppaBlink();
    var dorrar = el('div', 'smadorrar');
    var lila = smaDorr('lila', '👩‍🎤 Pyssel', '🎄');
    var gron = smaDorr('gron', '🧑‍🎤 Trassel', '📜');
    var lampor = el('div', 'lampor');
    for (var i = 0; i < 4; i++) lampor.appendChild(el('span', 'liten-lampa'));
    gron.fylling.appendChild(lampor);
    dorrar.appendChild(lila.plats);
    dorrar.appendChild(gron.plats);
    scen.appendChild(dorrar);
    var under = el('div', 'akt2-under');
    scen.appendChild(under);

    function visaDorrar(lag) {
      var roll = minRoll(lag);
      if (roll === 0 || roll === 1) {
        lila.dorr.classList.add('glant');
        lila.oppnas(function () { oppnaGran(inne, lag, roll); }, 'Pyssels dörr, på glänt. Tryck för att öppna.');
        if (s.vy === 'gran' && s.sett.gran) { oppnaGran(inne, lag, roll); return; }
      }
      if (s.fargKlar) {
        oppnaTrassel();
        if (s.vy === 'brev') { oppnaBrev(inne, lag, roll); return; }
        under.appendChild(gataFalt(inne));
        brevKnuff(inne, lag, roll);
        return;
      }
      farglas(lag);
      knuff(inne, 'farg', {
        vem: 'pyssel', forsta: 3, mellan: 3,
        klar: function () { return s.fargKlar; },
        nivaer: [
          ['pyssel', 'Min gran är inte bara snygg, vet ni.'],
          ['pyssel', lagText('När granen är rätt pyntad lyser den. Titta på {B}s telefon.', lag)],
          ['pyssel', 'Fyra färger, en i taget, i den ordning de lyser.']
        ]
      });
    }
    // Rätt färgkod låser upp: dörren glider upp på glänt, precis som Pyssels. Ett tryck öppnar den helt.
    function oppnaTrassel() {
      if (!s.trasselOppen) {
        gron.dorr.classList.add('glant');
        gron.oppnas(function () {
          if (s.trasselOppen) return;
          s.trasselOppen = true;
          spara();
          oppnaTrassel();
        }, 'Trassels dörr, på glänt. Tryck för att öppna.');
        return;
      }
      gron.dorr.classList.add('oppen');
      gron.dorr.removeAttribute('role');
      gron.dorr.tabIndex = -1;
      gron.dorr.setAttribute('aria-hidden', 'true');
      gron.bakom.removeAttribute('aria-hidden');
      gron.bakom.disabled = false;
      gron.bakom.setAttribute('aria-label', 'Trassels brev');
      gron.bakom.addEventListener('click', function () { hamtaLag().then(function (lag) { oppnaBrev(inne, lag, minRoll(lag)); }); });
    }

    // Trassels färglås: färgerna i blinkordningen, varje rätt tryck tänder nästa lampa, fel = alla slocknar.
    function farglas(lag) {
      var g = svar().gran;
      if (!g) { under.appendChild(el('p', 'platshallare', 'Färglåset är inte klart än.')); return; }
      var n = 0, tryckt = [];
      // Efter en fel kod är låset stängt i tio sekunder, och nedräkningen syns på dörren.
      var vanta = el('div', 'fargvanta');
      var vtimer = null;
      function fargKvar() { return Math.max(0, Math.ceil(((s.fargLastTill || 0) - Date.now()) / 1000)); }
      function visaVanta() {
        clearInterval(vtimer);
        function uppdatera() {
          var k = fargKvar();
          vanta.textContent = k > 0 ? '⏳ ' + k : '';
          if (k === 0 || !vanta.isConnected) clearInterval(vtimer);
        }
        uppdatera();
        if (fargKvar() > 0) vtimer = setInterval(uppdatera, 250);
      }
      var fel = roterande(['Nej. Bara nej.', 'Inte ens nära.', 'Trassel, de håller på att trycka på måfå.', 'Har ni ens tittat på granen?', 'Ok, jag hämtar popcorn.', 'Det är fyra färger. Fyra. Ni klarar det.']);
      var knappar = el('div', 'fargknappar');
      knappar.setAttribute('aria-label', 'Färglåset på Trassels dörr');
      Object.keys(PYNT_FARG).forEach(function (f) {
        var b = el('button', 'fargknapp');
        b.type = 'button';
        b.setAttribute('aria-label', PYNT_FARG[f].namn);
        b.style.background = PYNT_FARG[f].fyll;
        b.addEventListener('click', function () {
          // Varje tryck tänder nästa lampa i den färgen. Först när alla fyra lyser avgörs om det stämmer.
          var lamps = lampor.children;
          if (n >= g.blink.length || fargKvar() > 0) return;
          lamps[n].style.background = PYNT_FARG[f].fyll;
          lamps[n].style.color = PYNT_FARG[f].fyll;
          lamps[n].classList.add('tand');
          tryckt.push(f);
          n++;
          if (n < g.blink.length) return;
          var ratt = tryckt.every(function (x, i) { return x === g.blink[i]; });
          setTimeout(function () {
            if (ratt) {
              s.fargKlar = true;
              spara();
              oppnaTrassel();
              under.appendChild(gataFalt(inne));
              prata(inne, [['pyssel', 'Snyggt. Nu får vi se om ni klarar brevet också.']]);
              return;
            }
            n = 0;
            tryckt = [];
            Array.prototype.forEach.call(lamps, function (l) { l.classList.remove('tand'); l.style.background = ''; l.style.color = ''; });
            s.fargLastTill = Date.now() + 10000;
            spara();
            visaVanta();
            skaka(gron.dorr);
            knuffFel();
            kommentar(inne, 'pyssel', fel());
          }, 450);
        });
        knappar.appendChild(b);
      });
      gron.fylling.appendChild(knappar);
      knappar.appendChild(vanta);
      visaVanta();
    }

    function efterIntro() {
      hamtaLag().then(function (lag) {
        if (s.sett.lag) { visaDorrar(lag); return; }
        prata(inne, [
          ['pyssel', lagText('Vi delar upp er. {A} och {B}, ni tar min dörr.', lag)],
          ['trassel', lagText('{C} och {D}, ni får min. Spara på hjärncellerna.', lag)],
          ['pyssel', 'Och ni som inte spelar: inget fusk från soffan.']
        ], function () { s.sett.lag = true; spara(); visaDorrar(lag); });
      }, function () {
        var igen = el('button', 'knapp ljus', 'Försök igen');
        igen.type = 'button';
        igen.style.width = 'auto';
        igen.addEventListener('click', function () { under.textContent = ''; efterIntro(); });
        under.appendChild(el('p', 'platshallare', 'Skåpet når inte resultatarket just nu.'));
        under.appendChild(igen);
      });
    }
    if (s.sett.akt2) { efterIntro(); return; }
    prata(inne, [
      ['pyssel', 'Psst. Vi är tomtens barnbarn. Morfar tror att vi bara sitter med mobilen hela julen.'],
      ['trassel', 'Vilket vi gör. Men i år har vi också tagit över hans skåp.'],
      ['pyssel', 'Vi har byggt två egna dörrar. Ingen av dem går att öppna ensam, det har vi sett till.'],
      ['trassel', 'Morfar har ingen aning.']
    ], function () { s.sett.akt2 = true; spara(); efterIntro(); });
  }

  // En liten skåpdörr med namnskylt, fylling och handtag. Bakom den ligger det som dörren gömmer.
  function smaDorr(farg, namn, bakom) {
    var plats = el('div', 'dorrplats');
    var bak = el('button', 'bakom', bakom);
    bak.type = 'button';
    bak.disabled = true;
    bak.setAttribute('aria-hidden', 'true');
    var dorr = el('div', 'smadorr ' + farg);
    dorr.setAttribute('aria-label', namn.replace(/^\S+ /, '') + 's dörr, stängd');
    dorr.appendChild(el('span', 'skylt', namn));
    var fylling = el('span', 'fylling');
    dorr.appendChild(fylling);
    dorr.appendChild(el('span', 'handtag'));
    plats.appendChild(bak);
    plats.appendChild(dorr);
    return {
      plats: plats, dorr: dorr, fylling: fylling, bakom: bak,
      oppnas: function (klick, etikett) {
        bak.removeAttribute('aria-hidden');
        if (!klick) { dorr.setAttribute('aria-hidden', 'true'); return; }
        dorr.setAttribute('role', 'button');
        dorr.tabIndex = 0;
        dorr.setAttribute('aria-label', etikett);
        dorr.addEventListener('click', klick);
        dorr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); klick(); } });
      }
    };
  }

  // Fältet för gåtans svar. Rätt svar fäller undan dörrarna och tar en till akt 3.
  function gataFalt(inne) {
    var trassel = roterande(['Haha. Nej.', 'Fel. Men kreativt.', 'Pyssel, de har inte knäckt koden än.', 'Morfar hade gissat samma sak.', 'Läs gåtan en gång till. Långsamt.']);
    return falt('Gåtans svar', function (text) {
      if (stammer(text, svar().ord)) {
        prata(inne, [['trassel', 'Va?! Det har ingen klarat förut. Okej. Ni är bättre än vi trodde.']], function () {
          s.steg = 'akt3';
          s.vy = null;
          spara();
          ritaInne(inne);
        });
        return true;
      }
      knuffFel();
      kommentar(inne, 'trassel', trassel());
      return false;
    });
  }

  // Trassels brev på barnbarnens hemliga språk: en julsymbol per bokstav.
  // {C} har brevet (ett ord per sida), {D} har nyckelboken (fem symboler per sida, blandad ordning).
  // Fem par symboler liknar varandra (🎄 🌲, ⭐ 🌟, ⛄ ☃️, 🧦 🧤, 🍬 🍭), och paren ligger på olika sidor i nyckelboken.
  // Regel för brevet: två symboler som liknar varandra får aldrig stå i samma ord, annars syns det direkt att det finns två versioner.
  // Q, W, X och Z är borttagna (för ovanliga), lägg till dem om det riktiga brevet behöver dem.
  var KOD_TECKEN = {
    A: '🎄', M: '🌲', E: '⭐', P: '🌟', N: '⛄', V: '☃️', R: '🧦', U: '🧤', S: '🍬', 'Ä': '🍭',
    B: '🌙', C: '🍊', D: '🎁', F: '🧸', G: '🕯️', H: '🦌', I: '🍪', K: '🧁', L: '🔔',
    J: '🛷', O: '🎀', T: '🥛', Y: '🌰', 'Å': '🍎', 'Ö': '🧣'
  };
  var NYCKELBOK = ['ACRBK', 'EMJIU', 'NDYTF', 'SLPHÅ', 'VOÄGÖ'];
  function oppnaBrev(inne, lag, roll) {
    inne.textContent = '';
    pratRuta = null;
    inne.parentNode.classList.add('hog');
    s.vy = 'brev';
    spara();
    var scen = el('div', 'scen granscen brevscen');
    inne.appendChild(scen);
    var bakat = el('button', 'bakat', '← Dörrarna');
    bakat.type = 'button';
    bakat.addEventListener('click', function () { s.vy = null; spara(); ritaInne(inne); });
    scen.appendChild(bakat);
    var text = svar().brev;
    if (!text) { scen.appendChild(el('p', 'platshallare', 'Brevet är inte klart än.')); return; }

    if (roll === 2) ritaBrevet(scen, text);
    else if (roll === 3) ritaNyckelboken(scen);
    else {
      // De som inte har brevet ser det förseglat, med Trassels gröna sigill.
      var forseglat = el('div', 'forseglat');
      forseglat.setAttribute('role', 'img');
      forseglat.setAttribute('aria-label', lagText('Ett förseglat brev till {C} och {D}', lag));
      forseglat.appendChild(el('span', 'adress', lagText('Till {C} och {D}', lag)));
      forseglat.appendChild(el('span', 'sigill gront', 'T'));
      scen.appendChild(forseglat);
      scen.appendChild(el('p', 'platshallare', 'Ni andra får bara titta på.'));
    }
    scen.appendChild(gataFalt(inne));
    brevKnuff(inne, lag, roll);

    if (s.sett.brev) return;
    prata(inne, [
      ['trassel', 'Bakom min dörr ligger ett brev på vårt hemliga språk. Vi uppfann det för att morfar inte skulle kunna läsa våra lappar.'],
      ['pyssel', 'Han har fortfarande inte knäckt det.'],
      ['trassel', lagText('{C}, du har brevet. {D}, du har nyckeln. Ni får läsa upp för varandra, men ingen visar sin skärm.', lag)]
    ], function () { s.sett.brev = true; spara(); });
  }

  // Knuffar bakom Trassels dörr. {C} och {D} får först hjälp med brevet och sedan med gåtan,
  // de andra får bara gåtans knuffar (de kommer senare, eftersom brevet tar en stund).
  var LIKNAR = [['A', 'M'], ['E', 'P'], ['N', 'V'], ['R', 'U'], ['S', 'Ä']];
  function brevKnuff(inne, lag, roll) {
    var text = svar().brev, gk = svar().gataKnuffar || [];
    if (!text) return;
    var gata = gk.map(function (t) { return ['trassel', t]; });
    if (roll !== 2 && roll !== 3) { knuff(inne, 'gata', { vem: 'trassel', forsta: 6, mellan: 3, nivaer: gata }); return; }
    var ord = text.split(' ');
    knuff(inne, 'brev', {
      vem: 'trassel', forsta: 3, mellan: 3,
      nivaer: [
        ['trassel', lagText('Ni behöver inte gissa. {D}, bläddra och läs symbolerna för {C}.', lag)],
        function () {
          var par = LIKNAR.filter(function (p) { return text.indexOf(p[0]) !== -1 || text.indexOf(p[1]) !== -1; })[0];
          if (!par) return ['trassel', 'Varje symbol är en bokstav. Samma symbol, samma bokstav.'];
          var x = text.indexOf(par[0]) !== -1 ? par[0] : par[1], y = x === par[0] ? par[1] : par[0];
          return ['trassel', KOD_TECKEN[x] + ' betyder ' + x + '. Och ' + KOD_TECKEN[y] + ' är inte samma sak, kolla noga.'];
        },
        function () {
          // Ett ord fylls i: det första som inte stämmer på brevets telefon.
          var pos = 0, nr = 0;
          if (roll === 2) {
            if (!s.brevSvar) s.brevSvar = {};
            for (var i = 0; i < ord.length; i++) {
              var b = Array.from(ord[i]);
              var ratt = b.every(function (c, j) { return !KOD_TECKEN[c] || s.brevSvar[pos + j] === c; });
              if (!ratt) { nr = i; break; }
              pos += b.length;
              if (i === ord.length - 1) { nr = 0; pos = 0; }
            }
            Array.from(ord[nr]).forEach(function (c, j) { if (KOD_TECKEN[c]) s.brevSvar[pos + j] = c; });
            s.brevSida = nr;
            spara();
            oppnaBrev(inne, lag, roll);
          }
          return ['trassel', 'Okej då. Ord ' + (nr + 1) + ' är ' + ord[nr] + '.'];
        }
      ].concat(gata)
    });
  }

  // Bläddrar med ‹ och ›. sida(n) ritar sida n i ruta. Sidan sparas i s[nyckel].
  function bladdra(scen, antal, nyckel, namn, sida, typ) {
    var bok = el('div', 'bladder ' + typ);
    var papper = el('div', 'bladder-papper');
    var ruta = el('div', 'bladder-sida');
    var rad = el('div', 'bladder-rad');
    var bak = el('button', 'pil', '‹');
    var fram = el('button', 'pil', '›');
    var nr = el('span', 'sidnr');
    bak.type = fram.type = 'button';
    bak.setAttribute('aria-label', 'Förra');
    fram.setAttribute('aria-label', 'Nästa');
    rad.appendChild(bak);
    rad.appendChild(nr);
    rad.appendChild(fram);
    papper.appendChild(ruta);
    papper.appendChild(rad);
    bok.appendChild(papper);
    scen.appendChild(bok);
    function visa(n) {
      n = (n + antal) % antal;
      s[nyckel] = n;
      spara();
      ruta.textContent = '';
      sida(n, ruta);
      nr.textContent = namn + ' ' + (n + 1) + ' av ' + antal;
    }
    bak.addEventListener('click', function () { visa((s[nyckel] || 0) - 1); });
    fram.addEventListener('click', function () { visa((s[nyckel] || 0) + 1); });
    visa(s[nyckel] || 0);
  }

  function ritaBrevet(scen, text) {
    scen.appendChild(el('p', 'hemligt', '🙈 Bara för dina ögon.'));
    if (!s.brevSvar) s.brevSvar = {};
    var ord = [], pos = 0;
    text.split(' ').forEach(function (o) { ord.push({ start: pos, tecken: Array.from(o) }); pos += Array.from(o).length; });
    var helt = el('p', 'helt-brev');
    function ritaHelt() {
      var klart = ord.every(function (o) { return o.tecken.every(function (b, i) { return !KOD_TECKEN[b] || s.brevSvar[o.start + i]; }); });
      helt.hidden = !klart;
      helt.textContent = klart ? 'Det du har skrivit: ' + ord.map(function (o) {
        return o.tecken.map(function (b, i) { return KOD_TECKEN[b] ? s.brevSvar[o.start + i] : b; }).join('');
      }).join(' ') : '';
    }
    bladdra(scen, ord.length, 'brevSida', 'Ord', function (n, ruta) {
      var o = ord[n];
      var kodbrev = el('div', 'kodbrev');
      var rutor = [];
      o.tecken.forEach(function (b, i) {
        var sym = KOD_TECKEN[b];
        if (!sym) { kodbrev.appendChild(el('span', 'tecken', b)); return; }
        var t = el('label', 'tecken');
        t.appendChild(el('span', 'sym', sym));
        var inp = el('input');
        inp.maxLength = 2;
        inp.autocomplete = 'off';
        inp.autocapitalize = 'characters';
        inp.spellcheck = false;
        inp.value = s.brevSvar[o.start + i] || '';
        inp.setAttribute('aria-label', 'Bokstav ' + (i + 1));
        inp.addEventListener('input', function () {
          var v = stada(inp.value).replace(/[^A-ZÅÄÖ]/g, '').slice(-1);
          inp.value = v;
          s.brevSvar[o.start + i] = v;
          spara();
          ritaHelt();
          if (!v) return;
          var j = rutor.indexOf(inp) + 1;
          if (j < rutor.length) rutor[j].focus(); else inp.blur();
        });
        inp.addEventListener('focus', function () { inp.select(); });
        rutor.push(inp);
        t.appendChild(inp);
        kodbrev.appendChild(t);
      });
      ruta.appendChild(kodbrev);
    }, 'brevpapper');
    scen.appendChild(helt);
    ritaHelt();
  }

  function ritaNyckelboken(scen) {
    scen.appendChild(el('p', 'hemligt', '🙈 Bara för dina ögon.'));
    bladdra(scen, NYCKELBOK.length, 'nyckelSida', 'Sida', function (n, ruta) {
      var sida = el('div', 'nyckelsida');
      Array.from(NYCKELBOK[n]).forEach(function (b) {
        var par = el('span', 'par');
        par.appendChild(el('span', 'sym', KOD_TECKEN[b]));
        par.appendChild(el('b', null, b));
        sida.appendChild(par);
      });
      ruta.appendChild(sida);
    }, 'bok');
  }

  // Pyssels gran bakom den lila dörren. roll 0 ser den hemliga granen, roll 1 pyntar.
  // s.vy = 'gran' när granen är öppen, så att man hamnar där igen om sidan laddas om.
  function oppnaGran(inne, lag, roll) {
    var g = svar().gran;
    inne.textContent = '';
    pratRuta = null;
    inne.parentNode.classList.add('hog');
    s.vy = 'gran';
    spara();
    var scen = el('div', 'scen granscen');
    inne.appendChild(scen);
    var bakat = el('button', 'bakat', '← Dörrarna');
    bakat.type = 'button';
    bakat.addEventListener('click', function () { stoppaBlink(); s.vy = null; spara(); ritaInne(inne); });
    scen.appendChild(bakat);
    function visa() {
      if (!g) { scen.appendChild(el('p', 'platshallare', 'Granen är inte klar än.')); return; }
      if (roll === 0) {
        scen.appendChild(el('p', 'hemligt', '🙈 Bara för dina ögon.'));
        var hemlig = granSvg(g.pynt, null);
        hemlig.setAttribute('aria-label', 'Den hemliga granen');
        scen.appendChild(hemlig);
        return;
      }
      pynta(inne, scen, g);
    }
    // Granen syns direkt, barnbarnen pratar framför den första gången.
    visa();
    // Pyntaren har Pyssels hjälp direkt (se pynta). Den som ser den hemliga granen får knuffar i text.
    if (g && roll === 0) knuff(inne, 'gran', {
      vem: 'pyssel', forsta: 1, mellan: 1,
      klar: function () { return s.granKlar; },
      nivaer: [
        ['pyssel', lagText('{A}, beskriv granen rad för rad, uppifrån. {B}, fråga om allt du är osäker på.', lag)],
        ['pyssel', 'Både formen och färgen måste stämma. En röd kula är inte en röd stjärna.'],
        function () {
          if (roll === 1 && s.gran) {
            var fel = s.gran.filter(function (p, j) { return p !== g.pynt[j]; }).length;
            return ['pyssel', fel === 1 ? 'En plats är fel just nu. Bara en!' : fel + ' platser är fel just nu.'];
          }
          var antal = g.pynt.filter(Boolean).length;
          return ['pyssel', lagText('Granen har ' + antal + ' saker. Räkna dem tillsammans med {B}.', lag)];
        }
      ]
    });
    if (s.sett.gran) return;
    prata(inne, [
      ['pyssel', 'Morfars gran var så tråkig att vi pyntade om den. Sen ångrade vi oss och rev av allt.'],
      ['trassel', 'Klassiskt.'],
      ['pyssel', lagText('{A}, bara du får se hur granen ska se ut. Visa den inte för någon, beskriv den med ord.', lag)],
      ['trassel', lagText('{B}, du har lådan med pynt. Du får lyssna och fråga, men aldrig titta på {A}s skärm.', lag)],
      ['pyssel', 'Gör den exakt likadan.']
    ], function () { s.sett.gran = true; spara(); });
  }

  // Den som pyntar väljer form och färg i lådan och trycker på en plats. Samma sak en gång till tar bort den.
  function pynta(inne, scen, g) {
    if (!s.gran || s.gran.length !== g.pynt.length) s.gran = g.pynt.map(function () { return ''; });
    var form = s.granForm || 'kula', farg = s.granFarg || 'rod';
    function stammerGranen() { return s.gran.every(function (p, j) { return p === g.pynt[j]; }); }
    var gran = granSvg(s.gran, function (i) {
      if (s.granKlar) return;
      var sak = form + ':' + farg;
      s.gran[i] = s.gran[i] === sak ? '' : sak;
      gran.satt(i, s.gran[i]);
      spara();
      if (stammerGranen()) blevKlar();
      ritaHjalp();
    });
    gran.setAttribute('aria-label', 'Granen du pyntar');
    scen.appendChild(gran);

    var lada = el('div', 'pyntlada');
    lada.setAttribute('aria-label', 'Lådan med pynt');
    var formRad = el('div', 'ladrad'), fargRad = el('div', 'ladrad');
    lada.appendChild(formRad);
    lada.appendChild(fargRad);
    function ritaLada() {
      formRad.textContent = '';
      fargRad.textContent = '';
      Object.keys(PYNT_FORM).forEach(function (f) {
        var b = el('button');
        b.type = 'button';
        b.setAttribute('aria-label', PYNT_FORM[f]);
        b.setAttribute('aria-pressed', String(f === form));
        b.appendChild(pyntIkon(f, farg));
        b.addEventListener('click', function () { form = s.granForm = f; spara(); ritaLada(); });
        formRad.appendChild(b);
      });
      Object.keys(PYNT_FARG).forEach(function (f) {
        var b = el('button', 'farg');
        b.type = 'button';
        b.setAttribute('aria-label', PYNT_FARG[f].namn);
        b.setAttribute('aria-pressed', String(f === farg));
        var k = el('span', 'fargklick');
        k.style.background = PYNT_FARG[f].fyll;
        b.appendChild(k);
        b.addEventListener('click', function () { farg = s.granFarg = f; spara(); ritaLada(); });
        fargRad.appendChild(b);
      });
    }
    ritaLada();
    var tips = el('p', 'tips', 'Välj form och färg i lådan och tryck på granen. Tryck en gång till för att ta bort.');
    scen.appendChild(lada);
    scen.appendChild(tips);
    function las() {
      lada.remove();
      tips.remove();
      gran.classList.add('las');
      startaBlink(gran, g.blink);
    }
    // Pyssels hjälp: hon står framme hela tiden och frågar om man vill ha en ledtråd.
    // 1) en plats som är fel blinkar, 2) hon säger vad som är fel, 3) hon fixar den. Blir platsen rätt slutar den blinka.
    var hjalp = el('div', 'tittar granhjalp');
    inne.appendChild(hjalp);
    function forstaFel() { for (var j = 0; j < g.pynt.length; j++) if (s.gran[j] !== g.pynt[j]) return j; return -1; }
    function vadArFel(j) {
      var nu = s.gran[j], ratt = g.pynt[j];
      if (!ratt) return 'Den ska vara tom.';
      if (!nu) return 'Här saknas något.';
      var a = nu.split(':'), b = ratt.split(':');
      if (a[0] !== b[0] && a[1] !== b[1]) return 'Fel form och fel färg.';
      return a[0] !== b[0] ? 'Rätt färg, men fel form.' : 'Rätt form, men fel färg.';
    }
    function ritaHjalp() {
      hjalp.textContent = '';
      gran.querySelectorAll('.plats').forEach(function (pl) { pl.classList.remove('fel-blink'); });
      if (s.granKlar) return;
      var j = s.granHjalp;
      if (j != null && s.gran[j] === g.pynt[j]) { j = s.granHjalp = null; s.granHjalpSteg = 0; spara(); }
      if (j != null) gran.querySelectorAll('.plats')[j].classList.add('fel-blink');
      var fraga = j == null ? 'Vill du ha en ledtråd?' : (s.granHjalpSteg ? 'Ska jag fixa den?' : 'Vill du veta vad som är fel?');
      function tryck() {
        if (j == null) {
          var f = forstaFel();
          if (f < 0) return;
          s.granHjalp = f;
          s.granHjalpSteg = 0;
          spara();
          ritaHjalp();
          kommentar(inne, 'pyssel', 'Kolla den här.');
        } else if (!s.granHjalpSteg) {
          s.granHjalpSteg = 1;
          spara();
          ritaHjalp();
          kommentar(inne, 'pyssel', vadArFel(j));
        } else {
          s.gran[j] = g.pynt[j];
          gran.satt(j, s.gran[j]);
          s.granHjalp = null;
          s.granHjalpSteg = 0;
          spara();
          if (stammerGranen()) { blevKlar(); return; }
          ritaHjalp();
          kommentar(inne, 'pyssel', 'Så där.');
        }
      }
      var fig = el('button', 'titta pyssel', FIGURER.pyssel.emoji);
      fig.type = 'button';
      fig.setAttribute('aria-label', 'Pyssel: ' + fraga);
      var bubbla = el('button', 'titta-fraga', fraga);
      bubbla.type = 'button';
      fig.addEventListener('click', tryck);
      bubbla.addEventListener('click', tryck);
      hjalp.appendChild(fig);
      hjalp.appendChild(bubbla);
    }
    ritaHjalp();

    function blevKlar() {
      s.granKlar = true;
      s.granHjalp = null;
      spara();
      ritaHjalp();
      las();
      prata(inne, [['pyssel', 'Okej, wow. Exakt som vi gjorde den. Kolla vad fint det lyser!']]);
    }
    if (s.granKlar) las();
    else if (stammerGranen()) blevKlar();   // t.ex. efter Pynta rätt i testläget
  }

  // Granen ritas som granarna på kalenderns vimpel: en grön triangel med snö på toppen.
  // Femton platser, 1 till 5 på varje rad uppifrån. Pynt skrivs 'form:färg', tom plats ''.
  var PYNT_FORM = { kula: 'Kula', stjarna: 'Stjärna', klocka: 'Klocka', kapp: 'Polkagriskäpp' };
  var PYNT_FARG = {
    rod: { namn: 'Röd', fyll: '#E5484D', kant: '#A92D33' },
    guld: { namn: 'Guld', fyll: '#F5C451', kant: '#B98A1E' },
    bla: { namn: 'Blå', fyll: '#4C9EEB', kant: '#2B6DB0' },
    silver: { namn: 'Silver', fyll: '#E6EBF2', kant: '#8E9AAD' }
  };
  var GRAN_RADER = [[0.30, 1], [0.45, 2], [0.60, 3], [0.75, 4], [0.90, 5]];
  var SVG_NS = 'http://www.w3.org/2000/svg';

        ' Q' + f(cx - 8) + ' ' + f(cy - 11) + ' ' + f(cx) + ' ' + f(cy - 11) + ' Q' + f(cx + 8) + ' ' + f(cy - 11) + ' ' + f(cx + 9) + ' ' + f(cy - 1) +
        ' Q' + f(cx + 11) + ' ' + f(cy + 4) + ' ' + f(cx + 12) + ' ' + f(cy + 9) + ' Z', fill: k.fyll, stroke: k.kant, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);

  // Anteckningsboken: namn mot plats och band, och band mot plats. Tryck = ✕, igen = ✓, igen = ?, igen = tomt.

  function ritaAkt3(inne, scen) {
