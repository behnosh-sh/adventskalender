  // Sänk målet: efter 4 missade rundor eller 2 minuters spel. Hoppa över: efter 10 rundor eller 5 minuter.
  // Det som kommer först gäller, så att långsamma spel som Memory inte drar ut på tiden.
  // Knapparna visas först när rundan man håller på med är slut.
  var SANK_EFTER = 4, HOPPA_EFTER = 10, SANK_TID = 120000, HOPPA_TID = 300000;

  // Vilket spel var och en får: först ett spel man vann (bäst medalj först), i turordning.
  // Den som inte vann något får det där man placerade sig bäst bland de spel som är kvar. Ingen får samma.
  function tilldelaProv(svar) {
    var spelare = ordning(svar.spelare), dagar = Object.keys(PROV_SPEL).map(Number);
    var kand = {};
    spelare.forEach(function (n) { kand[n] = []; });
    dagar.forEach(function (d) {
      var dd = svar.dagar[d];
      if (!dd || !dd.harSpelat) return;
      Advent.Resultat.ordna(d, dd, svar.spelare).forEach(function (r) {
        if (r.status !== 'klar' || !kand[r.spelare]) return;
        kand[r.spelare].push({ dag: d, plats: r.plats, medalj: MEDALJ_VARDE[r.medalj] || 0, varde: r.varde, text: r.text });
      });
    });
    var tagna = {}, ut = {};
    function ta(n, k, vann) { tagna[k.dag] = true; ut[n] = { dag: k.dag, varde: k.varde, text: k.text, vann: vann }; }
    spelare.forEach(function (n) {
      var vunna = kand[n].filter(function (k) { return k.plats === 1 && !tagna[k.dag]; })
        .sort(function (a, b) { return b.medalj - a.medalj; });
      if (vunna.length) ta(n, vunna[0], true);
    });
    spelare.forEach(function (n) {
      if (ut[n]) return;
      var rest = kand[n].filter(function (k) { return !tagna[k.dag]; })
        .sort(function (a, b) { return (a.plats - b.plats) || (b.medalj - a.medalj); });
      if (rest.length) { ta(n, rest[0], false); return; }
      var ledig = dagar.filter(function (d) { return !tagna[d]; })[0] || dagar[0];
      ta(n, { dag: ledig, varde: PROV_SPEL[ledig].reserv, text: '' }, null);
    });
    return ut;
  }

  // Testläget: exempel på ett decemberresultat, spelet väljs i testrutan.
  var TEST_PROV = {
    1: { dag: 1, varde: 12 * 10000 + 9000, text: 'längd 12 · 0:41', vann: true },
    17: { dag: 17, varde: 28 * 100000 + 700, text: '28 drag · 1:10', vann: false },
    8: { dag: 8, varde: 724, text: '72,4 %', vann: true },
    15: { dag: 15, varde: 1040, text: '40 poäng', vann: false },
    22: { dag: 22, varde: 6 * 10000 + 9000, text: 'längd 6 · 0:21', vann: true },
    23: { dag: 23, varde: 5 * 1000 + 300, text: '5 skorstenar', vann: false },
    14: { dag: 14, varde: 1534 * 10000 + 142, text: '2:33 · 142 drag', vann: true },
    12: { dag: 12, varde: 1124, text: '1:52,4', vann: false },
    10: { dag: 10, varde: 45.3, text: '45,3 s', vann: true }
  };

  function hamtaMittProv() {
    if (s.prov && s.prov.dag) return Promise.resolve(s.prov);
    var val = test ? Promise.resolve(TEST_PROV[s.testSpel || 1]) : Advent.Resultat.alla().then(function (svar) {
      return tilldelaProv(svar)[Advent.Resultat.namn()];
    });
    return val.then(function (t) {
      s.prov = { dag: t.dag, varde: t.varde, text: t.text, vann: t.vann, mal: t.varde, forsok: 0, missar: 0, sankt: false };
      spara();
      return s.prov;
    });
  }

  function fyll(mall, p) {
    var spel = PROV_SPEL[p.dag];
    return mall.replace(/\{namn\}/g, provNamn()).replace(/\{spel\}/g, spel.namn)
      .replace(/\{dag\}/g, String(p.dag)).replace(/\{resultat\}/g, p.text);
  }

  function oppnaProv(skap, lampa, lampraden) {
    if (skap.querySelector('.prov')) return;
    var prov = el('div', 'prov');
    prov.appendChild(el('p', 'platshallare', 'Tomten letar i sitt kalkylark…'));
    skap.appendChild(prov);
    hamtaMittProv().then(function (p) {
      var spel = PROV_SPEL[p.dag], nr = Math.max(0, minPlats()) % 4;
      prov.textContent = '';
      if (!p.forsok) {
        var mall = p.vann === true ? PROV_TEXT.vann[nr] : p.vann === false ? PROV_TEXT.bast[nr] : PROV_TEXT.reserv;
        prov.appendChild(el('p', 'inledning', fyll(mall, p)));
        prov.appendChild(el('p', 'skill', spel.skill));
      }
      prov.appendChild(el('p', 'mal', spel.malText(p.mal)));
      var start = el('button', 'knapp', p.forsok ? 'Fortsätt' : 'Anta utmaningen');
      start.type = 'button';
      prov.appendChild(start);
      start.addEventListener('click', function () {
        prov.remove();
        spelaProv(skap, lampa, lampraden);
      });
    }, function (fel) {
      prov.textContent = '';
      prov.appendChild(el('p', null, fel.message));
      var igen = el('button', 'knapp', 'Försök igen');
      igen.type = 'button';
      igen.addEventListener('click', function () { prov.remove(); oppnaProv(skap, lampa, lampraden); });
      prov.appendChild(igen);
    });
  }

  // Spelet öppnas i en ram över hela skärmen. Varje färdig runda räknas som ett försök.
  function spelaProv(skap, lampa, lampraden) {
    var p = s.prov, spel = PROV_SPEL[p.dag];
    var yta = el('div', 'provspel');
    var topp = el('div', 'topp');
    var mal = el('p', 'mal', spel.malText(p.mal));
    var stang = el('button', 'stang', '✕');
    stang.type = 'button';
    stang.setAttribute('aria-label', 'Tillbaka till skåpet');
    topp.appendChild(mal);
    topp.appendChild(stang);
    var hjalp = el('div', 'hjalp');
    hjalp.hidden = true;
    var ram = el('iframe');
    ram.title = spel.namn;
    ram.src = spel.sokvag + '?dag=' + p.dag + '&prov=1';
    yta.appendChild(topp);
    yta.appendChild(hjalp);
    yta.appendChild(ram);
    document.body.appendChild(yta);
    document.body.style.overflow = 'hidden';

    function stangSpel() {
      clearInterval(klocka);
      spara();
      window.removeEventListener('message', tagEmot);
      yta.remove();
      document.body.style.overflow = '';
    }
    // Efter fyra missar dyker Sänk målet upp, efter tio försök Hoppa över. Första gången med en
    // fråga, sedan ligger knapparna kvar under målet tillsammans med Spela igen.
    var ritat = null;
    function ritaHjalp() {
      var tid = p.tid || 0;
      var sankLas = p.missar >= SANK_EFTER || tid >= SANK_TID;
      var kanSanka = !p.sankt && sankLas, kanHoppa = p.forsok >= HOPPA_EFTER || tid >= HOPPA_TID;
      var nu = (kanSanka ? 's' : '') + (kanHoppa ? 'h' : '') + (p.sankt ? 'x' : '');
      if (nu === ritat && !hjalp.dataset.ny) return;
      ritat = nu;
      delete hjalp.dataset.ny;
      hjalp.textContent = '';
      hjalp.hidden = !sankLas && !kanHoppa;
      if (hjalp.hidden) return;
      var fraga = kanHoppa && !p.sagtHoppa ? 'hoppa' : kanSanka && !p.sagtSank ? 'sank' : null;
      if (fraga) hjalp.appendChild(el('p', null, fraga === 'hoppa' ? PROV_TEXT.hoppa : PROV_TEXT.sankMal));
      function sagt() {
        if (fraga === 'hoppa') p.sagtHoppa = true;
        if (fraga === 'sank') p.sagtSank = true;
        hjalp.dataset.ny = '1';
      }
      var rad = el('div', 'rad');
      var igen = el('button', 'knapp ljus', 'Spela igen');
      igen.type = 'button';
      igen.addEventListener('click', function () { sagt(); spara(); ram.src = ram.src; ritaHjalp(); });
      rad.appendChild(igen);
      if (kanSanka) {
        var sank = el('button', 'knapp', 'Sänk målet');
        sank.type = 'button';
        sank.addEventListener('click', function () {
          sagt();
          p.sagtSank = true;
          p.sankt = true;
          p.mal = spel.sank(p.varde);
          spara();
          mal.textContent = spel.malText(p.mal);
          ram.src = ram.src;
          ritaHjalp();
        });
        rad.appendChild(sank);
      }
      if (kanHoppa) {
        var hoppa = el('button', 'knapp gul', 'Hoppa över');
        hoppa.type = 'button';
        hoppa.addEventListener('click', function () { stangSpel(); provKlart('hoppat', skap, lampa, lampraden); });
        rad.appendChild(hoppa);
      }
      hjalp.appendChild(rad);
    }
    function tagEmot(e) {
      if (e.origin !== location.origin || e.source !== ram.contentWindow) return;
      var d = e.data;
      if (!d || d.typ !== 'provRunda' || typeof d.varde !== 'number') return;
      p.forsok++;
      if (spel.nar(d.varde, p.mal)) {
        spara();
        setTimeout(function () { stangSpel(); provKlart(p.sankt ? 'sankt' : 'fullt', skap, lampa, lampraden); }, 900);
        return;
      }
      p.missar++;
      spara();
      ritaHjalp();
    }
    window.addEventListener('message', tagEmot);
    stang.addEventListener('click', stangSpel);
    // Speltiden räknas bara medan provet är öppet och sidan syns.
    var forra = Date.now();
    var klocka = setInterval(function () {
      var nu = Date.now();
      if (!document.hidden) p.tid = (p.tid || 0) + Math.min(nu - forra, 5000);
      forra = nu;
      if (Math.floor(p.tid / 1000) % 5 === 0) spara();
    }, 1000);   // knapparna visas först när en runda är slut (tagEmot), aldrig mitt i en runda
    ritaHjalp();
  }

  function provKlart(hur, skap, lampa, lampraden) {
    var plats = minPlats();
    s.prov.hur = hur;
    s.provKlar = true;
    if (test) s.testAntal = Math.max(s.testAntal || 0, plats + 1);
    spara();
    if (!test) {
      Advent.Resultat.skicka({ dag: 24, spel: 'mästarprov ' + PROV_SPEL[s.prov.dag].namn, status: 'klar', varde: 0, medalj: '',
        text: { fullt: 'fullt mål', sankt: 'sänkt mål', hoppat: 'hoppade över' }[hur] }).catch(function () {});
    }
    var v = visaSiffran(skap);
    v.stang.addEventListener('click', function () {
      v.prov.remove();
      // Kuvertet glider in i springan, ett förseglat kuvert med siffran hamnar under skåpet
      // och lampan slocknar långsamt, ungefär tio sekunder.
      ritaLampa(lampa, lampraden);
      laggSvarskuvert(skap);
    });
  }

  // ===== Akt 2 =====
  // Lagen lottas med ett fast frö, så att alla telefoner får samma lag. A och B tar Pyssels dörr
  // (A ser den hemliga granen, B pyntar), C och D tar Trassels.
  var LAG_FRO = 'kassaskap-lag-2026';
  var TEST_NAMN = ['Behnosh', 'Daniel', 'Josefin', 'Joel'];
  function hamtaLag() {
    if (test) {
      var lag = TEST_NAMN.slice(1);
      lag.splice(s.testRoll || 0, 0, TEST_NAMN[0]);
      return Promise.resolve(lag);
    }
    if (s.lag) return Promise.resolve(s.lag);
    return Advent.Resultat.hamta(24).then(function (svar) {
      s.lag = blandaFast(svar.spelare, LAG_FRO);
      spara();
      return s.lag;
    });
  }
  function minRoll(lag) { return test ? (s.testRoll || 0) : lag.indexOf(Advent.Resultat.namn()); }
  function lagText(t, lag) { return t.replace(/\{([ABCD])\}/g, function (m, b) { return lag['ABCD'.indexOf(b)] || ''; }); }

  function ritaAkt2(inne, scen) {
    inne.parentNode.classList.remove('hog');
    stoppaBlink();
    var dorrar = el('div', 'smadorrar');
    var lila = smaDorr('lila', '👩‍🎤 Pyssel', '🎄');
    var gron = smaDorr('gron', '🧑‍🎤 Trassel', '📜');
    var lampor = el('div', 'lampor');
    for (var i = 0; i < 4; i++) lampor.appendChild(el('span', 'liten-lampa'));
    gron.fylling.appendChild(lampor);
    dorrar.appendChild(lila.plats);
    dorrar.appendChild(gron.plats);
    scen.appendChild(dorrar);
    var under = el('div', 'akt2-under');
    scen.appendChild(under);

    function visaDorrar(lag) {
      var roll = minRoll(lag);
      if (roll === 0 || roll === 1) {
        lila.dorr.classList.add('glant');
        lila.oppnas(function () { oppnaGran(inne, lag, roll); }, 'Pyssels dörr, på glänt. Tryck för att öppna.');
        if (s.vy === 'gran' && s.sett.gran) { oppnaGran(inne, lag, roll); return; }
      }
      if (s.fargKlar) {
        oppnaTrassel();
        if (s.vy === 'brev') { oppnaBrev(inne, lag, roll); return; }
        under.appendChild(gataFalt(inne));
        return;
      }
      farglas(lag);
    }
    function oppnaTrassel() {
      gron.dorr.classList.add('oppen');
      gron.oppnas(null, null);
      gron.bakom.disabled = false;
      gron.bakom.setAttribute('aria-label', 'Trassels brev');
      gron.bakom.addEventListener('click', function () { hamtaLag().then(function (lag) { oppnaBrev(inne, lag, minRoll(lag)); }); });
    }

    // Trassels färglås: färgerna i blinkordningen, varje rätt tryck tänder nästa lampa, fel = alla slocknar.
    function farglas(lag) {
      var g = svar().gran;
      if (!g) { under.appendChild(el('p', 'platshallare', 'Färglåset är inte klart än.')); return; }
      var n = 0;
      var fel = roterande(['Nej. Bara nej.', 'Inte ens nära.', 'Trassel, de håller på att trycka på måfå.', 'Har ni ens tittat på granen?', 'Ok, jag hämtar popcorn.', 'Det är fyra färger. Fyra. Ni klarar det.']);
      var knappar = el('div', 'fargknappar');
      knappar.setAttribute('aria-label', 'Färglåset på Trassels dörr');
      Object.keys(PYNT_FARG).forEach(function (f) {
        var b = el('button', 'fargknapp');
        b.type = 'button';
        b.setAttribute('aria-label', PYNT_FARG[f].namn);
        b.style.background = PYNT_FARG[f].fyll;
        b.addEventListener('click', function () {
          var lamps = lampor.children;
          if (f === g.blink[n]) {
            lamps[n].style.background = PYNT_FARG[f].fyll;
            lamps[n].style.color = PYNT_FARG[f].fyll;
            lamps[n].classList.add('tand');
            n++;
            if (n === g.blink.length) {
              s.fargKlar = true;
              spara();
              knappar.remove();
              setTimeout(function () {
                prata(inne, [['pyssel', 'Snyggt. Nu får vi se om ni klarar brevet också.']], function () {
                  oppnaTrassel();
                  under.appendChild(gataFalt(inne));
                });
              }, 500);
            }
            return;
          }
          n = 0;
          Array.prototype.forEach.call(lamps, function (l) { l.classList.remove('tand'); l.style.background = ''; l.style.color = ''; });
          skaka(gron.dorr);
          kommentar(inne, 'pyssel', fel());
        });
        knappar.appendChild(b);
      });
      gron.fylling.appendChild(knappar);
    }

    function efterIntro() {
      hamtaLag().then(function (lag) {
        if (s.sett.lag) { visaDorrar(lag); return; }
        prata(inne, [
          ['pyssel', lagText('Vi delar upp er. {A} och {B}, ni tar min dörr.', lag)],
          ['trassel', lagText('{C} och {D}, ni får min. Spara på hjärncellerna.', lag)],
          ['pyssel', 'Och ni som inte spelar: inget fusk från soffan.']
        ], function () { s.sett.lag = true; spara(); visaDorrar(lag); });
      }, function () {
        var igen = el('button', 'knapp ljus', 'Försök igen');
        igen.type = 'button';
        igen.style.width = 'auto';
        igen.addEventListener('click', function () { under.textContent = ''; efterIntro(); });
        under.appendChild(el('p', 'platshallare', 'Skåpet når inte resultatarket just nu.'));
        under.appendChild(igen);
      });
    }
    if (s.sett.akt2) { efterIntro(); return; }
    prata(inne, [
      ['pyssel', 'Psst. Vi är tomtens barnbarn. Morfar tror att vi bara sitter med mobilen hela julen.'],
      ['trassel', 'Vilket vi gör. Men i år har vi också tagit över hans skåp.'],
      ['pyssel', 'Vi har byggt två egna dörrar. Ingen av dem går att öppna ensam, det har vi sett till.'],
      ['trassel', 'Morfar har ingen aning.']
    ], function () { s.sett.akt2 = true; spara(); efterIntro(); });
  }

  // En liten skåpdörr med namnskylt, fylling och handtag. Bakom den ligger det som dörren gömmer.
  function smaDorr(farg, namn, bakom) {
    var plats = el('div', 'dorrplats');
    var bak = el('button', 'bakom', bakom);
    bak.type = 'button';
    bak.disabled = true;
    bak.setAttribute('aria-hidden', 'true');
    var dorr = el('div', 'smadorr ' + farg);
    dorr.setAttribute('aria-label', namn.replace(/^\S+ /, '') + 's dörr, stängd');
    dorr.appendChild(el('span', 'skylt', namn));
    var fylling = el('span', 'fylling');
    dorr.appendChild(fylling);
    dorr.appendChild(el('span', 'handtag'));
    plats.appendChild(bak);
    plats.appendChild(dorr);
    return {
      plats: plats, dorr: dorr, fylling: fylling, bakom: bak,
      oppnas: function (klick, etikett) {
        bak.removeAttribute('aria-hidden');
        if (!klick) { dorr.setAttribute('aria-hidden', 'true'); return; }
        dorr.setAttribute('role', 'button');
        dorr.tabIndex = 0;
        dorr.setAttribute('aria-label', etikett);
        dorr.addEventListener('click', klick);
        dorr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); klick(); } });
      }
    };
  }

  // Fältet för gåtans svar. Rätt svar fäller undan dörrarna och tar en till akt 3.
  function gataFalt(inne) {
    var trassel = roterande(['Haha. Nej.', 'Fel. Men kreativt.', 'Pyssel, de har inte knäckt koden än.', 'Morfar hade gissat samma sak.', 'Läs gåtan en gång till. Långsamt.']);
    return falt('Gåtans svar', function (text) {
      if (stammer(text, svar().ord)) {
        prata(inne, [['trassel', 'Va?! Det har ingen klarat förut. Okej. Ni är bättre än vi trodde.']], function () {
          s.steg = 'akt3';
          s.vy = null;
          spara();
          ritaInne(inne);
        });
        return true;
      }
      kommentar(inne, 'trassel', trassel());
      return false;
    });
  }

  // Trassels brev på barnbarnens hemliga språk: en julsymbol per bokstav.
  // {C} har brevet (ett ord per sida), {D} har nyckelboken (fem symboler per sida, blandad ordning).
  // Fem par symboler liknar varandra, och paren ligger på olika sidor i nyckelboken.
  var KOD_TECKEN = {
    A: '🎄', Q: '🌲', E: '⭐', W: '🌟', N: '⛄', X: '☃️', R: '🧦', Z: '🧤', S: '🍬', 'Ä': '🍭',
    B: '🌙', C: '🍊', D: '🎁', F: '🧸', G: '🕯️', H: '🦌', I: '🍪', J: '🎺', K: '🧁', L: '🔔',
    M: '🛷', O: '🎀', P: '🦉', T: '🥛', U: '🌰', V: '🏠', Y: '🎈', 'Å': '🍎', 'Ö': '🧣'
  };
  var NYCKELBOK = ['ACRBP', 'EMQIV', 'NDZTJ', 'SLWHF', 'XOÄGU', 'KYÅÖ'];
  function oppnaBrev(inne, lag, roll) {
    inne.textContent = '';
    pratRuta = null;
    inne.parentNode.classList.add('hog');
    s.vy = 'brev';
    spara();
    var scen = el('div', 'scen granscen brevscen');
    inne.appendChild(scen);
    var bakat = el('button', 'bakat', '← Dörrarna');
    bakat.type = 'button';
    bakat.addEventListener('click', function () { s.vy = null; spara(); ritaInne(inne); });
    scen.appendChild(bakat);
    var text = svar().brev;
    if (!text) { scen.appendChild(el('p', 'platshallare', 'Brevet är inte klart än.')); return; }

    if (roll === 2) ritaBrevet(scen, text);
    else if (roll === 3) ritaNyckelboken(scen);
    else scen.appendChild(el('p', 'platshallare', lagText('Brevet är till {C} och {D}. Ni andra får bara titta på.', lag)));
    scen.appendChild(gataFalt(inne));

    if (s.sett.brev) return;
    prata(inne, [
      ['trassel', 'Bakom min dörr ligger ett brev på vårt hemliga språk. Vi uppfann det för att morfar inte skulle kunna läsa våra lappar.'],
      ['pyssel', 'Han har fortfarande inte knäckt det.'],
      ['trassel', lagText('{C}, du har brevet. {D}, du har nyckeln. Ni får läsa upp för varandra, men ingen visar sin skärm.', lag)]
    ], function () { s.sett.brev = true; spara(); });
  }

  // Bläddrar med ‹ och ›. sida(n) ritar sida n i ruta. Sidan sparas i s[nyckel].
  function bladdra(scen, antal, nyckel, namn, sida) {
    var bok = el('div', 'bladder');
    var ruta = el('div', 'bladder-sida');
    var rad = el('div', 'bladder-rad');
    var bak = el('button', 'pil', '‹');
    var fram = el('button', 'pil', '›');
    var nr = el('span', 'sidnr');
    bak.type = fram.type = 'button';
    bak.setAttribute('aria-label', 'Förra');
    fram.setAttribute('aria-label', 'Nästa');
    rad.appendChild(bak);
    rad.appendChild(nr);
    rad.appendChild(fram);
    bok.appendChild(ruta);
    bok.appendChild(rad);
    scen.appendChild(bok);
    function visa(n) {
      n = (n + antal) % antal;
      s[nyckel] = n;
      spara();
      ruta.textContent = '';
      sida(n, ruta);
      nr.textContent = namn + ' ' + (n + 1) + ' av ' + antal;
    }
    bak.addEventListener('click', function () { visa((s[nyckel] || 0) - 1); });
    fram.addEventListener('click', function () { visa((s[nyckel] || 0) + 1); });
    visa(s[nyckel] || 0);
  }

  function ritaBrevet(scen, text) {
    scen.appendChild(el('p', 'hemligt', '🙈 Bara för dina ögon.'));
    if (!s.brevSvar) s.brevSvar = {};
    var ord = [], pos = 0;
    text.split(' ').forEach(function (o) { ord.push({ start: pos, tecken: Array.from(o) }); pos += Array.from(o).length; });
    var helt = el('p', 'helt-brev');
    function ritaHelt() {
      var klart = ord.every(function (o) { return o.tecken.every(function (b, i) { return !KOD_TECKEN[b] || s.brevSvar[o.start + i]; }); });
      helt.hidden = !klart;
      helt.textContent = klart ? 'Det du har skrivit: ' + ord.map(function (o) {
        return o.tecken.map(function (b, i) { return KOD_TECKEN[b] ? s.brevSvar[o.start + i] : b; }).join('');
      }).join(' ') : '';
    }
    bladdra(scen, ord.length, 'brevSida', 'Ord', function (n, ruta) {
      var o = ord[n];
      var kodbrev = el('div', 'kodbrev');
      var rutor = [];
      o.tecken.forEach(function (b, i) {
        var sym = KOD_TECKEN[b];
        if (!sym) { kodbrev.appendChild(el('span', 'tecken', b)); return; }
        var t = el('label', 'tecken');
        t.appendChild(el('span', 'sym', sym));
        var inp = el('input');
        inp.maxLength = 2;
        inp.autocomplete = 'off';
        inp.autocapitalize = 'characters';
        inp.spellcheck = false;
        inp.value = s.brevSvar[o.start + i] || '';
        inp.setAttribute('aria-label', 'Bokstav ' + (i + 1));
        inp.addEventListener('input', function () {
          var v = stada(inp.value).replace(/[^A-ZÅÄÖ]/g, '').slice(-1);
          inp.value = v;
          s.brevSvar[o.start + i] = v;
          spara();
          ritaHelt();
          if (!v) return;
          var j = rutor.indexOf(inp) + 1;
          if (j < rutor.length) rutor[j].focus(); else inp.blur();
        });
        inp.addEventListener('focus', function () { inp.select(); });
        rutor.push(inp);
        t.appendChild(inp);
        kodbrev.appendChild(t);
      });
      ruta.appendChild(kodbrev);
    });
    scen.appendChild(helt);
    ritaHelt();
  }

  function ritaNyckelboken(scen) {
    scen.appendChild(el('p', 'hemligt', '🙈 Bara för dina ögon.'));
    bladdra(scen, NYCKELBOK.length, 'nyckelSida', 'Sida', function (n, ruta) {
      var sida = el('div', 'nyckelsida');
      Array.from(NYCKELBOK[n]).forEach(function (b) {
        var par = el('span', 'par');
        par.appendChild(el('span', 'sym', KOD_TECKEN[b]));
        par.appendChild(el('b', null, b));
        sida.appendChild(par);
      });
      ruta.appendChild(sida);
    });
  }

  // Pyssels gran bakom den lila dörren. roll 0 ser den hemliga granen, roll 1 pyntar.
  // s.vy = 'gran' när granen är öppen, så att man hamnar där igen om sidan laddas om.
  function oppnaGran(inne, lag, roll) {
    var g = svar().gran;
    inne.textContent = '';
    pratRuta = null;
    inne.parentNode.classList.add('hog');
    s.vy = 'gran';
    spara();
    var scen = el('div', 'scen granscen');
    inne.appendChild(scen);
    var bakat = el('button', 'bakat', '← Dörrarna');
    bakat.type = 'button';
    bakat.addEventListener('click', function () { stoppaBlink(); s.vy = null; spara(); ritaInne(inne); });
    scen.appendChild(bakat);
    function visa() {
      if (!g) { scen.appendChild(el('p', 'platshallare', 'Granen är inte klar än.')); return; }
      if (roll === 0) {
        scen.appendChild(el('p', 'hemligt', '🙈 Bara för dina ögon.'));
        var hemlig = granSvg(g.pynt, null);
        hemlig.setAttribute('aria-label', 'Den hemliga granen');
        scen.appendChild(hemlig);
        return;
      }
      pynta(inne, scen, g);
    }
    // Granen syns direkt, barnbarnen pratar framför den första gången.
    visa();
    if (s.sett.gran) return;
    prata(inne, [
      ['pyssel', 'Morfars gran var så tråkig att vi pyntade om den. Sen ångrade vi oss och rev av allt.'],
      ['trassel', 'Klassiskt.'],
      ['pyssel', lagText('{A}, bara du får se hur granen ska se ut. Visa den inte för någon, beskriv den med ord.', lag)],
      ['trassel', lagText('{B}, du har lådan med pynt. Du får lyssna och fråga, men aldrig titta på {A}s skärm.', lag)],
      ['pyssel', 'Gör den exakt likadan.']
    ], function () { s.sett.gran = true; spara(); });
  }

  // Den som pyntar väljer form och färg i lådan och trycker på en plats. Samma sak en gång till tar bort den.
  function pynta(inne, scen, g) {
    if (!s.gran || s.gran.length !== g.pynt.length) s.gran = g.pynt.map(function () { return ''; });
    var form = s.granForm || 'kula', farg = s.granFarg || 'rod';
    function stammerGranen() { return s.gran.every(function (p, j) { return p === g.pynt[j]; }); }
    var gran = granSvg(s.gran, function (i) {
      if (s.granKlar) return;
      var sak = form + ':' + farg;
      s.gran[i] = s.gran[i] === sak ? '' : sak;
      gran.satt(i, s.gran[i]);
      spara();
      if (stammerGranen()) blevKlar();
    });
    gran.setAttribute('aria-label', 'Granen du pyntar');
    scen.appendChild(gran);

    var lada = el('div', 'pyntlada');
    lada.setAttribute('aria-label', 'Lådan med pynt');
    var formRad = el('div', 'ladrad'), fargRad = el('div', 'ladrad');
    lada.appendChild(formRad);
    lada.appendChild(fargRad);
    function ritaLada() {
      formRad.textContent = '';
      fargRad.textContent = '';
      Object.keys(PYNT_FORM).forEach(function (f) {
        var b = el('button');
        b.type = 'button';
        b.setAttribute('aria-label', PYNT_FORM[f]);
        b.setAttribute('aria-pressed', String(f === form));
        b.appendChild(pyntIkon(f, farg));
        b.addEventListener('click', function () { form = s.granForm = f; spara(); ritaLada(); });
        formRad.appendChild(b);
      });
      Object.keys(PYNT_FARG).forEach(function (f) {
        var b = el('button', 'farg');
        b.type = 'button';
        b.setAttribute('aria-label', PYNT_FARG[f].namn);
        b.setAttribute('aria-pressed', String(f === farg));
        var k = el('span', 'fargklick');
        k.style.background = PYNT_FARG[f].fyll;
        b.appendChild(k);
        b.addEventListener('click', function () { farg = s.granFarg = f; spara(); ritaLada(); });
        fargRad.appendChild(b);
      });
    }
    ritaLada();
    var tips = el('p', 'tips', 'Välj form och färg i lådan och tryck på granen. Tryck en gång till för att ta bort.');
    scen.appendChild(lada);
    scen.appendChild(tips);
    function las() {
      lada.remove();
      tips.remove();
      gran.classList.add('las');
      startaBlink(gran, g.blink);
    }
    function blevKlar() {
      s.granKlar = true;
      spara();
      las();
      prata(inne, [['pyssel', 'Okej, wow. Exakt som vi gjorde den. Kolla hur pyntet lyser!']]);
    }
    if (s.granKlar) las();
    else if (stammerGranen()) blevKlar();   // t.ex. efter Pynta rätt i testläget
  }

  // Granen ritas som granarna på kalenderns vimpel: en grön triangel med snö på toppen.
  // Femton platser, 1 till 5 på varje rad uppifrån. Pynt skrivs 'form:färg', tom plats ''.
  var PYNT_FORM = { kula: 'Kula', stjarna: 'Stjärna', klocka: 'Klocka', kapp: 'Polkagriskäpp' };
  var PYNT_FARG = {
    rod: { namn: 'Röd', fyll: '#E5484D', kant: '#A92D33' },
    guld: { namn: 'Guld', fyll: '#F5C451', kant: '#B98A1E' },
    bla: { namn: 'Blå', fyll: '#4C9EEB', kant: '#2B6DB0' },
    silver: { namn: 'Silver', fyll: '#E6EBF2', kant: '#8E9AAD' }
  };
  var GRAN_RADER = [[0.30, 1], [0.45, 2], [0.60, 3], [0.75, 4], [0.90, 5]];
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tagg, attr, mor) {
    var x = document.createElementNS(SVG_NS, tagg);
    for (var k in attr) x.setAttribute(k, attr[k]);
    if (mor) mor.appendChild(x);
    return x;
  }
  // Ritar ett pynt med mitten i (cx, cy), ungefär 28 enheter stort.
  function ritaPynt(mor, form, farg, cx, cy) {
    var k = PYNT_FARG[farg];
    var g = svgEl('g', { class: 'kula' }, mor);
    g.style.color = k.fyll;
    var f = function (n) { return n.toFixed(1); };
    if (form === 'kula') {
      svgEl('rect', { x: cx - 3.5, y: cy - 16, width: 7, height: 5, rx: 1.5, fill: '#B9A27A' }, g);
      svgEl('circle', { cx: cx, cy: cy, r: 12, fill: k.fyll, stroke: k.kant, 'stroke-width': 2 }, g);
      svgEl('circle', { cx: cx - 4, cy: cy - 4, r: 3.5, fill: 'rgba(255,255,255,.55)' }, g);
    } else if (form === 'stjarna') {
      var pts = [];
      for (var i = 0; i < 10; i++) {
        var v = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 6 : 14;
        pts.push(f(cx + r * Math.cos(v)) + ',' + f(cy + 1 + r * Math.sin(v)));
      }
      svgEl('polygon', { points: pts.join(' '), fill: k.fyll, stroke: k.kant, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
    } else if (form === 'klocka') {
      svgEl('circle', { cx: cx, cy: cy - 13, r: 2.5, fill: 'none', stroke: '#B9A27A', 'stroke-width': 2 }, g);
      svgEl('circle', { cx: cx, cy: cy + 10, r: 3.5, fill: k.kant }, g);
      svgEl('path', { d: 'M' + f(cx - 12) + ' ' + f(cy + 9) + ' Q' + f(cx - 11) + ' ' + f(cy + 4) + ' ' + f(cx - 9) + ' ' + f(cy - 1) +
        ' Q' + f(cx - 8) + ' ' + f(cy - 11) + ' ' + f(cx) + ' ' + f(cy - 11) + ' Q' + f(cx + 8) + ' ' + f(cy - 11) + ' ' + f(cx + 9) + ' ' + f(cy - 1) +
        ' Q' + f(cx + 11) + ' ' + f(cy + 4) + ' ' + f(cx + 12) + ' ' + f(cy + 9) + ' Z', fill: k.fyll, stroke: k.kant, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
    } else {
      var d = 'M' + f(cx + 4) + ' ' + f(cy + 14) + ' L' + f(cx + 4) + ' ' + f(cy - 6) + ' A6 6 0 0 0 ' + f(cx - 8) + ' ' + f(cy - 6) + ' L' + f(cx - 8) + ' ' + f(cy - 3);
      svgEl('path', { d: d, fill: 'none', stroke: k.kant, 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
      svgEl('path', { d: d, fill: 'none', stroke: k.fyll, 'stroke-width': 5, 'stroke-linecap': 'round' }, g);
      svgEl('path', { d: d, fill: 'none', stroke: farg === 'silver' ? '#8E9AAD' : '#FFFFFF', 'stroke-width': 5, 'stroke-dasharray': '2.5 4' }, g);
    }
    return g;
  }
  function pyntIkon(form, farg) {
    var svg = svgEl('svg', { viewBox: '-17 -18 34 34', width: 32, height: 32, 'aria-hidden': 'true' });
    ritaPynt(svg, form, farg, 0, 0);
    return svg;
  }
  function pyntNamn(sak) {
    var d = sak.split(':');
    return PYNT_FARG[d[1]].namn.toLowerCase() + ' ' + PYNT_FORM[d[0]].toLowerCase();
  }
  function granSvg(pynt, klick) {
    var W = 214, H = 290, X0 = 28, Y0 = 6;
    var p = function (pts) { return pts.map(function (q) { return (X0 + q[0] * W).toFixed(1) + ',' + (Y0 + q[1] * H).toFixed(1); }).join(' '); };
    var svg = svgEl('svg', { viewBox: '0 0 270 304', class: 'gran-svg', role: 'img' });
    svgEl('polygon', { points: p([[0.5, 0], [1, 1], [0, 1]]), fill: '#5FAF7E' }, svg);
    svgEl('polygon', { points: p([[0.5, 0], [0.76, 0.158], [0.66, 0.134], [0.58, 0.182], [0.5, 0.142], [0.42, 0.189], [0.34, 0.142], [0.24, 0.158]]), fill: '#FFFFFF' }, svg);
    var platser = [];
    GRAN_RADER.forEach(function (rad) {
      for (var i = 0; i < rad[1]; i++) platser.push([0.5 + (i - (rad[1] - 1) / 2) * 0.18, rad[0]]);
    });
    var grupper = platser.map(function (q, i) {
      var gr = svgEl('g', { class: 'plats' }, svg);
      gr.dataset.cx = X0 + q[0] * W;
      gr.dataset.cy = Y0 + q[1] * H;
      if (klick) {
        gr.setAttribute('role', 'button');
        gr.setAttribute('tabindex', '0');
        gr.addEventListener('click', function () { klick(i); });
        gr.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); klick(i); } });
      }
      return gr;
    });
    function satt(i, sak) {
      var gr = grupper[i], cx = +gr.dataset.cx, cy = +gr.dataset.cy;
      while (gr.firstChild) gr.removeChild(gr.firstChild);
      gr.dataset.farg = sak ? sak.split(':')[1] : '';
      gr.setAttribute('aria-label', 'Plats ' + (i + 1) + ': ' + (sak ? pyntNamn(sak) : 'tom'));
      svgEl('circle', { cx: cx, cy: cy, r: 18, fill: 'transparent' }, gr);   // större yta att trycka på
      if (!sak) {
        svgEl('circle', { cx: cx, cy: cy, r: 11, fill: 'rgba(255,255,255,.12)', stroke: 'rgba(255,255,255,.55)', 'stroke-width': 1.5, 'stroke-dasharray': '3 3' }, gr);
        return;
      }
      var d = sak.split(':');
      ritaPynt(gr, d[0], d[1], cx, cy);
    }
    pynt.forEach(function (sak, i) { satt(i, sak); });
    svg.satt = satt;
    return svg;
  }

  // Pyntet lyser färg för färg i blinkordningen (formen spelar ingen roll), en kort paus, och så börjar det om.
  // Det som inte lyser behåller sin färg.
  var blink = null;
  function stoppaBlink() { if (blink) clearTimeout(blink.t); blink = null; }
  function startaBlink(svg, ordning) {
    stoppaBlink();
    var b = blink = { t: null }, i = 0;
    svg.classList.add('blinkar');
    function tand(farg) {
      svg.querySelectorAll('.plats').forEach(function (pl) { pl.classList.toggle('lyser', !!farg && pl.dataset.farg === farg); });
    }
    function steg() {
      if (blink !== b) return;
      if (!document.body.contains(svg)) { stoppaBlink(); return; }
      if (i >= ordning.length) { i = 0; b.t = setTimeout(steg, 1000); return; }
      tand(ordning[i++]);
      b.t = setTimeout(function () { tand(null); b.t = setTimeout(steg, 300); }, 900);
    }
    steg();
  }

  // Det som syns inne i skåpet. Akt 3 är en platshållare tills den byggs.
  function ritaInne(inne) {
    inne.textContent = '';
    var scen = el('div', 'scen');
    inne.appendChild(scen);

    if (s.steg === 'akt2') { ritaAkt2(inne, scen); return; }

    if (s.steg === 'akt3') {
      var hylla = el('div', 'hylla');
      for (var i = 0; i < 4; i++) hylla.appendChild(el('div', 'plats'));
      scen.appendChild(hylla);
      var visaPaket = function () {
        if (test) scen.appendChild(el('p', 'platshallare', 'Här kommer paketgåtan.'));
        var lagg = el('button', 'knapp gul', 'Lägg under granen');
        lagg.type = 'button';
        lagg.style.width = 'auto';
        lagg.hidden = !test;   // utan paketgåtan finns inget att lägga ännu
        lagg.addEventListener('click', function () {
          prata(inne, [
            ['tomten', 'Ho ho… Pyssel? Trassel? Har de knäckt ert hemliga språk? Och ställt mina paket rätt? Ni måste ha gjort det lättare för dem!'],
            ['pyssel', 'Nä?'],
            ['trassel', 'Nä.'],
            ['tomten', 'Hm. Det har inte ens jag klarat. Då förtjänar ni det som ligger i paketen.']
          ], function () { s.steg = 'oppet'; spara(); ritaInne(inne); });
        });
        scen.appendChild(lagg);
      };
      if (s.sett.akt3) { visaPaket(); return; }
      prata(inne, [
        ['pyssel', 'Öhm… Trassel? Berätta du.'],
        ['trassel', 'Okej, så… vi kanske råkade blanda ihop morfars paket.'],
        ['pyssel', 'Och riva hans lista.'],
        ['trassel', 'I fyra bitar. Ni har en bit var nu.'],
        ['pyssel', 'Han får inte veta. Ställ paketen rätt innan han kommer tillbaka, snälla!']
      ], function () { s.sett.akt3 = true; spara(); visaPaket(); });
      return;
    }

    if (s.steg === 'oppet') {
      inne.textContent = '';
      inne.parentNode.classList.add('hog');
      ritaPris(inne);
    }
  }

  // ===== Prisutdelningen =====
  // Placering: flest vunna dagar, sedan flest guld, silver, brons. Bara dag 1–23 räknas.
  // Telefonen ser bara de dagar den själv har spelat (så fungerar resultatarket).
  var MEDALJ_VARDE = { guld: 3, silver: 2, brons: 1 };
  var PLATS_ORD = ['första', 'andra', 'tredje', 'fjärde'];
  function storBokstav(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function namnLista(lista) {
    return lista.length === 1 ? lista[0] : lista.slice(0, -1).join(', ') + ' och ' + lista[lista.length - 1];
  }
  function ordTal(n) { return ['noll', 'ett', 'två', 'tre', 'fyra'][n] || String(n); }

  function arsStatistik(svar) {
    var spelare = svar.spelare.slice().sort(function (a, b) { return a.localeCompare(b, 'sv'); });
    var st = {};
    spelare.forEach(function (n) { st[n] = { namn: n, vann: 0, guld: 0, silver: 0, brons: 0, spelade: 0, bast: null }; });
    var dagarMedData = 0;
    for (var d = 1; d <= 23; d++) {
      var dd = svar.dagar[d];
      if (!dd || !dd.harSpelat) continue;
      dagarMedData++;
      Advent.Resultat.ordna(d, dd, spelare).forEach(function (r) {
        var p = st[r.spelare];
        if (!p || r.status === 'ej') return;
        p.spelade++;
        if (r.status !== 'klar') return;
        if (r.medalj && p[r.medalj] != null) p[r.medalj]++;
        if (r.plats === 1) p.vann++;
        var kand = { dag: d, plats: r.plats, medalj: MEDALJ_VARDE[r.medalj] || 0, text: r.text };
        var b = p.bast;
        if (!b || kand.plats < b.plats || (kand.plats === b.plats && kand.medalj > b.medalj)) p.bast = kand;
      });
    }
    var lista = spelare.map(function (n) { return st[n]; });
    function jamfor(a, b) { return (b.vann - a.vann) || (b.guld - a.guld) || (b.silver - a.silver) || (b.brons - a.brons); }
    var ordnad = lista.slice().sort(jamfor);
    ordnad.forEach(function (p, i) { p.plats = (i > 0 && jamfor(ordnad[i - 1], p) === 0) ? ordnad[i - 1].plats : i + 1; });
    // Grupper efter placering, bäst först.
    var grupper = [];
    ordnad.forEach(function (p) {
      var g = grupper[grupper.length - 1];
      if (g && g[0].plats === p.plats) g.push(p); else grupper.push([p]);
    });
    lista.forEach(function (p) { p.alla = dagarMedData > 0 && p.spelade === 23; });
    return { lista: lista, grupper: grupper };
  }

  // Tomtens hederspris till den som kom sist: den första som passar.
  function hederstitel(p, lista) {
    var maxB = Math.max.apply(null, lista.map(function (x) { return x.brons; }));
    var maxS = Math.max.apply(null, lista.map(function (x) { return x.silver; }));
    if (p.brons > 0 && p.brons === maxB) return { titel: 'Årets bronsmästare', text: 'Tre gånger så glänsande som guld, nästan.' };
    if (p.silver > 0 && p.silver === maxS) return { titel: 'Årets ständiga tvåa', text: 'Alltid där, alltid nära, alltid farlig.' };
    if (p.alla) return { titel: 'Årets trognaste', text: 'Inte en enda lucka missad.' };
    if (p.bast) {
      var spel = window.LUCKOR[p.bast.dag].titel;
      return { titel: 'Mästare av ' + spel, text: p.bast.plats === 1
        ? 'Den ' + p.bast.dag + ' december var ingen bättre.'
        : 'Den ' + p.bast.dag + ' december var du nästan oslagbar.' };
    }
    return { titel: 'Årets julstjärna', text: 'Utan dig hade det inte blivit jul.' };
  }

  function ritaKortet(ruta, p, delad, titel) {
    ruta.className = 'paket oppen' + (p.plats === 1 ? ' mastare' : '');
    ruta.textContent = '';
    ruta.appendChild(el('span', 'namn', p.namn));
    ruta.appendChild(el('span', 'plats-text', (delad ? 'Delad ' + PLATS_ORD[p.plats - 1] + 'plats' : storBokstav(PLATS_ORD[p.plats - 1]) + ' plats')));
    ruta.appendChild(el('span', null, '🥇 ' + p.guld + ' · 🥈 ' + p.silver + ' · 🥉 ' + p.brons));
    ruta.appendChild(el('span', null, 'vann ' + p.vann + (p.vann === 1 ? ' dag' : ' dagar')));
    if (p.bast) {
      ruta.appendChild(el('span', null, 'Bästa dag: ' + window.LUCKOR[p.bast.dag].titel));
      ruta.appendChild(el('span', null, p.bast.dag + ' december, ' + p.bast.text));
    }
    if (titel) ruta.appendChild(el('span', 'titel', titel.titel));
    if (p.plats === 1) {
      var stj = el('span', 'stjarna', '⭐');
      stj.setAttribute('aria-hidden', 'true');
      ruta.appendChild(stj);
    }
  }

  function sno(inne) {
    var snoet = el('div', 'snoet');
    snoet.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 22; i++) {
      var f = el('span', null, '❄');
      f.style.left = (Math.random() * 100) + '%';
      f.style.fontSize = (10 + Math.random() * 12) + 'px';
      f.style.animationDuration = (3 + Math.random() * 4) + 's';
      f.style.animationDelay = (-Math.random() * 6) + 's';
      snoet.appendChild(f);
    }
    inne.appendChild(snoet);
  }

  function ritaPris(inne) {
    var pris = el('div', 'pris');
    inne.appendChild(pris);
    var info = el('p', 'info', 'Tomten letar fram sitt kalkylark…');
    pris.appendChild(info);
    var hamta = test ? Promise.resolve(exempelData(s.exempel || 'vanlig')) : Advent.Resultat.alla();
    hamta.then(function (svar) {
      info.remove();
      utdelning(inne, pris, arsStatistik(svar));
    }, function (fel) {
      info.textContent = fel.message;
      var igen = el('button', 'knapp', 'Försök igen');
      igen.type = 'button';
      igen.style.width = 'auto';
      igen.addEventListener('click', function () { inne.textContent = ''; ritaPris(inne); });
      pris.appendChild(igen);
    });
  }

  function utdelning(inne, pris, data) {
    var rutor = {};
    var paketen = el('div', 'paketen');
    data.lista.forEach(function (p) {
      var r = el('div', 'paket');
      var ask = el('span', 'ask', '🎁');
      ask.setAttribute('aria-hidden', 'true');
      r.appendChild(ask);
      r.appendChild(el('span', 'lapp', 'Till ' + p.namn));
      rutor[p.namn] = r;
      paketen.appendChild(r);
    });
    pris.appendChild(paketen);

    var grupper = data.grupper;
    var mastare = grupper[0];
    var jumbo = grupper.length > 1 ? grupper[grupper.length - 1] : [];
    var mitten = grupper.slice(1, grupper.length > 1 ? -1 : 1).reverse();   // tredje, sedan andra
    var titlar = {};
    jumbo.forEach(function (p) { titlar[p.namn] = hederstitel(p, data.lista); });

    function oppna(grupp) { grupp.forEach(function (p) { ritaKortet(rutor[p.namn], p, grupp.length > 1, titlar[p.namn]); }); }
    function namnen(grupp) { return namnLista(grupp.map(function (p) { return p.namn; })); }

    function slut() {
      if (!pris.querySelector('.slut')) {
        var slutRuta = el('div', 'slut');
        var lank = el('a', 'knapp', 'Hela årets kalender');
        lank.href = '../../resultat/';
        slutRuta.appendChild(lank);
        pris.appendChild(slutRuta);
      }
      if (!s.prisKlar) { s.prisKlar = true; spara(); }
    }

    // Redan sett: alla paket öppna direkt.
    if (s.prisKlar) {
      grupper.forEach(oppna);
      if (!inne.querySelector('.snoet')) sno(inne);
      slut();
      return;
    }

    var steg = [];
    steg.push(function (nasta) {
      prata(inne, [
        ['tomten', 'Varje dag i december har jag hållit koll. Varje kula, varje skorsten, varje sprängd mina.'],
        ['pyssel', 'Han har ett kalkylark. Det är lite läskigt.'],
        ['tomten', 'Nu öppnar vi paketen.']
      ], nasta);
    });
    mitten.forEach(function (g) {
      steg.push(function (nasta) {
        oppna(g);
        var plats = g[0].plats, rad;
        if (g.length > 1) rad = 'Delad ' + PLATS_ORD[plats - 1] + 'plats! ' + namnen(g) + ', ni får dela på äran.';
        else if (plats === 3) rad = 'På tredje plats… ' + g[0].namn + '! Stadig som en granfot hela december.';
        else rad = 'Och på andra plats… ' + g[0].namn + '! Så nära toppen att stjärnan nästan ramlade ner.';
        prata(inne, [['tomten', rad]], nasta);
      });
    });
    if (jumbo.length) {
      steg.push(function (nasta) {
        var kvar = mastare.concat(jumbo);
        kvar.forEach(function (p) { rutor[p.namn].classList.add('gungar'); });
        var repliker = kvar.length === 2
          ? [['pyssel', 'Två paket kvar.'], ['trassel', 'Ett innehåller årets mästare.'], ['pyssel', 'Och det andra…'], ['trassel', '…inte.']]
          : [['pyssel', storBokstav(ordTal(kvar.length)) + ' paket kvar.'],
             ['trassel', mastare.length > 1 ? 'Några innehåller årets mästare.' : 'Ett innehåller årets mästare.'],
             ['pyssel', 'Och resten…'], ['trassel', '…inte.']];
        prata(inne, repliker, function () {
          kvar.forEach(function (p) { rutor[p.namn].classList.remove('gungar'); });
          nasta();
        });
      });
    }
    steg.push(function (nasta) {
      oppna(mastare);
      sno(inne);
      var rad = mastare.length > 1
        ? 'Delad förstaplats! ' + namnen(mastare) + ', ni får dela på äran. Hela Nordpolen bugar.'
        : 'Årets mästare är… ' + mastare[0].namn + '! Hela Nordpolen bugar. Den här stjärnan är din.';
      prata(inne, [['tomten', rad], ['trassel', 'Okej, det där var faktiskt imponerande.']], nasta);
    });
    if (jumbo.length) {
      steg.push(function (nasta) {
        var repliker = [['pyssel', jumbo.length > 1 ? 'Och så de sista paketen.' : 'Och så det sista paketet.']];
        prata(inne, repliker, function () {
          oppna(jumbo);
          var tomten = [];
          jumbo.forEach(function (p) {
            var t = titlar[p.namn];
            tomten.push(['tomten', p.namn + ', ingen lämnar mitt skåp tomhänt. Tomten delar ut ett hederspris:']);
            tomten.push(['tomten', t.titel + '. ' + t.text]);
          });
          prata(inne, tomten, nasta);
        });
      });
    }
    steg.push(function () { slut(); });

    var i = 0;
    (function kor() { var f = steg[i++]; if (f) f(kor); })();
  }

  // ===== Exempeldata i testläget =====
  // Varje dag är en ordning av B(ehnosh), D(aniel), J(osefin), O (Joel). "D=J" betyder lika resultat.
  // Etta får guld, tvåa silver, trea brons.
  var EXEMPEL = {
    vanlig: ['BDJO', 'DBOJ', 'JBDO', 'BJDO', 'OBJD', 'DJBO', 'BODJ', 'JDBO', 'BDOJ', 'DOBJ', 'JBOD', 'BJOD',
             'ODBJ', 'DBJO', 'BJDO', 'JODB', 'DBJO', 'BDJO', 'OJBD', 'DJOB', 'BOJD', 'JBDO', 'BDOJ'],
    delad2: ['BDJO', 'BJDO', 'DBJO', 'JBDO', 'OBDJ', 'OBJD', 'BDOJ', 'BJOD', 'DOBJ', 'JOBD', 'BDJO', 'BJDO',
             'DBOJ', 'JBOD', 'BODJ', 'BOJD', 'ODJB', 'OJDB', 'DJBO', 'JDBO', 'BDJO', 'BJDO', 'B,D=J,O'],
    delad1: ['BDJO', 'DBJO', 'BJDO', 'DJBO', 'JBDO', 'JDBO', 'BODJ', 'DOBJ', 'OBJD', 'ODJB', 'BJOD', 'DJOB',
             'BDOJ', 'DBOJ', 'JOBD', 'JODB', 'BOJD', 'DOJB', 'OJBD', 'OJDB', 'BJDO', 'DJBO', 'B=D,J,O']
  };
  var EXEMPEL_NAMN = { vanlig: 'Vanlig', delad2: 'Delad andraplats', delad1: 'Delad förstaplats' };
  function exempelData(vilken) {
    var namn = { B: 'Behnosh', D: 'Daniel', J: 'Josefin', O: 'Joel' };
    var medaljer = ['guld', 'silver', 'brons', ''];
    var dagar = {};
    EXEMPEL[vilken].forEach(function (ordning, i) {
      var d = i + 1, lagre = !(window.LUCKOR[d] && window.LUCKOR[d].lagreArBattre === false);
      var grupper = ordning.indexOf(',') === -1 ? ordning.split('') : ordning.split(',');
      var rader = [], plats = 0;
      grupper.forEach(function (g) {
        g.split('=').forEach(function (k) {
          var varde = lagre ? 30 + plats * 12 : 120 - plats * 12;
          rader.push({ spelare: namn[k], status: 'klar', varde: varde, medalj: medaljer[plats], text: String(varde) });
        });
        plats += g.split('=').length;
      });
      dagar[d] = { harSpelat: true, antal: 4, rader: rader };
    });
    return { namn: 'Behnosh', spelare: ['Behnosh', 'Daniel', 'Josefin', 'Joel'], dagar: dagar };
  }

  // ===== Testläget =====
  function ritaTest() {
    $('testmarke').hidden = !test;
    $('testruta').hidden = !test;
    $('vaxla').textContent = test ? 'Lämna testläget' : 'Testläge';
    if (!test) return;
    $('testKod').textContent = SVAR.test.kod.split('').join(' ');
    $('testOrd').textContent = SVAR.test.ord;
    $('testFarg').textContent = SVAR.test.gran.blink.map(function (f) { return PYNT_FARG[f].namn.toLowerCase(); }).join(', ');
    var hopp = $('hopp');
    hopp.textContent = '';
    STEG.forEach(function (namn) {
      var b = el('button', s.steg === namn ? 'nu' : null, STEG_NAMN[namn]);
      b.type = 'button';
      b.addEventListener('click', function () {
        var sett = {};
        if (STEG.indexOf(namn) > 2) sett.akt2 = true;
        s = nyttTillstand();
        s.steg = namn;
        s.sett = sett;
        spara();
        rita();
      });
      hopp.appendChild(b);
    });
    var ex = $('exempel');
    ex.textContent = '';
    ex.hidden = s.steg !== 'oppet' && s.steg !== 'las' && s.steg !== 'akt2';
    if (s.steg === 'akt2') {
      ex.appendChild(el('span', null, 'Min roll:'));
      ['Ser granen', 'Pyntar', 'Brevet', 'Nyckelboken'].forEach(function (t, n) {
        var roll = n;
        var b = el('button', (s.testRoll || 0) === roll ? 'nu' : null, t);
        b.type = 'button';
        b.addEventListener('click', function () { s.testRoll = roll; spara(); rita(); });
        ex.appendChild(b);
      });
      var granRad = el('div', 'hopp');
      granRad.style.marginTop = '8px';
      granRad.appendChild(el('span', null, 'Granen:'));
      var ratt = el('button', null, 'Pynta rätt');
      ratt.type = 'button';
      ratt.addEventListener('click', function () {
        s.gran = SVAR.test.gran.pynt.slice(); s.granKlar = false; s.testRoll = 1; s.vy = 'gran'; s.sett.akt2 = s.sett.lag = s.sett.gran = true; spara(); rita();
      });
      var rensa = el('button', null, 'Rensa granen');
      rensa.type = 'button';
      rensa.addEventListener('click', function () { s.gran = null; s.granKlar = false; spara(); rita(); });
      granRad.appendChild(ratt);
      granRad.appendChild(rensa);
      ex.appendChild(granRad);
      var trRad = el('div', 'hopp');
      trRad.style.marginTop = '8px';
      trRad.appendChild(el('span', null, 'Trassels dörr:'));
      var oppna = el('button', null, 'Öppna färglåset');
      oppna.type = 'button';
      oppna.addEventListener('click', function () { s.fargKlar = true; s.vy = null; s.sett.akt2 = s.sett.lag = true; spara(); rita(); });
      var stang = el('button', null, 'Stäng och töm brevet');
      stang.type = 'button';
      stang.addEventListener('click', function () { s.fargKlar = false; s.brevSvar = {}; s.brevSida = 0; s.nyckelSida = 0; s.vy = null; s.sett.brev = false; spara(); rita(); });
      trRad.appendChild(oppna);
      trRad.appendChild(stang);
      ex.appendChild(trRad);
      return;
    }
    if (s.steg === 'las') {
      ex.appendChild(el('span', null, 'Min tur som nummer:'));
      [0, 1, 2, 3].forEach(function (n) {
        var b = el('button', (s.testPlats || 0) === n ? 'nu' : null, String(n + 1));
        b.type = 'button';
        b.addEventListener('click', function () { s.testPlats = n; s.testAntal = 0; s.provKlar = false; s.prov = null; spara(); rita(); });
        ex.appendChild(b);
      });
      var spelRad = el('div', 'hopp');
      spelRad.style.marginTop = '8px';
      spelRad.appendChild(el('span', null, 'Mitt prov:'));
      [1, 17, 8, 15, 22, 23, 14, 12, 10].forEach(function (d) {
        var b = el('button', (s.testSpel || 1) === d ? 'nu' : null, PROV_SPEL[d].namn + (TEST_PROV[d].vann ? ' (vann)' : ' (bästa)'));
        b.type = 'button';
        b.addEventListener('click', function () { s.testSpel = d; s.prov = null; s.provKlar = false; s.testAntal = 0; spara(); rita(); });
        spelRad.appendChild(b);
      });
      var nasta = el('button', null, 'Nästa blir klar (' + (s.testAntal || 0) + ' av 4)');
      nasta.type = 'button';
      nasta.disabled = (s.testAntal || 0) >= 4;
      nasta.addEventListener('click', function () {
        if ((s.testAntal || 0) === s.testPlats && !s.provKlar) return;   // det är min tur, ingen annan kan bli klar
        s.testAntal = Math.min(4, (s.testAntal || 0) + 1);
        spara();
        rita();
      });
      ex.appendChild(nasta);
      ex.appendChild(spelRad);
      return;
    }
    if (s.steg !== 'oppet') return;
    Object.keys(EXEMPEL).forEach(function (k) {
      var b = el('button', (s.exempel || 'vanlig') === k ? 'nu' : null, EXEMPEL_NAMN[k]);
      b.type = 'button';
      b.addEventListener('click', function () { s.exempel = k; s.prisKlar = false; spara(); rita(); });
      ex.appendChild(b);
    });
  }

  function rita() {
    var yta = $('scen');
    yta.textContent = '';
    pratRuta = null;
    stoppaFraga();
    stoppaBlink();
    if (s.steg === 'kuvert') ritaKuvert(yta);
    else ritaSkap(yta);
    ritaTest();
  }

  function start() {
    s = Advent.lasa(nyckel(), null) || nyttTillstand();
    if (!s.sett) s.sett = {};
    if (STEG.indexOf(s.steg) === -1) s = nyttTillstand();   // sparat från en äldre version av skåpet
    rita();
  }

  $('vaxla').addEventListener('click', function () {
    test = !test;
    Advent.spara('kassaskap-testlage', test);
    start();
  });

  start();
})();
</script>
</body>
</html>
