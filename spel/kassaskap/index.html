  // ===== Prisutdelningen =====
  // Placering: flest vunna dagar, sedan flest guld, silver, brons. Bara dag 1–23 räknas.
  // Telefonen ser bara de dagar den själv har spelat (så fungerar resultatarket).
  var MEDALJ_VARDE = { guld: 3, silver: 2, brons: 1 };
  var PLATS_ORD = ['första', 'andra', 'tredje', 'fjärde'];
  function storBokstav(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function namnLista(lista) {
    return lista.length === 1 ? lista[0] : lista.slice(0, -1).join(', ') + ' och ' + lista[lista.length - 1];
  }
  function ordTal(n) { return ['noll', 'ett', 'två', 'tre', 'fyra'][n] || String(n); }

  function arsStatistik(svar) {
    var spelare = svar.spelare.slice().sort(function (a, b) { return a.localeCompare(b, 'sv'); });
    var st = {};
    spelare.forEach(function (n) { st[n] = { namn: n, vann: 0, guld: 0, silver: 0, brons: 0, spelade: 0, bast: null }; });
    var dagarMedData = 0;
    for (var d = 1; d <= 23; d++) {
      var dd = svar.dagar[d];
      if (!dd || !dd.harSpelat) continue;
      dagarMedData++;
      Advent.Resultat.ordna(d, dd, spelare).forEach(function (r) {
        var p = st[r.spelare];
        if (!p || r.status === 'ej') return;
        p.spelade++;
        if (r.status !== 'klar') return;
        if (r.medalj && p[r.medalj] != null) p[r.medalj]++;
        if (r.plats === 1) p.vann++;
        var kand = { dag: d, plats: r.plats, medalj: MEDALJ_VARDE[r.medalj] || 0, text: r.text };
        var b = p.bast;
        if (!b || kand.plats < b.plats || (kand.plats === b.plats && kand.medalj > b.medalj)) p.bast = kand;
      });
    }
    var lista = spelare.map(function (n) { return st[n]; });
    function jamfor(a, b) { return (b.vann - a.vann) || (b.guld - a.guld) || (b.silver - a.silver) || (b.brons - a.brons); }
    var ordnad = lista.slice().sort(jamfor);
    ordnad.forEach(function (p, i) { p.plats = (i > 0 && jamfor(ordnad[i - 1], p) === 0) ? ordnad[i - 1].plats : i + 1; });
    // Grupper efter placering, bäst först.
    var grupper = [];
    ordnad.forEach(function (p) {
      var g = grupper[grupper.length - 1];
      if (g && g[0].plats === p.plats) g.push(p); else grupper.push([p]);
    });
    lista.forEach(function (p) { p.alla = dagarMedData > 0 && p.spelade === 23; });
    return { lista: lista, grupper: grupper };
  }

  // Tomtens hederspris till den som kom sist: den första som passar.
  function hederstitel(p, lista) {
    var maxB = Math.max.apply(null, lista.map(function (x) { return x.brons; }));
    var maxS = Math.max.apply(null, lista.map(function (x) { return x.silver; }));
    if (p.brons > 0 && p.brons === maxB) return { titel: 'Årets bronsmästare', text: 'Tre gånger så glänsande som guld, nästan.' };
    if (p.silver > 0 && p.silver === maxS) return { titel: 'Årets ständiga tvåa', text: 'Alltid där, alltid nära, alltid farlig.' };
    if (p.alla) return { titel: 'Årets trognaste', text: 'Inte en enda lucka missad.' };
    if (p.bast) {
      var spel = window.LUCKOR[p.bast.dag].titel;
      return { titel: 'Mästare av ' + spel, text: p.bast.plats === 1
        ? 'Den ' + p.bast.dag + ' december var ingen bättre.'
        : 'Den ' + p.bast.dag + ' december var du nästan oslagbar.' };
    }
    return { titel: 'Årets julstjärna', text: 'Utan dig hade det inte blivit jul.' };
  }

  function ritaKortet(ruta, p, delad, titel) {
    ruta.className = 'paket oppen' + (p.plats === 1 ? ' mastare' : '');
    ruta.textContent = '';
    ruta.appendChild(el('span', 'namn', p.namn));
    ruta.appendChild(el('span', 'plats-text', (delad ? 'Delad ' + PLATS_ORD[p.plats - 1] + 'plats' : storBokstav(PLATS_ORD[p.plats - 1]) + ' plats')));
    ruta.appendChild(el('span', null, '🥇 ' + p.guld + ' · 🥈 ' + p.silver + ' · 🥉 ' + p.brons));
    ruta.appendChild(el('span', null, 'vann ' + p.vann + (p.vann === 1 ? ' dag' : ' dagar')));
    if (p.bast) {
      ruta.appendChild(el('span', null, 'Bästa dag: ' + window.LUCKOR[p.bast.dag].titel));
      ruta.appendChild(el('span', null, p.bast.dag + ' december, ' + p.bast.text));
    }
    if (titel) ruta.appendChild(el('span', 'titel', titel.titel));
    if (p.plats === 1) {
      var stj = el('span', 'stjarna', '⭐');
      stj.setAttribute('aria-hidden', 'true');
      ruta.appendChild(stj);
    }
  }

  function sno(inne) {
    var snoet = el('div', 'snoet');
    snoet.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 22; i++) {
      var f = el('span', null, '❄');
      f.style.left = (Math.random() * 100) + '%';
      f.style.fontSize = (10 + Math.random() * 12) + 'px';
      f.style.animationDuration = (3 + Math.random() * 4) + 's';
      f.style.animationDelay = (-Math.random() * 6) + 's';
      snoet.appendChild(f);
    }
    inne.appendChild(snoet);
  }

  function ritaPris(inne) {
    var pris = el('div', 'pris');
    inne.appendChild(pris);
    var info = el('p', 'info', 'Tomten letar fram sitt kalkylark…');
    pris.appendChild(info);
    var hamta = test ? Promise.resolve(exempelData(s.exempel || 'vanlig')) : Advent.Resultat.alla();
    hamta.then(function (svar) {
      info.remove();
      utdelning(inne, pris, arsStatistik(svar));
    }, function (fel) {
      info.textContent = fel.message;
      var igen = el('button', 'knapp', 'Försök igen');
      igen.type = 'button';
      igen.style.width = 'auto';
      igen.addEventListener('click', function () { inne.textContent = ''; ritaPris(inne); });
      pris.appendChild(igen);
    });
  }

  function utdelning(inne, pris, data) {
    var rutor = {};
    var paketen = el('div', 'paketen');
    data.lista.forEach(function (p) {
      var r = el('div', 'paket');
      var ask = el('span', 'ask', '🎁');
      ask.setAttribute('aria-hidden', 'true');
      r.appendChild(ask);
      r.appendChild(el('span', 'lapp', 'Till ' + p.namn));
      rutor[p.namn] = r;
      paketen.appendChild(r);
    });
    pris.appendChild(paketen);

    var grupper = data.grupper;
    var mastare = grupper[0];
    var jumbo = grupper.length > 1 ? grupper[grupper.length - 1] : [];
    var mitten = grupper.slice(1, grupper.length > 1 ? -1 : 1).reverse();   // tredje, sedan andra
    var titlar = {};
    jumbo.forEach(function (p) { titlar[p.namn] = hederstitel(p, data.lista); });

    function oppna(grupp) { grupp.forEach(function (p) { ritaKortet(rutor[p.namn], p, grupp.length > 1, titlar[p.namn]); }); }
    function namnen(grupp) { return namnLista(grupp.map(function (p) { return p.namn; })); }

    function slut() {
      if (!pris.querySelector('.slut')) {
        var slutRuta = el('div', 'slut');
        var lank = el('a', 'knapp', 'Hela årets kalender');
        lank.href = '../../resultat/';
        slutRuta.appendChild(lank);
        pris.appendChild(slutRuta);
      }
      if (!s.prisKlar) { s.prisKlar = true; spara(); }
    }

    // Redan sett: alla paket öppna direkt.
    if (s.prisKlar) {
      grupper.forEach(oppna);
      if (!inne.querySelector('.snoet')) sno(inne);
      slut();
      return;
    }

    var steg = [];
    steg.push(function (nasta) {
      prata(inne, [
        ['tomten', 'Varje dag i december har jag hållit koll. Varje kula, varje skorsten, varje sprängd mina.'],
        ['pyssel', 'Han har ett kalkylark. Det är lite läskigt.'],
        ['tomten', 'Nu öppnar vi paketen.']
      ], nasta);
    });
    mitten.forEach(function (g) {
      steg.push(function (nasta) {
        oppna(g);
        var plats = g[0].plats, rad;
        if (g.length > 1) rad = 'Delad ' + PLATS_ORD[plats - 1] + 'plats! ' + namnen(g) + ', ni får dela på äran.';
        else if (plats === 3) rad = 'På tredje plats… ' + g[0].namn + '! Stadig som en granfot hela december.';
        else rad = 'Och på andra plats… ' + g[0].namn + '! Så nära toppen att stjärnan nästan ramlade ner.';
        prata(inne, [['tomten', rad]], nasta);
      });
    });
    if (jumbo.length) {
      steg.push(function (nasta) {
        var kvar = mastare.concat(jumbo);
        kvar.forEach(function (p) { rutor[p.namn].classList.add('gungar'); });
        var repliker = kvar.length === 2
          ? [['pyssel', 'Två paket kvar.'], ['trassel', 'Ett innehåller årets mästare.'], ['pyssel', 'Och det andra…'], ['trassel', '…inte.']]
          : [['pyssel', storBokstav(ordTal(kvar.length)) + ' paket kvar.'],
             ['trassel', mastare.length > 1 ? 'Några innehåller årets mästare.' : 'Ett innehåller årets mästare.'],
             ['pyssel', 'Och resten…'], ['trassel', '…inte.']];
        prata(inne, repliker, function () {
          kvar.forEach(function (p) { rutor[p.namn].classList.remove('gungar'); });
          nasta();
        });
      });
    }
    steg.push(function (nasta) {
      oppna(mastare);
      sno(inne);
      var rad = mastare.length > 1
        ? 'Delad förstaplats! ' + namnen(mastare) + ', ni får dela på äran. Hela Nordpolen bugar.'
        : 'Årets mästare är… ' + mastare[0].namn + '! Hela Nordpolen bugar. Den här stjärnan är din.';
      prata(inne, [['tomten', rad], ['trassel', 'Okej, det där var faktiskt imponerande.']], nasta);
    });
    if (jumbo.length) {
      steg.push(function (nasta) {
        var repliker = [['pyssel', jumbo.length > 1 ? 'Och så de sista paketen.' : 'Och så det sista paketet.']];
        prata(inne, repliker, function () {
          oppna(jumbo);
          var tomten = [];
          jumbo.forEach(function (p) {
            var t = titlar[p.namn];
            tomten.push(['tomten', p.namn + ', ingen lämnar mitt skåp tomhänt. Tomten delar ut ett hederspris:']);
            tomten.push(['tomten', t.titel + '. ' + t.text]);
          });
          prata(inne, tomten, nasta);
        });
      });
    }
    steg.push(function () { slut(); });

    var i = 0;
    (function kor() { var f = steg[i++]; if (f) f(kor); })();
  }

  // ===== Exempeldata i testläget =====
  // Varje dag är en ordning av B(ehnosh), D(aniel), J(osefin), O (Joel). "D=J" betyder lika resultat.
  // Etta får guld, tvåa silver, trea brons.
  var EXEMPEL = {
    vanlig: ['BDJO', 'DBOJ', 'JBDO', 'BJDO', 'OBJD', 'DJBO', 'BODJ', 'JDBO', 'BDOJ', 'DOBJ', 'JBOD', 'BJOD',
             'ODBJ', 'DBJO', 'BJDO', 'JODB', 'DBJO', 'BDJO', 'OJBD', 'DJOB', 'BOJD', 'JBDO', 'BDOJ'],
    delad2: ['BDJO', 'BJDO', 'DBJO', 'JBDO', 'OBDJ', 'OBJD', 'BDOJ', 'BJOD', 'DOBJ', 'JOBD', 'BDJO', 'BJDO',
             'DBOJ', 'JBOD', 'BODJ', 'BOJD', 'ODJB', 'OJDB', 'DJBO', 'JDBO', 'BDJO', 'BJDO', 'B,D=J,O'],
    delad1: ['BDJO', 'DBJO', 'BJDO', 'DJBO', 'JBDO', 'JDBO', 'BODJ', 'DOBJ', 'OBJD', 'ODJB', 'BJOD', 'DJOB',
             'BDOJ', 'DBOJ', 'JOBD', 'JODB', 'BOJD', 'DOJB', 'OJBD', 'OJDB', 'BJDO', 'DJBO', 'B=D,J,O']
  };
  var EXEMPEL_NAMN = { vanlig: 'Vanlig', delad2: 'Delad andraplats', delad1: 'Delad förstaplats' };
  function exempelData(vilken) {
    var namn = { B: 'Behnosh', D: 'Daniel', J: 'Josefin', O: 'Joel' };
    var medaljer = ['guld', 'silver', 'brons', ''];
    var dagar = {};
    EXEMPEL[vilken].forEach(function (ordning, i) {
      var d = i + 1, lagre = !(window.LUCKOR[d] && window.LUCKOR[d].lagreArBattre === false);
      var grupper = ordning.indexOf(',') === -1 ? ordning.split('') : ordning.split(',');
      var rader = [], plats = 0;
      grupper.forEach(function (g) {
        g.split('=').forEach(function (k) {
          var varde = lagre ? 30 + plats * 12 : 120 - plats * 12;
          rader.push({ spelare: namn[k], status: 'klar', varde: varde, medalj: medaljer[plats], text: String(varde) });
        });
        plats += g.split('=').length;
      });
      dagar[d] = { harSpelat: true, antal: 4, rader: rader };
    });
    return { namn: 'Behnosh', spelare: ['Behnosh', 'Daniel', 'Josefin', 'Joel'], dagar: dagar };
  }

  // ===== Testläget =====
  // Knuff nu: barnbarnet tittar fram direkt i steget man står i, i stället för att man väntar.
  function knuffRad() {
    var rad = el('div', 'hopp');
    rad.style.marginTop = '8px';
    rad.appendChild(el('span', null, 'Knuffar:'));
    var nu = el('button', null, 'Knuff nu');
    nu.type = 'button';
    nu.addEventListener('click', function () { var st = aktivKnuff && s.knuff && s.knuff[aktivKnuff.id]; if (st) { st.sedan = 0; spara(); } });
    var noll = el('button', null, 'Nollställ knuffarna');
    noll.type = 'button';
    noll.addEventListener('click', function () { s.knuff = {}; s.paketPekat = null; spara(); rita(); });
    rad.appendChild(nu);
    rad.appendChild(noll);
    return rad;
  }
  function ritaTest() {
    $('testmarke').hidden = !test;
    $('testruta').hidden = !test;
    $('vaxla').textContent = test ? 'Lämna testläget' : 'Testläge';
    if (!test) return;
    $('testKod').textContent = SVAR.test.kod.split('').join(' ');
    $('testOrd').textContent = SVAR.test.ord;
    $('testFarg').textContent = SVAR.test.gran.blink.map(function (f) { return PYNT_FARG[f].namn.toLowerCase(); }).join(', ');
    var hopp = $('hopp');
    hopp.textContent = '';
    STEG.forEach(function (namn) {
      var b = el('button', s.steg === namn ? 'nu' : null, STEG_NAMN[namn]);
      b.type = 'button';
      b.addEventListener('click', function () {
        var sett = {};
        if (STEG.indexOf(namn) > 2) sett.akt2 = true;
        s = nyttTillstand();
        s.steg = namn;
        s.sett = sett;
        spara();
        rita();
      });
      hopp.appendChild(b);
    });
    var ex = $('exempel');
    ex.textContent = '';
    ex.hidden = s.steg !== 'oppet' && s.steg !== 'las' && s.steg !== 'akt2' && s.steg !== 'akt3';
    if (s.steg === 'akt3') {
      ex.appendChild(el('span', null, 'Min listbit:'));
      [0, 1, 2, 3].forEach(function (n) {
        var b = el('button', (s.testRoll || 0) === n ? 'nu' : null, String(n + 1));
        b.type = 'button';
        b.addEventListener('click', function () { s.testRoll = n; spara(); rita(); });
        ex.appendChild(b);
      });
      var pRad = el('div', 'hopp');
      pRad.style.marginTop = '8px';
      pRad.appendChild(el('span', null, 'Paketen:'));
      var stall = el('button', null, 'Ställ rätt');
      stall.type = 'button';
      stall.addEventListener('click', function () {
        s.paket = SVAR.test.paket.svar.split(' ').map(function (x) { var d = x.split(':'); return { n: d[0], f: d[1] }; });
        s.paketLastTill = 0; s.sett.akt3 = true; spara(); rita();
      });
      var tom = el('button', null, 'Töm hyllan');
      tom.type = 'button';
      tom.addEventListener('click', function () { s.paket = null; s.paketPekat = null; s.paketLastTill = 0; spara(); rita(); });
      pRad.appendChild(stall);
      pRad.appendChild(tom);
      ex.appendChild(pRad);
      ex.appendChild(knuffRad());
      return;
    }
    if (s.steg === 'akt2') {
      ex.appendChild(el('span', null, 'Min roll:'));
      ['Ser granen', 'Pyntar', 'Brevet', 'Nyckelboken'].forEach(function (t, n) {
        var roll = n;
        var b = el('button', (s.testRoll || 0) === roll ? 'nu' : null, t);
        b.type = 'button';
        b.addEventListener('click', function () { s.testRoll = roll; spara(); rita(); });
        ex.appendChild(b);
      });
      var granRad = el('div', 'hopp');
      granRad.style.marginTop = '8px';
      granRad.appendChild(el('span', null, 'Granen:'));
      var ratt = el('button', null, 'Pynta rätt');
      ratt.type = 'button';
      ratt.addEventListener('click', function () {
        s.gran = SVAR.test.gran.pynt.slice(); s.granKlar = false; s.testRoll = 1; s.vy = 'gran'; s.sett.akt2 = s.sett.lag = s.sett.gran = true; spara(); rita();
      });
      var rensa = el('button', null, 'Rensa granen');
      rensa.type = 'button';
      rensa.addEventListener('click', function () { s.gran = null; s.granKlar = false; s.granHjalp = null; s.granHjalpSteg = 0; spara(); rita(); });
      granRad.appendChild(ratt);
      granRad.appendChild(rensa);
      ex.appendChild(granRad);
      var trRad = el('div', 'hopp');
      trRad.style.marginTop = '8px';
      trRad.appendChild(el('span', null, 'Trassels dörr:'));
      var oppna = el('button', null, 'Öppna färglåset');
      oppna.type = 'button';
      oppna.addEventListener('click', function () { s.fargKlar = true; s.vy = null; s.sett.akt2 = s.sett.lag = true; spara(); rita(); });
      var stang = el('button', null, 'Stäng och töm brevet');
      stang.type = 'button';
      stang.addEventListener('click', function () { s.fargKlar = false; s.trasselOppen = false; s.brevSvar = {}; s.brevSida = 0; s.nyckelSida = 0; s.vy = null; s.sett.brev = false; spara(); rita(); });
      trRad.appendChild(oppna);
      trRad.appendChild(stang);
      ex.appendChild(trRad);
      ex.appendChild(knuffRad());
      return;
    }
    if (s.steg === 'las') {
      ex.appendChild(el('span', null, 'Min tur som nummer:'));
      [0, 1, 2, 3].forEach(function (n) {
        var b = el('button', (s.testPlats || 0) === n ? 'nu' : null, String(n + 1));
        b.type = 'button';
        b.addEventListener('click', function () { s.testPlats = n; s.testAntal = 0; s.provKlar = false; s.prov = null; spara(); rita(); });
        ex.appendChild(b);
      });
      var spelRad = el('div', 'hopp');
      spelRad.style.marginTop = '8px';
      spelRad.appendChild(el('span', null, 'Mitt prov:'));
      [1, 17, 8, 15, 22, 23, 14, 12, 10].forEach(function (d) {
        var b = el('button', (s.testSpel || 1) === d ? 'nu' : null, PROV_SPEL[d].namn + (TEST_PROV[d].vann ? ' (vann)' : ' (bästa)'));
        b.type = 'button';
        b.addEventListener('click', function () { s.testSpel = d; s.prov = null; s.provKlar = false; s.testAntal = 0; spara(); rita(); });
        spelRad.appendChild(b);
      });
      var nasta = el('button', null, 'Nästa blir klar (' + (s.testAntal || 0) + ' av 4)');
      nasta.type = 'button';
      nasta.disabled = (s.testAntal || 0) >= 4;
      nasta.addEventListener('click', function () {
        if ((s.testAntal || 0) === s.testPlats && !s.provKlar) return;   // det är min tur, ingen annan kan bli klar
        s.testAntal = Math.min(4, (s.testAntal || 0) + 1);
        spara();
        rita();
      });
      ex.appendChild(nasta);
      ex.appendChild(spelRad);
      return;
    }
    if (s.steg !== 'oppet') return;
    Object.keys(EXEMPEL).forEach(function (k) {
      var b = el('button', (s.exempel || 'vanlig') === k ? 'nu' : null, EXEMPEL_NAMN[k]);
      b.type = 'button';
      b.addEventListener('click', function () { s.exempel = k; s.prisKlar = false; spara(); rita(); });
      ex.appendChild(b);
    });
  }

  function rita() {
    var yta = $('scen');
    yta.textContent = '';
    pratRuta = null;
    stoppaFraga();
    stoppaBlink();
    stoppaKnuff();
    if (s.steg === 'kuvert') ritaKuvert(yta);
    else ritaSkap(yta);
    ritaTest();
  }

  function start() {
    s = Advent.lasa(nyckel(), null) || nyttTillstand();
    if (!s.sett) s.sett = {};
    if (STEG.indexOf(s.steg) === -1) s = nyttTillstand();   // sparat från en äldre version av skåpet
    rita();
  }

  $('vaxla').addEventListener('click', function () {
    test = !test;
    Advent.spara('kassaskap-testlage', test);
    start();
  });

  start();
})();
</script>
</body>
