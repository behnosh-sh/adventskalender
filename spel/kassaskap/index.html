<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomtens kassaskåp</title>
<meta name="theme-color" content="#14233F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="../../css/gemensam.css?v=7">
<style>
  h1 { margin: 4px 0 14px; font-size: 30px; line-height: 1.1; }
  .ovning { display: inline-block; margin-left: 6px; padding: 2px 10px; border-radius: 999px; background: var(--glod); color: var(--text); font-size: 14px; vertical-align: middle; }

  @keyframes skaka {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  .skakar { animation: skaka .45s ease-in-out; }
  @keyframes gunga { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }

  /* ===== Kuvertet ===== */
  .kuvert-yta { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0 20px; }
  .kuvert {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 3 / 2;
    border: 0;
    padding: 0;
    border-radius: 10px;
    background: linear-gradient(#F3E7CF, #E2D1B0);
    box-shadow: 0 8px 0 rgba(0,0,0,.3);
    cursor: pointer;
    animation: gunga 3s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  /* Fliken: en triangel ovanpå kuvertet. */
  .kuvert::before {
    content: "";
    position: absolute;
    inset: 0 0 35% 0;
    background: linear-gradient(#E9DBBE, #D8C49E);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
  }
  .sigill {
    position: absolute;
    left: 50%; top: 65%;
    width: 52px; height: 52px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #D9504F, #9A1F27 70%);
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    display: grid; place-items: center;
    font-size: 24px;
  }
  .vantar { min-height: 1.4em; margin: 0; color: var(--himmel-dampad); font-size: 14px; }

  .brev {
    margin: 24px auto;
    max-width: 380px;
    padding: 24px 22px;
    border-radius: 14px;
    background: #FBF4EA;
    color: #3B2E25;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
    font: 500 25px/1.3 Caveat, "Segoe Print", cursive;   /* tomtens handstil, bara här */
  }
  .brev p { margin: 0 0 16px; }
  .brev .knapp { font-family: var(--text-typsnitt); }
  .brev .underskrift { text-align: right; font-style: italic; }
  .brev .knapp.ljus { color: #6B5A4E; border-color: rgba(59,46,37,.3); }
  .brev .knapp.ljus:hover { color: #3B2E25; border-color: rgba(59,46,37,.55); }

  /* ===== Skåpet ===== */
  .skap {
    position: relative;
    margin: 0 auto 16px;
    max-width: 420px;
    aspect-ratio: 4 / 5;
    border-radius: 22px;
    background: linear-gradient(160deg, #3A4A63, #222E42 70%);
    border: 3px solid #56657E;
    box-shadow: 0 6px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.12);
    perspective: 900px;
  }
  /* Det inre som syns när dörren är öppen. */
  .inne {
    position: absolute;
    inset: 14px;
    border-radius: 14px;
    background: radial-gradient(ellipse at 50% 30%, #1E2B44, #0D1525 80%);
    box-shadow: inset 0 6px 18px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .dorr {
    position: absolute;
    inset: 10px;
    border-radius: 16px;
    background: linear-gradient(160deg, #46587A, #2A3852 75%);
    border: 2px solid #6A7A96;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    transform-origin: left center;
    transition: transform 1.1s cubic-bezier(.5,.1,.3,1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .dorr.oppen { transform: rotateY(-108deg); pointer-events: none; }
  .dorr.ryck { animation: skaka .3s ease-in-out; }
  /* Nitar i hörnen. */
  .nit { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #9AA7BD; box-shadow: inset 0 -1px 0 rgba(0,0,0,.3); }
  .nit.a { left: 10px; top: 10px; } .nit.b { right: 10px; top: 10px; } .nit.c { left: 10px; bottom: 10px; } .nit.d { right: 10px; bottom: 10px; }

  .lampknapp {
    width: 46px; height: 46px;
    border: 3px solid #6A7A96;
    border-radius: 50%;
    padding: 0;
    background: radial-gradient(circle at 40% 35%, #4A3A30, #241A15 75%);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lampknapp:active { transform: scale(.94); }
  .lampknapp { position: relative; }
  /* Ljuset ligger i ett eget lager så att det kan slockna långsamt. */
  .lampknapp::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #FFF6C8, #FFCF45 55%, #D3921A);
    box-shadow: 0 0 20px 6px rgba(255,205,70,.55);
    opacity: 0; transition: opacity 10s linear;
  }
  .lampknapp.lyser::after { opacity: 1; transition: opacity .6s; }
  .lampknapp.lyser { animation: puls 1.6s ease-in-out infinite; }
  @keyframes puls { 50% { transform: scale(1.1); } }
  .lampraden { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* Springan under lampan. När det är ens tur glider Mästarprovets kuvert ut. */
  .springa { position: relative; width: 132px; height: 7px; border-radius: 4px; background: #0E1524; box-shadow: inset 0 2px 3px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.12); }
  /* Mästarprovets kuvert: samma kuvert i springan och under skåpet. */
  /* Kuvertet glider ut i ett stycke ur springan; utkastet klipper bort det som ännu är inne. */
  @keyframes gliUt { from { transform: translateY(-100%); } to { transform: none; } }
  .utkast { position: absolute; left: 4px; top: 4px; width: 124px; height: 79px; overflow: hidden; }
  .litet-kuvert {
    position: relative; width: 124px; height: 76px;
    overflow: hidden; padding: 0; border: 0; border-radius: 0 0 8px 8px;
    background: linear-gradient(#F3E8D2, #E2D2B2);
    color: #3B2E25; font: 700 19px/1 Caveat, "Segoe Print", cursive;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    cursor: pointer;
  }
  .litet-kuvert::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%; background: linear-gradient(#E9DBBE, #D8C49E); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .litet-kuvert .lack {
    position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%);
    border-radius: 50%; display: grid; place-items: center; font-size: 13px;
    background: radial-gradient(circle at 40% 35%, #D9504F, #9A1F27 70%);
    box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(0,0,0,.12);
  }
  .litet-kuvert .lack.guld { background: radial-gradient(circle at 40% 35%, #FBE08A, #C9951E 70%); }
  .litet-kuvert .etikett { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
  .provkuvert { display: block; animation: gliUt .9s ease-out .3s both; }
  .provkuvert.knuff { animation: gunga .5s ease-in-out; }
  .lampraden.tur { margin-bottom: 70px; }
  .svarskuvert { display: block; margin: 0 auto 8px; border-radius: 8px; animation: upp .5s ease-out; }

  /* Mästarprovet läggs ovanpå skåpet. */
  .prov {
    position: absolute; inset: 10px; z-index: 6;
    border-radius: 16px; background: #FBF6EC; color: #3A3127;
    padding: 22px 20px; overflow: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; animation: upp .3s ease-out;
  }
  .prov .mal { margin: 0; font: 700 24px/1.25 var(--rubrik-typsnitt); }
  .prov p { margin: 0; line-height: 1.45; }
  .prov .stor-siffra { font: 700 84px/1 var(--rubrik-typsnitt); color: #8A3B2E; animation: oppna .6s ease-out; }
  .prov .knapp { width: auto; }
  .prov .platshallare { color: #7A6A55; }
  .prov .inledning { font-size: 16px; }
  .prov .skill { font-style: italic; color: #6B5A4E; font-size: 15px; }
  /* Spelet i Mästarprovet fyller hela skärmen. */
  .provspel { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--himmel); animation: upp .3s ease-out; }
  .provspel .topp { display: flex; align-items: center; gap: 8px; padding: 10px 12px calc(10px) 16px; padding-top: max(10px, env(safe-area-inset-top)); background: #0E1830; color: var(--himmel-text); }
  .provspel .topp .mal { flex: 1; margin: 0; font: 700 18px/1.2 var(--rubrik-typsnitt); }
  .provspel .stang { flex: none; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; background: transparent; color: var(--himmel-text); font-size: 18px; cursor: pointer; }
  .provspel .hjalp { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; background: #FBF6EC; color: #3A3127; text-align: center; }
  .provspel .hjalp p { margin: 0; font-size: 15px; line-height: 1.4; animation: upp .3s ease-out; }
  .provspel .hjalp .rad { display: flex; gap: 8px; justify-content: center; }
  .provspel .hjalp .knapp { width: auto; margin: 0; padding: 8px 14px; font-size: 15px; }
  .provspel .hjalp .knapp.ljus { color: #6B5A4E; border-color: rgba(59,46,37,.35); }
  .provspel iframe { flex: 1; width: 100%; border: 0; background: var(--himmel); }

  .hjulen { display: flex; justify-content: center; gap: 8px; }
  .hjulen.skakar { animation: skaka .45s ease-in-out; }
  .hjul { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hjul b {
    display: block;
    width: 52px;
    padding: 8px 0;
    border-radius: 10px;
    background: linear-gradient(#EDE6D8, #C8BEA9);
    color: #2B2B2B;
    font: 600 32px var(--text-typsnitt);
    font-variant-numeric: tabular-nums;
    text-align: center;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.25);
  }
  .pil {
    width: 52px;
    padding: 5px 0;
    border: 0;
    border-radius: 9px;
    background: rgba(255,255,255,.1);
    color: var(--himmel-text);
    font-size: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pil:active { background: rgba(255,255,255,.2); }
  .hjulen.last .pil { opacity: .3; pointer-events: none; }

  /* Vredet: man vrider (trycker) för att pröva koden. */
  /* Ratten: en gammal kassaskåpsratt med ekrar. Man vrider (trycker) för att pröva koden. */
  .vred {
    width: 92px; height: 92px;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    transition: transform .6s cubic-bezier(.4,.1,.3,1);
    -webkit-tap-highlight-color: transparent;
  }
  .vred svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .vred.vrids { transform: rotate(180deg); }
  .vred:disabled { cursor: default; opacity: .7; }
  .hanglas { min-height: 22px; margin: -10px 0 0; color: #FFB4A6; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ===== Inuti: platshållare för akt 2 och 3 ===== */
  .scen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; text-align: center; }
  .smadorrar { display: flex; gap: 14px; }
  .hylla { display: flex; gap: 8px; padding-bottom: 10px; border-bottom: 6px solid #6B4E3A; }
  .plats { width: 58px; height: 58px; border: 2px dashed rgba(255,255,255,.3); border-radius: 8px; }
  .platshallare { margin: 0; font-size: 14px; color: var(--himmel-dampad); }

  /* ===== Akt 2: Pyssels dörr och granen ===== */
  .dorrplats { position: relative; width: 130px; height: 184px; perspective: 420px; }
  .dorrplats .bakom {
    position: absolute; inset: 0; border-radius: 10px; border: 0; padding: 0;
    background: radial-gradient(ellipse at 50% 45%, #3B3020, #120E08 85%); box-shadow: inset 0 4px 14px rgba(0,0,0,.7);
    font-size: 40px; display: grid; place-items: center; color: inherit;
  }
  .dorrplats .bakom:disabled { cursor: default; }
  .dorrplats .bakom:not(:disabled) { cursor: pointer; animation: lysBakom 2.4s ease-in-out infinite; }
  @keyframes lysBakom { 50% { box-shadow: inset 0 4px 14px rgba(0,0,0,.7), 0 0 18px rgba(255,214,107,.45); } }
  .smadorr {
    position: absolute; inset: 0; border-radius: 10px; border: 3px solid;
    transform-origin: left center; transition: transform .9s cubic-bezier(.3,.7,.3,1);
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
  }
  .smadorr.lila { border-color: #B58CFF; background: linear-gradient(160deg, #5A4185, #3A2A5C); }
  .smadorr.gron { border-color: #6FD49A; background: linear-gradient(160deg, #2F6E4D, #1D4A33); }
  .smadorr .skylt {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.3); font-size: 13px; font-weight: 600; color: #F4F1EA;
  }
  .smadorr .fylling {
    position: absolute; inset: 38px 13px 14px; border-radius: 6px;
    border: 2px solid rgba(255,255,255,.16); box-shadow: inset 0 0 0 4px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; padding-top: 12px;
  }
  .smadorr .handtag {
    position: absolute; right: 8px; top: 54%; width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFE9A8, #C9952E 60%, #7C5A17); box-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .smadorr[role="button"] { cursor: pointer; }
  .smadorr.glant {
    transform: rotateY(-24deg);
    box-shadow: 10px 0 18px -4px rgba(255,214,107,.55), 0 4px 0 rgba(0,0,0,.35);
    animation: glant 2.6s ease-in-out infinite;
  }
  @keyframes glant { 50% { transform: rotateY(-32deg); box-shadow: 14px 0 22px -2px rgba(255,214,107,.7), 0 4px 0 rgba(0,0,0,.35); } }
  .smadorr.oppen { transform: rotateY(-105deg); pointer-events: none; }
  /* Trassels dörr sitter på höger gångjärn, så att den öppnas utåt och inte över Pyssels. */
  .smadorr.gron { transform-origin: right center; }
  .smadorr.gron .handtag { right: auto; left: 6px; }
  .smadorr.gron .fylling { left: 24px; right: 10px; }
  .smadorr.gron.oppen { transform: rotateY(100deg); }
  .lampor { display: flex; gap: 6px; }
  .liten-lampa { width: 14px; height: 14px; border-radius: 50%; background: #11151C; box-shadow: inset 0 2px 3px rgba(0,0,0,.6), 0 0 0 1.5px rgba(255,255,255,.18); transition: background .2s, box-shadow .2s; }
  .liten-lampa.tand { box-shadow: 0 0 8px currentColor, 0 0 14px currentColor; }
  .akt2-under { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .fargknappar { display: grid; grid-template-columns: repeat(2, 36px); gap: 8px; }
  .fargknapp { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; box-shadow: inset -5px -6px 0 rgba(0,0,0,.18), inset 5px 5px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35); }
  .fargknapp:active { transform: translateY(2px); box-shadow: inset -5px -6px 0 rgba(0,0,0,.18), inset 5px 5px 0 rgba(255,255,255,.3), 0 1px 0 rgba(0,0,0,.35); }
  .bladder { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
  .bladder-sida { min-height: 112px; display: flex; align-items: center; justify-content: center; }
  .bladder-rad { display: flex; align-items: center; justify-content: space-between; }
  .bladder .pil { width: 52px; height: 44px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #F4F1EA; font-size: 26px; line-height: 1; cursor: pointer; }
  .bladder .sidnr { color: var(--himmel-dampad); font-size: 15px; }
  .nyckelsida { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 10px 14px; border-radius: 12px; background: #F4EBDC; color: #3B2E25; }
  .nyckelsida .par { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 20px; }
  .nyckelsida .sym { font-size: 30px; }
  .kodbrev { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; width: 100%; padding: 16px 8px; border-radius: 12px; background: #F4EBDC; color: #3B2E25; }
  .kodbrev .tecken { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 40px; }
  .kodbrev .sym { font-size: 30px; line-height: 1.2; }
  .helt-brev { margin: 0; font-size: 15px; color: #F4F1EA; max-width: 330px; }
  .kodbrev input {
    width: 34px; height: 38px; box-sizing: border-box; padding: 0; text-align: center;
    border: 0; border-bottom: 2px solid #8A6A55; background: rgba(255,255,255,.55); border-radius: 4px 4px 0 0;
    font: 700 20px var(--text-typsnitt); color: #3B2E25; text-transform: uppercase;
  }
  .kodbrev input:focus { outline: 2px solid #E5484D; outline-offset: 1px; }
  .brevscen .falt { margin-top: 4px; }
  .granscen { justify-content: flex-start; gap: 10px; padding-top: 12px; }
  .granscen .bakat { align-self: flex-start; background: none; border: 0; color: var(--himmel-dampad); font: inherit; font-size: 15px; padding: 4px 2px; cursor: pointer; }
  .hemligt { margin: 0; font-weight: 600; color: #FFD66B; }
  .gran-svg { width: 100%; max-width: 270px; height: auto; display: block; }
  .gran-svg .plats { cursor: pointer; outline: none; }
  .gran-svg .plats:focus-visible circle:first-child { stroke: #FFD66B; stroke-width: 2; }
  .gran-svg.las .plats { cursor: default; }
  .gran-svg .kula { transform-box: fill-box; transform-origin: center; transition: transform .2s, filter .2s; }
  .gran-svg.blinkar .plats.lyser .kula { transform: scale(1.2); filter: brightness(1.35) drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor); }
  .pyntlada { display: grid; gap: 6px; padding: 8px 10px; border-radius: 14px; background: #6B4E3A; box-shadow: inset 0 3px 0 rgba(0,0,0,.25), 0 3px 0 rgba(0,0,0,.3); }
  .pyntlada button { width: 54px; height: 54px; border-radius: 12px; border: 3px solid transparent; background: rgba(0,0,0,.18); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .pyntlada button[aria-pressed="true"] { border-color: #FFD66B; background: rgba(255,214,107,.18); }
  .pyntlada .ladrad { display: flex; gap: 8px; }
  .pyntlada .farg { height: 38px; }
  .pyntlada .fargklick { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.2); }
  .granscen .tips { margin: 0; font-size: 14px; color: var(--himmel-dampad); max-width: 300px; }

  /* Ett textfält med "Fel" direkt under, så att tangentbordet inte döljer det. */
  .falt { width: 100%; max-width: 300px; text-align: left; }
  .falt .rad { display: flex; gap: 8px; }
  .falt input {
    flex: 1; min-width: 0; box-sizing: border-box;
    padding: 10px 12px;
    border: 2px solid rgba(255,255,255,.18);
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    color: var(--himmel-text);
    font: 16px var(--text-typsnitt);
    text-transform: uppercase;
  }
  .falt input:focus { outline: none; border-color: var(--glod); }
  .falt .knapp { flex: none; width: auto; margin: 0; padding: 10px 16px; }
  .falt .fel { min-height: 1.3em; margin: 6px 2px 0; color: #FFB4A6; font-weight: 600; font-size: 14px; }

  /* ===== Pratbubblor ===== */
  .prat {
    position: absolute;
    left: 8px; right: 8px; bottom: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 5;
    cursor: pointer;
  }
  .prat .rad { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
  @keyframes upp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .figur {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 3px solid;
    background: #14233F;
    display: grid; place-items: center;
    font-size: 25px;
    box-shadow: 0 3px 0 rgba(0,0,0,.35);
    transition: opacity .2s, transform .2s;
  }
  .figur.tyst { opacity: .4; transform: scale(.88); }
  .figur.tomten { border-color: #E5484D; animation: upp .3s ease-out; }
  .prat .vanster { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .figur.pyssel { border-color: #B58CFF; }
  .figur.trassel { border-color: #6FD49A; }
  /* Bubblan har den pratandes färg och en liten pil mot den som pratar. */
  .bubbla {
    position: relative;
    flex: 1;
    min-width: 0;
    padding: 10px 12px 14px;
    border-radius: 16px;
    color: #2B2B2B;
    font-size: 16px;
    line-height: 1.4;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    animation: upp .3s ease-out;
  }
  .bubbla::after { content: ""; position: absolute; width: 14px; height: 14px; background: inherit; }
  .bubbla.pyssel { background: #EADFFF; border-bottom-left-radius: 4px; }
  .bubbla.pyssel::after { left: -6px; bottom: 6px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .bubbla.trassel { background: #DDF5E6; border-bottom-right-radius: 4px; }
  .bubbla.trassel::after { right: -6px; bottom: 6px; clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .bubbla.tomten { background: #FFE3DE; font-size: 17px; min-height: 98px; }
  .bubbla.tomten::after { left: -7px; bottom: 68px; clip-path: polygon(100% 0, 100% 100%, 0 50%); }
  .bubbla .vem { display: block; margin-bottom: 2px; font-size: 14px; font-weight: 600; color: #5E5168; }
  .bubbla .mer { position: absolute; right: 10px; bottom: 4px; font-size: 13px; color: #7A6E80; }

  /* ===== Prisutdelningen ===== */
  .skap.hog { aspect-ratio: auto; height: 580px; }
  .pris { position: absolute; inset: 0; z-index: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .paketen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .paket {
    position: relative;
    height: 178px;
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: rgba(255,255,255,.05);
    border: 2px solid rgba(255,255,255,.12);
    color: var(--himmel-text);
    text-align: center;
  }
  .paket .ask { font-size: 54px; line-height: 1; }
  .paket .lapp { font-size: 13px; color: var(--himmel-dampad); }
  .paket.gungar .ask { animation: gunga .5s ease-in-out infinite; }
  @keyframes oppna { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: none; opacity: 1; } }
  .paket.oppen { justify-content: flex-start; align-items: stretch; gap: 3px; padding: 8px 8px 6px; background: #FBF6EC; border-color: #E6D9BF; color: #3A3127; text-align: left; font-size: 12.5px; line-height: 1.28; animation: oppna .5s ease-out; }
  .paket.oppen .namn { font-weight: 700; font-size: 15px; }
  .paket.oppen .plats-text { color: #7A6A55; font-size: 12px; margin-top: -3px; }
  .paket.oppen .titel { margin-top: auto; padding-top: 3px; border-top: 1px dashed #D8C8A8; font-style: italic; color: #8A3B2E; }
  .paket.mastare { border-color: var(--guld); box-shadow: 0 0 0 3px rgba(242,194,48,.35), 0 0 22px rgba(242,194,48,.45); }
  .paket .stjarna { position: absolute; top: -12px; right: -6px; font-size: 26px; animation: upp .4s ease-out; }
  .snoet { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .snoet span { position: absolute; top: -20px; color: #fff; opacity: .85; animation: falla linear infinite; }
  @keyframes falla { to { transform: translateY(460px) rotate(200deg); } }
  .pris .slut { margin-top: auto; text-align: center; }
  .pris .slut .knapp { width: auto; display: inline-block; text-decoration: none; }
  .pris .info { margin: auto 0; text-align: center; color: var(--himmel-dampad); }

  /* ===== Testläget ===== */
  .testruta { margin: 0 0 16px; padding: 12px 14px; border: 2px dashed var(--glod); border-radius: 14px; font-size: 14px; }
  .testruta p { margin: 0 0 8px; }
  .testruta b { color: var(--glod); }
  .hopp { display: flex; flex-wrap: wrap; gap: 6px; }
  .hopp button { padding: 6px 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; background: transparent; color: var(--himmel-text); font: 14px var(--text-typsnitt); cursor: pointer; }
  .hopp button.nu { background: var(--glod); color: #2F4A3A; border-color: var(--glod); }
  .hopp span { align-self: center; font-size: 14px; }
  .hopp button:disabled { opacity: .4; cursor: default; }
  .knappar { display: flex; justify-content: center; margin: 24px 0; }
</style>

<body>
<main class="spalt">
  <a class="tillbaka" href="../../">← Kalendern</a>
  <h1>Tomtens kassaskåp <span class="ovning" id="testmarke" hidden>Testläge</span></h1>

  <div class="testruta" id="testruta" hidden>
    <p>Exempelkod till sifferlåset: <b id="testKod"></b>. Exempelord för akt 2: <b id="testOrd"></b>. Exempelfärger: <b id="testFarg"></b>.</p>
    <div class="hopp" id="hopp"></div>
    <div class="hopp" id="exempel" style="margin-top:8px"></div>
  </div>

  <div id="scen"></div>

  <div class="knappar">
    <button class="knapp diskret" id="vaxla" type="button"></button>
  </div>
</main>

<script src="../../js/gemensam.js?v=5"></script>
<script src="../../js/luckor.js?v=24"></script>
<script src="../../js/resultat.js?v=3"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dag = Advent.hamtaDag() || 24;
  Advent.markeraOppnad(dag);

  var LAS_TID = 10;

  // Kassaskåpsratt: ring, sex ekrar med knoppar och ett nav i mitten.
  var RATT_SVG = (function () {
    var ekrar = '';
    for (var i = 0; i < 6; i++) {
      var v = i * 60 * Math.PI / 180, x = 50 + 44 * Math.sin(v), y = 50 - 44 * Math.cos(v);
      ekrar += '<line x1="50" y1="50" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#B9C2D0" stroke-width="6" stroke-linecap="round"/>' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6.5" fill="#E3E8EF" stroke="#7D899C" stroke-width="1.5"/>';
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="31" fill="none" stroke="#9AA6B8" stroke-width="6"/>' + ekrar +
      '<circle cx="50" cy="50" r="13" fill="#D3D9E2" stroke="#7D899C" stroke-width="2"/>' +
      '<circle cx="50" cy="50" r="4" fill="#7D899C"/></svg>';
  })();   // sekunder som hjulen är låsta efter fel kod

  // Svaren jämförs som hashar, så att de riktiga svaren inte står i klartext här.
  // Exempelsvaren i testläget får synas. De riktiga fylls i när pusslen är byggda (null = inte klart än).
  var SALT = 'kassaskap-2026:';
  function hash(svar) { return String(Advent.hashStrang(SALT + svar)); }
  var SVAR = {
    test: {
      kod: '3816', ord: 'GRAN',
      brev: 'JAG HAR NÅLAR MEN SYR ALDRIG',
      // Pyssels gran: femton platser, rad för rad uppifrån (1, 2, 3, 4, 5), 'form:färg'. blink = ordningen kulorna lyser i när granen stämmer.
      gran: {
        pynt: ['stjarna:guld', 'kula:rod', 'klocka:bla', 'kapp:silver', '', 'kula:guld',
          'klocka:rod', 'stjarna:silver', '', 'kula:bla', '', 'kapp:rod', 'klocka:guld', 'stjarna:bla', ''],
        blink: ['guld', 'rod', 'silver', 'bla']
      }
    },
    riktig: { kod: null, ord: null, siffror: null, gran: null, brev: null }   // siffror: koden i klartext, fylls i vid nedlåsningen
  };

  // ===== Tillstånd =====
  // steg: kuvert → las (ytterdörren) → akt2 → akt3 → oppet
  var STEG = ['kuvert', 'las', 'akt2', 'akt3', 'oppet'];
  var STEG_NAMN = { kuvert: 'Kuvertet', las: 'Sifferlåset', akt2: 'Akt 2', akt3: 'Akt 3', oppet: 'Öppet' };
  var test = Advent.lasa('kassaskap-testlage', false);
  function nyckel() { return 'kassaskap:' + (test ? 'test' : dag); }
  function nyttTillstand() { return { steg: 'kuvert', hjul: [0, 0, 0, 0], lastTill: 0, sett: {}, testPlats: 0, testAntal: 0 }; }
  var s;
  function spara() { Advent.spara(nyckel(), s); ritaTest(); }
  function svar() { return SVAR[test ? 'test' : 'riktig']; }

  // Versaler, mellanslag och skiljetecken spelar ingen roll.
  function stada(t) { return String(t).toUpperCase().replace(/[^A-ZÅÄÖÉÜ0-9]/g, ''); }
  function stammer(gissning, facit) {
    if (facit == null) return false;
    return test ? stada(gissning) === stada(facit) : hash(stada(gissning)) === facit;
  }

  function el(tagg, klass, text) {
    var e = document.createElement(tagg);
    if (klass) e.className = klass;
    if (text != null) e.textContent = text;
    return e;
  }
  function skaka(e) {
    e.classList.remove('skakar');
    void e.offsetWidth;
    e.classList.add('skakar');
  }

  // ===== Pratbubblor =====
  var FIGURER = {
    tomten: { emoji: '🎅', namn: 'Tomten' },
    pyssel: { emoji: '👩‍🎤', namn: 'Pyssel' },
    trassel: { emoji: '🧑‍🎤', namn: 'Trassel' }
  };
  var pratRuta = null;

  // Bygger en pratruta: Pyssel och Trassel i var sitt hörn, tomten ovanför Pyssel när han pratar.
  // Den som inte pratar är nedtonad.
  function pratYta(vem, text, mer) {
    var f = FIGURER[vem];
    var ruta = el('div', 'prat');
    function figur(namn) {
      var e = el('div', 'figur ' + namn + (namn === vem ? '' : ' tyst'), FIGURER[namn].emoji);
      e.setAttribute('aria-hidden', 'true');
      return e;
    }
    var rad = el('div', 'rad');
    var bubbla = el('div', 'bubbla ' + vem);
    bubbla.appendChild(el('span', 'vem', f.namn));
    bubbla.appendChild(document.createTextNode(text));
    if (mer) bubbla.appendChild(el('span', 'mer', '▸'));
    var vanster = el('div', 'vanster');
    if (vem === 'tomten') vanster.appendChild(figur('tomten'));
    vanster.appendChild(figur('pyssel'));
    rad.appendChild(vanster);
    rad.appendChild(bubbla);
    rad.appendChild(figur('trassel'));
    ruta.appendChild(rad);
    return ruta;
  }

  // Visar repliker en i taget i skåpet. Tryck var som helst för nästa. repliker: [[vem, text], ...]
  function prata(yta, repliker, klar) {
    var i = 0;
    function visa() {
      if (pratRuta) pratRuta.remove();
      if (i >= repliker.length) { pratRuta = null; if (klar) klar(); return; }
      var r = repliker[i], mer = i < repliker.length - 1;
      var ruta = pratYta(r[0], r[1], mer);
      ruta.setAttribute('role', 'button');
      ruta.setAttribute('aria-label', FIGURER[r[0]].namn + ': ' + r[1] + (mer ? '. Tryck för nästa.' : ''));
      ruta.tabIndex = 0;
      ruta.addEventListener('click', function (e) { e.stopPropagation(); i++; visa(); });
      ruta.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); i++; visa(); } });
      yta.appendChild(ruta);
      pratRuta = ruta;
      ruta.focus({ preventScroll: true });
    }
    visa();
  }

  // En kort kommentar som försvinner själv efter ett par sekunder.
  function kommentar(yta, vem, text) {
    if (pratRuta) pratRuta.remove();
    var ruta = pratYta(vem, text, false);
    ruta.setAttribute('aria-live', 'polite');
    ruta.style.cursor = 'default';
    yta.appendChild(ruta);
    pratRuta = ruta;
    setTimeout(function () { if (pratRuta === ruta) { ruta.remove(); pratRuta = null; } }, 2600);
  }

  // Fel-repliker byts för varje fel och börjar om när de är slut.
  function roterande(lista) {
    var n = 0;
    return function () { var r = lista[n % lista.length]; n++; return r; };
  }

  // Ett textfält med "Fel" direkt under rutan. prova(text) ska returnera true om det stämde.
  function falt(etikett, prova) {
    var ruta = el('form', 'falt');
    var id = 'falt-' + Math.random().toString(36).slice(2, 8);
    var lbl = el('label', 'liten', etikett);
    lbl.htmlFor = id;
    lbl.style.display = 'block';
    lbl.style.marginBottom = '4px';
    lbl.style.color = 'var(--himmel-dampad)';
    var rad = el('div', 'rad');
    var inmatning = el('input');
    inmatning.id = id;
    inmatning.autocomplete = 'off';
    inmatning.autocapitalize = 'characters';
    inmatning.spellcheck = false;
    var knapp = el('button', 'knapp', 'Prova');
    knapp.type = 'submit';
    var fel = el('p', 'fel');
    fel.setAttribute('aria-live', 'polite');
    rad.appendChild(inmatning);
    rad.appendChild(knapp);
    ruta.appendChild(lbl);
    ruta.appendChild(rad);
    ruta.appendChild(fel);
    inmatning.addEventListener('input', function () { fel.textContent = ''; });
    ruta.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!inmatning.value.trim()) return;
      if (prova(inmatning.value)) return;
      fel.textContent = 'Fel';
      skaka(rad);
      inmatning.select();
    });
    return ruta;
  }

  // ===== Kuvertet =====
  function ritaKuvert(yta) {
    var ruta = el('div', 'kuvert-yta');
    var kuvert = el('button', 'kuvert');
    kuvert.type = 'button';
    kuvert.setAttribute('aria-label', 'Ett förseglat kuvert');
    var sigill = el('span', 'sigill', '🎄');
    sigill.setAttribute('aria-hidden', 'true');
    kuvert.appendChild(sigill);
    var vantar = el('p', 'vantar', s.vantar ? 'Tomten väntar.' : '');
    ruta.appendChild(kuvert);
    ruta.appendChild(vantar);
    yta.appendChild(ruta);
    kuvert.addEventListener('click', function () { ritaBrev(yta); });
  }

  function ritaBrev(yta) {
    yta.textContent = '';
    var brev = el('div', 'brev');
    brev.appendChild(el('p', null, 'Kära familj.'));
    brev.appendChild(el('p', null, 'Det har gått tjugotre dagar sedan jag lämnade adventskalendern hos er, och idag, på självaste julafton, har jag något särskilt i beredskap. Men det kräver fyra par händer och fyra telefoner. Är ni alla redo?'));
    brev.appendChild(el('p', 'underskrift', 'Tomten'));
    var ja = el('button', 'knapp', 'Ja, vi är redo');
    ja.type = 'button';
    var inte = el('button', 'knapp ljus', 'Inte än');
    inte.type = 'button';
    inte.style.marginTop = '10px';
    brev.appendChild(ja);
    brev.appendChild(inte);
    yta.appendChild(brev);
    ja.addEventListener('click', function () { s.steg = 'las'; s.vantar = false; spara(); rita(); });
    inte.addEventListener('click', function () { s.vantar = true; spara(); rita(); });
  }

  // ===== Skåpet =====
  function ritaSkap(yta) {
    var skap = el('div', 'skap');
    var inne = el('div', 'inne');
    skap.appendChild(inne);
    yta.appendChild(skap);
    if (s.steg === 'las') {
      var dorr = el('div', 'dorr');
      skap.appendChild(dorr);
      ritaDorr(dorr, inne);
    } else {
      ritaInne(inne);
    }
  }

  function ritaDorr(dorr, inne) {
    ['a', 'b', 'c', 'd'].forEach(function (k) { dorr.appendChild(el('span', 'nit ' + k)); });

    // Lampknappen lyser bara när det är ens tur. Släckt rycker dörren bara till.
    var lampraden = el('div', 'lampraden');
    var lampa = el('button', 'lampknapp');
    lampa.type = 'button';
    lampraden.appendChild(lampa);
    lampraden.appendChild(el('div', 'springa'));
    dorr.appendChild(lampraden);
    ritaLampa(lampa, lampraden);
    lampa.addEventListener('click', function () {
      var kuv = lampraden.querySelector('.provkuvert');
      if (kuv) { kuv.classList.remove('knuff'); void kuv.offsetWidth; kuv.classList.add('knuff'); return; }
      dorr.classList.remove('ryck'); void dorr.offsetWidth; dorr.classList.add('ryck');
      if (vakt.stoppad) borjaFraga(lampa, lampraden);   // tryck på en matt lampa startar frågandet igen
    });
    borjaFraga(lampa, lampraden);

    var hjulen = el('div', 'hjulen');
    dorr.appendChild(hjulen);
    var vred = el('button', 'vred');
    vred.type = 'button';
    vred.setAttribute('aria-label', 'Ratten');
    vred.innerHTML = RATT_SVG;
    dorr.appendChild(vred);
    var hanglas = el('p', 'hanglas');
    hanglas.setAttribute('aria-live', 'polite');
    dorr.appendChild(hanglas);

    function ritaHjul() {
      hjulen.textContent = '';
      s.hjul.forEach(function (v, i) {
        var h = el('div', 'hjul');
        var upp = el('button', 'pil', '▲');
        upp.type = 'button';
        upp.setAttribute('aria-label', 'Hjul ' + (i + 1) + ' upp');
        var siffra = el('b', null, String(v));
        var ner = el('button', 'pil', '▼');
        ner.type = 'button';
        ner.setAttribute('aria-label', 'Hjul ' + (i + 1) + ' ner');
        upp.addEventListener('click', function () { vrid(i, 1); });
        ner.addEventListener('click', function () { vrid(i, -1); });
        h.appendChild(upp);
        h.appendChild(siffra);
        h.appendChild(ner);
        hjulen.appendChild(h);
      });
    }
    function vrid(i, steg) {
      if (lastKvar() > 0) return;
      s.hjul[i] = (s.hjul[i] + steg + 10) % 10;
      spara();
      ritaHjul();
    }
    function lastKvar() { return Math.max(0, Math.ceil((s.lastTill - Date.now()) / 1000)); }

    var timer = null;
    function visaLas() {
      clearInterval(timer);
      function uppdatera() {
        var k = lastKvar();
        hjulen.classList.toggle('last', k > 0);
        vred.disabled = k > 0;
        hanglas.textContent = k > 0 ? '🔒 ' + k : '';
        if (k === 0) clearInterval(timer);
      }
      uppdatera();
      if (lastKvar() > 0) timer = setInterval(uppdatera, 250);
    }

    vred.addEventListener('click', function () {
      if (lastKvar() > 0) return;
      vred.classList.add('vrids');
      if (stammer(s.hjul.join(''), svar().kod)) {
        setTimeout(function () {
          dorr.classList.add('oppen');
          s.steg = 'akt2';
          spara();
          setTimeout(function () { ritaInne(inne); }, 700);
        }, 400);
        return;
      }
      setTimeout(function () {
        vred.classList.remove('vrids');
        skaka(hjulen);
        s.lastTill = Date.now() + LAS_TID * 1000;
        spara();
        visaLas();
      }, 400);
    });

    ritaHjul();
    visaLas();
    if (s.provKlar) setTimeout(function () { laggSvarskuvert(dorr.parentNode); }, 0);
  }

  // ===== Lampknapparna och turordningen =====
  // Ordningen lottas likadant på alla telefoner (samma frö). Lamporna tänds i den ordningen,
  // och ordningen på lamporna är ordningen på siffrorna i koden.
  var ORDNING_FRO = 'kassaskap-ordning-2026';
  var tur = { spelare: null, antal: 0 };   // från arket: vilka som finns och hur många som är klara med dag 24

  function ordning(spelare) { return blandaFast(spelare, ORDNING_FRO); }
  // Blandar namnen likadant på alla telefoner: sorterar först, sedan en blandning med fast frö.
  function blandaFast(spelare, fro) {
    var lista = spelare.slice().sort(function (a, b) { return a.localeCompare(b, 'sv'); });
    var slump = Advent.skapaSlump(fro);
    for (var i = lista.length - 1; i > 0; i--) {
      var j = Math.floor(slump() * (i + 1)), t = lista[i];
      lista[i] = lista[j];
      lista[j] = t;
    }
    return lista;
  }
  function minPlats() {
    if (test) return s.testPlats || 0;
    var namn = Advent.Resultat.namn();
    return tur.spelare && namn ? ordning(tur.spelare).indexOf(namn) : -1;
  }
  function klaraNu() { return test ? (s.testAntal || 0) : tur.antal; }
  function minTur() { var p = minPlats(); return p >= 0 && !s.provKlar && klaraNu() === p; }
  function siffraFor(plats) {
    var k = test ? SVAR.test.kod : SVAR.riktig.siffror;
    return k ? k.charAt(plats) : '?';
  }

  function ritaLampa(lampa, lampraden) {
    var lyser = minTur();
    lampa.classList.toggle('lyser', lyser);
    lampa.setAttribute('aria-label', lyser ? 'En lysande lampa' : 'En släckt lampa');
    lampraden.classList.toggle('tur', lyser);
    var springa = lampraden.querySelector('.springa');
    var kuv = springa.querySelector('.provkuvert');
    if (lyser && !kuv) {
      kuv = litetKuvert('provkuvert', '🎄', '');
      var utkast = el('div', 'utkast');
      kuv.addEventListener('click', function () {
        oppnaProv(lampraden.closest('.skap'), lampa, lampraden);
      });
      utkast.appendChild(kuv);
      springa.appendChild(utkast);
    } else if (!lyser && kuv) {
      kuv.parentNode.remove();
    }
  }

  // Mästarprovets kuvert. Rött sigill i springan, guldsigill när det ligger kvar under skåpet.
  function litetKuvert(klass, tecken, lackKlass) {
    var kuv = el('button', 'litet-kuvert ' + klass);
    kuv.type = 'button';
    kuv.setAttribute('aria-label', 'Kuvert: Mästarprovet');
    var lack = el('span', 'lack' + lackKlass, tecken);
    lack.setAttribute('aria-hidden', 'true');
    kuv.appendChild(lack);
    kuv.appendChild(el('span', 'etikett', 'Mästarprovet'));
    return kuv;
  }

  // Kuvertet med ens siffra, som ligger kvar under skåpet när provet är klart.
  // Siffertexten beror på hur provet gick: fullt mål, sänkt mål eller överhoppat.
  // Sänkt och överhoppat har fyra varianter, en per plats i turordningen, så att ingen får samma.
  function siffertext(namn) {
    var p = s.prov || {}, nr = Math.max(0, minPlats()) % 4;
    if (p.hur === 'sankt') return PROV_TEXT.sankt[nr].replace(/\{namn\}/g, namn);
    if (p.hur === 'hoppat') return PROV_TEXT.hoppat[nr].replace(/\{namn\}/g, namn);
    var spel = PROV_SPEL[p.dag] || PROV_SPEL[1];
    return spel.siffertext.replace(/\{namn\}/g, namn);
  }
  function provNamn() { return Advent.Resultat.namn() || (test ? 'Behnosh' : ''); }
  function visaSiffran(skap) {
    var prov = el('div', 'prov');
    prov.appendChild(el('p', null, siffertext(provNamn())));
    prov.appendChild(el('div', 'stor-siffra', siffraFor(minPlats())));
    var stang = el('button', 'knapp', 'Stäng');
    stang.type = 'button';
    prov.appendChild(stang);
    skap.appendChild(prov);
    return { prov: prov, stang: stang };
  }
  function laggSvarskuvert(skap) {
    var yta = skap.parentNode;
    if (yta.querySelector('.svarskuvert')) return;
    var kuv = litetKuvert('svarskuvert', '⭐', ' guld');
    kuv.addEventListener('click', function () {
      if (skap.querySelector('.prov')) return;
      var v = visaSiffran(skap);
      v.stang.addEventListener('click', function () { v.prov.remove(); });
    });
    yta.insertBefore(kuv, skap.nextSibling);
  }

  // Frågar arket hur många som är klara. Bara när sidan syns, bara medan man väntar på sin egen lampa,
  // aldrig i testläget eller före julafton. Var 5:e sekund i 10 minuter, sedan var 20:e, stopp efter en timme.
  // En fråga i taget, 30 sekunders paus efter fel.
  var vakt = { timer: null, start: 0, upptagen: false, stoppad: false, lampa: null, rad: null };
  function arJulafton() { var d = new Date(); return d.getMonth() === 11 && d.getDate() >= 24; }
  function stoppaFraga() { clearTimeout(vakt.timer); vakt.timer = null; vakt.lampa = null; }
  function borjaFraga(lampa, lampraden) {
    stoppaFraga();
    if (test || !arJulafton() || s.provKlar || !Advent.Resultat.kod()) return;
    vakt.lampa = lampa;
    vakt.rad = lampraden;
    vakt.start = Date.now();
    vakt.stoppad = false;
    fragaArket();
  }
  function fragaArket() {
    vakt.timer = null;
    if (!vakt.lampa || !document.body.contains(vakt.lampa)) return;
    if (document.hidden) return;   // fortsätter när sidan syns igen
    var gatt = Date.now() - vakt.start;
    if (gatt > 3600000) { vakt.stoppad = true; return; }
    if (vakt.upptagen) return;
    vakt.upptagen = true;
    Advent.Resultat.hamta(24).then(function (svar) {
      vakt.upptagen = false;
      tur.spelare = svar.spelare;
      tur.antal = svar.dag.antal;
      if (svar.dag.harSpelat && !s.provKlar) { s.provKlar = true; spara(); if (vakt.lampa) laggSvarskuvert(vakt.lampa.closest('.skap')); }
      if (!vakt.lampa) return;
      ritaLampa(vakt.lampa, vakt.rad);
      if (minTur() || s.provKlar) return;
      vakt.timer = setTimeout(fragaArket, gatt < 600000 ? 5000 : 20000);
    }, function () {
      vakt.upptagen = false;
      if (vakt.lampa) vakt.timer = setTimeout(fragaArket, 30000);
    });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && vakt.lampa && !vakt.timer && !vakt.upptagen && !vakt.stoppad) fragaArket();
  });

    },
    23: {

      nar: function (v, mal) { return Math.floor(v / 1000) >= Math.floor(mal / 1000); },
      skill: 'Stadig hand på slädens tyglar, och inga skorstenar i vägen.',
      siffertext: 'Skorstenarna darrar fortfarande. Ingen har flugit tomtens släde så djärvt som du, {namn}, och tomten själv tog av sig luvan i beundran. Ta emot din siffra, himlarnas härskare.',
      reserv: 5 * 1000
    },
    14: {
      // värdet är tiden i tiondelar × 10 000 + drag, tiden jämförs i hela sekunder som den visas
      namn: 'Femtonspel', sokvag: '../femton/',
      sek: function (v) { return Math.round(Math.floor(v / 10000) / 10); },
      malText: function (v) { return 'Femtonspel. Högst ' + Advent.formateraTid(this.sek(v)) + '.'; },
      sank: function (v) { return Math.round(this.sek(v) * 1.4) * 10 * 10000 + 9999; },
      nar: function (v, mal) { return this.sek(v) <= this.sek(mal); },
      skill: 'Snabba fingrar, och en plan för varenda bricka.',
      siffertext: 'Brickorna gled på plats som av trolldom. Tomten har sett många pusselläggare, {namn}, men ingen med sådana fingrar. Här är din belöning, en siffra ur skåpets hemlighet.',

      sank: function (v) { return Math.round(v * 1.4); },
      nar: function (v, mal) { return v <= mal; },
      skill: 'Ett säkert lokalsinne, även när mörkret ligger tätt.',
      siffertext: 'Gångarna slingrade och väggarna lurade, men du hittade rätt väg, {namn}. Inte ens tomtens egna renar hittar ut så snabbt. Ta emot din siffra, labyrintens erövrare.',
      reserv: 900
    },
    10: {

      namn: 'Minesweeper', sokvag: '../minesweeper/',
      malText: function (v) { return 'Minesweeper. Högst ' + v.toFixed(1).replace('.', ',') + ' s.'; },
      sank: function (v) { return Math.round(v * 14) / 10; },
      nar: function (v, mal) { return Math.round(v * 10) <= Math.round(mal * 10); },
      skill: 'Kall logik, och ett finger som aldrig gissar.',
      siffertext: 'Inte en mina fick sista ordet! Du läste banan som en öppen bok, {namn}, och minorna fick ge sig. Tomten överlämnar högtidligt din siffra till den modigaste i familjen.',

  };
  var PROV_TEXT = {
    // Inledningen: fyra öppningar per sort, en per plats i turordningen.
    vann: [

      'Där satt det, {namn}! Vägen var längre än väntat, men du gick den hela. Tomten bugar för din envishet. Här är din siffra.',
      'Seger, {namn}! Stjärnorna stod inte på din sida i kväll, men du vann ändå. Nordpolen hedrar dig. Ta emot din siffra.',
      'Du klarade det, {namn}! Ett mästarprov är inget för de svaga, och du stod kvar till slutet. Tomten räcker dig din siffra med stolthet.'
