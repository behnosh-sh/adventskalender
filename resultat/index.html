<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alla resultat</title>
<meta name="theme-color" content="#14233F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../css/gemensam.css?v=4">
<style>
  h1 { margin: 4px 0 2px; font-size: 30px; line-height: 1.1; }
  .under { margin: 0 0 16px; color: var(--himmel-dampad); font-size: 14px; }
  #status { color: var(--himmel-dampad); }
  /* En rad per lucka. Spelade luckor går att fälla ut. */
  .dag { padding: 0; }
  .dag:last-child { border-bottom: 1px solid rgba(255,255,255,.14); }
  .dag > summary, .dag > .huvud { list-style: none; display: flex; align-items: center; gap: 10px; padding: 13px 2px; text-decoration: none; color: inherit; }
  .dag > summary { cursor: pointer; }
  .dag > summary::-webkit-details-marker { display: none; }
  .dag .nr { width: 24px; flex: none; color: var(--himmel-dampad); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dag .titel { flex: 1; min-width: 0; font-weight: 600; }
  .dag .kort-svar { font-size: 14px; color: var(--himmel-dampad); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .dag .kort-svar b { color: var(--himmel-text); font-weight: 600; }
  .dag.last .titel { color: var(--himmel-dampad); font-weight: 400; }
  .dag.last .kort-svar { text-decoration: underline; text-underline-offset: 3px; }
  .dag[open] > summary .kort-svar { visibility: hidden; }
  .dag .tavla-lista { padding: 0 0 10px 34px; }
  .tavla-rad { padding: 7px 0; }
  #kodruta { margin-bottom: 14px; }
</style>
</head>
<body>
<main class="spalt">
  <a class="tillbaka" href="../">← Kalendern</a>
  <h1>Alla resultat</h1>
  <p class="under">Tryck på en lucka för att se hela tavlan.</p>
  <section id="kodruta" hidden></section>
  <p class="tavla-info" id="status">Hämtar…</p>
  <div class="dagar" id="dagar"></div>
  <p class="tavla-vem" id="vem" hidden></p>
</main>

<script src="../js/gemensam.js?v=2"></script>
<script src="../js/luckor.js?v=12"></script>
<script src="../js/resultat.js?v=3"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // Samma regel som startsidan: under bygget är alla luckor öppna, sedan bara t.o.m. dagens datum.
  var nu = new Date();
  var idag = nu.getFullYear() === 2026 && nu.getMonth() === 11 ? Math.min(nu.getDate(), 24) : (nu.getFullYear() > 2026 ? 24 : 0);
  function synlig(n) { return window.LUCKOR[n] && (window.ALLA_OPPNA || n <= idag); }

  function el(tagg, klass, text) {
    var e = document.createElement(tagg);
    if (klass) e.className = klass;
    if (text != null) e.textContent = text;
    return e;
  }

  // Kort sammanfattning till höger på raden: vinnaren och dennes resultat.
  function sammanfattning(n, d, svar) {
    var rader = Advent.Resultat.ordna(n, d, svar.spelare);
    var forst = rader.filter(function (r) { return r.status === 'klar'; })[0];
    var span = el('span', 'kort-svar');
    if (!forst) { span.textContent = d.antal + ' av ' + svar.spelare.length + ' har spelat'; return span; }
    var medalj = { guld: '🥇 ', silver: '🥈 ', brons: '🥉 ' }[forst.medalj] || '';
    span.appendChild(document.createTextNode(medalj));
    span.appendChild(el('b', null, forst.spelare));
    span.appendChild(document.createTextNode(' ' + forst.text));
    return span;
  }

  function rita(svar) {
    $('status').hidden = true;
    var lista = $('dagar');
    lista.textContent = '';
    var visade = 0;
    for (var n = 24; n >= 1; n--) {
      if (!synlig(n)) continue;
      var d = svar.dagar[n];
      var titel = window.LUCKOR[n].titel;
      var rad;
      if (d.harSpelat) {
        rad = el('details', 'dag kort');
        var sum = el('summary');
        sum.appendChild(el('span', 'nr', String(n)));
        sum.appendChild(el('span', 'titel', titel));
        sum.appendChild(sammanfattning(n, d, svar));
        rad.appendChild(sum);
        var ol = el('ol', 'tavla-lista');
        Advent.Resultat.ritaRader(ol, n, d, svar.spelare, svar.namn);
        rad.appendChild(ol);
      } else {
        // Andras resultat syns först när man själv har spelat.
        rad = el('div', 'dag kort last');
        var lank = el('a', 'huvud');
        lank.href = '../' + window.LUCKOR[n].sokvag + '?dag=' + n;
        lank.appendChild(el('span', 'nr', String(n)));
        lank.appendChild(el('span', 'titel', titel));
        lank.appendChild(el('span', 'kort-svar', '🔒 spela först'));
        rad.appendChild(lank);
      }
      lista.appendChild(rad);
      visade++;
    }
    if (!visade) { $('status').hidden = false; $('status').textContent = 'Inga luckor är öppna än.'; }
    $('vem').hidden = false;
    $('vem').textContent = 'Du är ' + svar.namn + ' · ';
    var byt = el('button', 'lanklik', 'Byt person');
    byt.type = 'button';
    byt.addEventListener('click', function () { Advent.Resultat.glomKod(); location.reload(); });
    $('vem').appendChild(byt);
  }

  function ladda() {
    if (!Advent.Resultat.arInkopplad()) { $('status').textContent = 'Resultattavlan är inte inkopplad än.'; return; }
    if (!Advent.Resultat.kod()) { visaKodruta(); return; }
    Advent.Resultat.alla().then(rita, function (fel) {
      if (!Advent.Resultat.kod()) { visaKodruta(); return; }
      $('status').textContent = fel.message;
    });
  }

  // Samma kodruta som i luckorna. Tavlan för lucka 1 används bara för att logga in, sedan laddas sidan om.
  function visaKodruta() {
    $('status').hidden = true;
    $('kodruta').hidden = false;
    Advent.Resultat.tavla($('kodruta'), 1, {
      vidStatus: function (d) { if (d) location.reload(); }
    });
    $('kodruta').querySelector('h2').textContent = 'Vem är du?';
  }

  ladda();
})();
</script>
</body>
</html>
